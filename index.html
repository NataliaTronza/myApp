function floatPts(el,txt,color){
  if(!el||REDUCED())return;
  const r=el.getBoundingClientRect();if(!r.width&&!r.height)return;
  const f=document.createElement('div');f.className='flt';f.textContent=txt;f.style.color=color;
  f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top-4)+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),950)}

/* вибух квадратиків від значка; якщо відкрите вікно — за карткою, щоб не лізти на текст */
function confetti(cols,origin){
  if(REDUCED())return;
  const box=document.createElement('div');box.className='cf';
  let x=innerWidth/2,y=innerHeight*.32;
  if(origin){const r=origin.getBoundingClientRect();if(r.width){x=r.left+r.width/2;y=r.top+r.height/2}}
  for(let i=0;i<60;i++){const q=document.createElement('i'),a=Math.random()*Math.PI*2,dist=110+Math.random()*190;
    q.style.left=x+'px';q.style.top=y+'px';q.style.background=cols[i%cols.length];
    q.style.setProperty('--s',(6+Math.random()*7).toFixed(0)+'px');
    q.style.setProperty('--dx',(Math.cos(a)*dist).toFixed(0)+'px');
    q.style.setProperty('--dy',(Math.sin(a)*dist*.8-70).toFixed(0)+'px');
    q.style.setProperty('--rot',((Math.random()-.5)*900).toFixed(0)+'deg');
    q.style.setProperty('--d',(1.5+Math.random()*1.1).toFixed(2)+'s');
    q.style.setProperty('--dl',(Math.random()*.12).toFixed(2)+'s');
    box.appendChild(q)}
  (veil.classList.contains('on')?veil:document.body).appendChild(box);setTimeout(()=>box.remove(),3000)}

function rhythmRow(s){
  const r=rhy(s.k);
  if(r.mode==='week'){const a=weekPts(weekStart(today()),s.k),pc=Math.min(100,Math.round(a/r.norm*100));
    return '<div class="sc-r"><span>тиждень</span><span class="gb"><i style="width:'+pc+'%;background:'+s.color+'"></i></span>'
      +'<span style="color:'+(a>=r.norm?s.color:'inherit')+'">'+a+'/'+r.norm+'</span></div>'}

  if(r.mode==='state'){const g=gaugeNow(s.k),col=g<25?TV['--bad']:s.color;
    return '<div class="sc-r"><span>стан</span><span class="gb"><i style="width:'+g+'%;background:'+col+'"></i></span>'
      +'<span style="color:'+(g<25?TV['--bad']:'inherit')+'">'+g+'%</span></div>'}

const DORD=Object.fromEntries(DIFF.map((d,i)=>[d.k,i]));
const SORTS=[{k:'def',label:'звичайно'},{k:'diff',label:'складність'},{k:'abc',label:'абетка'}];

function renderSort(){

function renderTasks(){
  const box=document.getElementById('taskList');
  const flip=tasksOn()&&!REDUCED()&&!!Element.prototype.animate,prev={};
  if(flip)box.querySelectorAll('.task[data-id]').forEach(e=>{prev[e.dataset.id]=e.getBoundingClientRect().top});
  box.innerHTML='';
  let list=[...S.tasks.filter(t=>filter==='all'||t.stats.includes(filter))];
  const dir=S.sortDir===-1?-1:1;
  if(S.sort==='diff')list.sort((a,b)=>((DORD[a.diff]||0)-(DORD[b.diff]||0))*dir
    ||a.name.localeCompare(b.name,'uk'));
  else if(S.sort==='abc')list.sort((a,b)=>a.name.localeCompare(b.name,'uk')*dir);
  list.sort((a,b)=>(a.doneOn?1:0)-(b.doneOn?1:0));
  const left=list.filter(t=>!t.doneOn).length;
  document.getElementById('taskCount').textContent=left?left+' лишилось':'усе виконано';
  const nd=document.getElementById('navDot');
  if(nd)nd.classList.toggle('on',S.tasks.some(t=>!t.doneOn));
  const pr=document.querySelector('#taskProg i');
  if(pr)pr.style.width=(list.length?Math.round((list.length-left)/list.length*100):0)+'%';
  if(!list.length){box.innerHTML='<div class="empty">Тут поки порожньо.<br>Додай завдання й познач, до яких стат воно належить.</div>';return}
  let sub=false;
  list.forEach(t=>{
    if(t.doneOn&&!sub){sub=true;const h=document.createElement('div');h.className='tsub';
      h.textContent='Виконано сьогодні · '+(list.length-left);box.appendChild(h)}
    box.appendChild(taskRow(t))});
  if(flip)box.querySelectorAll('.task[data-id]').forEach(e=>{const p0=prev[e.dataset.id];if(p0==null)return;
    const dy=p0-e.getBoundingClientRect().top;if(Math.abs(dy)<2)return;
    e.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'})})}

/* спершу видно сам момент — галочка заповнюється й пружинить, — потім рядок плавно їде у «Виконано» */
let RENDER_T=0;
function logDone(t,delta,iso){
  iso=iso||today();if(!S.done)S.done={};if(!S.tnames)S.tnames={};
  const d=S.done[iso]||(S.done[iso]={});
  d[t.id]=Math.max(0,(d[t.id]||0)+delta);if(!d[t.id])delete d[t.id];
  if(!Object.keys(d).length)delete S.done[iso];
  S.tnames[t.id]=t.name;
  if(!S.doneSince||iso<S.doneSince)S.doneSince=iso}

function laterRender(){clearTimeout(RENDER_T);RENDER_T=setTimeout(render,REDUCED()?0:420)}
function popEl(c,color){c.style.setProperty('--ring',color);c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}

function taskRow(t){
  const el=document.createElement('div');el.dataset.id=t.id;
  el.className='task'+(t.doneOn?' done':'')+(t.multi&&t.count?' rep':'');
  const xp=DF[t.diff].xp,c0=ST[t.stats[0]];
  if(t.multi){
    if(t.count){const mn=document.createElement('button');mn.className='mn';mn.textContent='−';
      mn.title='Прибрати один раз';
      mn.onclick=()=>{if(!t.count)return;t.count--;award(t.stats,-xp);qEvtDel(t);logDone(t,-1);
        if(!t.count)t.doneOn=null;save();render()};
      el.appendChild(mn)}
    const c=document.createElement('button');c.className='cnt'+(t.count?' has':'');
    c.textContent=t.count?'×'+t.count:'+';
    if(t.count){c.style.borderColor=c0.color;c.style.background=c0.soft;c.style.color=c0.color}
    c.onclick=()=>{t.count=(t.count||0)+1;t.doneOn=today();award(t.stats,xp);qEvtAdd(t);logDone(t,1);
      questSyncLink();questSyncCollect();save();
      floatPts(c,'+'+xp,c0.color);
      el.classList.add('rep');c.textContent='×'+t.count;c.classList.add('has');
      c.style.borderColor=c0.color;c.style.background=c0.soft;c.style.color=c0.color;
      popEl(c,c0.color);laterRender()};
    el.appendChild(c)}
  else{const c=document.createElement('button');c.className='check';c.textContent='✓';
    if(t.doneOn){c.style.background=c0.color;c.style.borderColor=c0.color}
    c.onclick=()=>{
      if(t.doneOn){award(t.stats,-xp);t.doneOn=null;t.count=0;qEvtDel(t);logDone(t,-1);save();render();return}
      t.doneOn=today();t.count=1;award(t.stats,xp);qEvtAdd(t);logDone(t,1);
      questSyncLink();questSyncCollect();save();
      floatPts(c,'+'+xp,c0.color);
      el.classList.add('done');c.style.background=c0.color;c.style.borderColor=c0.color;
      popEl(c,c0.color);laterRender()};
    el.appendChild(c)}
  const b=document.createElement('div');b.className='tb';
  b.innerHTML='<div class="tn">'+esc(t.name)+'</div>';
  const m=document.createElement('div');m.className='tm';
  t.stats.forEach(k=>{const s=ST[k],p=document.createElement('span');p.className='pill';
    p.style.color=s.color;p.style.background=s.soft;p.textContent=s.emo+' '+s.name;m.appendChild(p)});
  const d=document.createElement('span');d.className='dlab';d.textContent=DF[t.diff].label;m.appendChild(d);
  b.appendChild(m);b.onclick=()=>openTask(t);el.appendChild(b);
  const n=t.count||0,earned=xp*n;
  const v=document.createElement('div');v.className='xpv'+(n?' hot':'');
  v.textContent='+'+(n?earned:xp);
  if(n){v.style.color=c0.color;v.title='сьогодні '+n+'× по '+xp}
  el.appendChild(v);
  const ed=document.createElement('button');ed.className='ed';ed.textContent='✎';
  ed.onclick=e=>{e.stopPropagation();openTask(t)};el.appendChild(ed);
  return el}

function flushLevels(){
  if(veil.classList.contains('on'))return;
  /* вище останнього прописаного рівня тексту вже немає — показуємо просто тост */
  const over=[];

const MONTHS_G=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];

const WD_FULL=['понеділок','вівторок','середа','четвер','пʼятниця','субота','неділя'];
function dmy(iso){return +iso.slice(8)+' '+MONTHS_G[+iso.slice(5,7)-1]}

  return ws.slice(5,7)===we.slice(5,7)?(+ws.slice(8))+'–'+dmy(we):dmy(ws)+' – '+dmy(we)}
function dayPts(iso,k){return k==='all'?SK.reduce((a,x)=>a+earned(iso,x),0):earned(iso,k)}

function heatmapHtml(f){
  const t=today(),end=weekStart(t),start=shiftDay(end,-52*7);
  let mx=0;for(let d=start;d<=t;d=shiftDay(d,1))mx=Math.max(mx,dayPts(d,f));
  const col=f==='all'?TV['--rad-line']:ST[f].color;
  const lvl=v=>!v?0:Math.min(4,Math.max(1,Math.ceil(v/Math.max(1,mx)*4)));
  const shade=[TV['--hb-empty'],hexA(col,.3),hexA(col,.55),hexA(col,.8),col];
  let g='',prevM='',tot=0,act=0,wi=-1;
  for(let w=start;w<=end;w=shiftDay(w,7)){wi++;
    const m=w.slice(5,7);
    g+='<span class="hm-m">'+(m!==prevM&&+w.slice(8)<=7?MONTHS_S[+m-1]:'')+'</span>';prevM=m;
    for(let i=0;i<7;i++){const d=shiftDay(w,i);
      if(d>t){g+='<span></span>';continue}
      const v=dayPts(d,f),pd=f==='all'?0:penOf(d,f);tot+=v;if(v>0)act++;
      g+='<button class="hm-c'+(pd?' pd':'')+(d===t?' td':'')+'" data-d="'+d+'" style="background:'+shade[lvl(v)]
        +';animation-delay:'+Math.max(0,wi-38)*22+'ms" aria-label="'+d+'"></button>'}}
  const lg='<div class="hm-lg">менше '+shade.map(c=>'<i style="background:'+c+'"></i>').join('')+' більше'
    +(f==='all'?'':'<span style="margin-left:auto;display:flex;align-items:center;gap:4px"><i style="background:'+TV['--bad']
    +';width:6px;height:6px;border-radius:50%"></i>штраф</span>')+'</div>';
  return{html:'<div class="hm"><div class="hm-d"><span></span><span>пн</span><span></span><span>ср</span><span></span>'
    +'<span>пт</span><span></span><span>нд</span></div><div class="hm-s"><div class="hm-g rev">'+g+'</div></div></div>'+lg,tot,act}}

function dayDetail(iso){

  if(!sum&&!pen)return '<b>'+wd+', '+dmy(iso)+'</b> — порожньо.';
  return '<b>'+wd+', '+dmy(iso)+'</b> — +'+sum+(pen?' · штраф −'+pen:'')+(S.qDone&&S.qDone[iso]?' · квест ✓':'')
    +(parts.length?'<br>'+parts.join('  '):'')}

const MONTHS_N=['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];
function actPeriod(k){
  const t=today(),ws=weekStart(t),m0=t.slice(0,8)+'01';
  if(k==='pw')return{from:shiftDay(ws,-7),to:shiftDay(ws,-1),label:weekRange(shiftDay(ws,-7))};
  if(k==='m')return{from:m0,to:t,label:MONTHS_N[+t.slice(5,7)-1]};
  if(k==='pm'){const to=shiftDay(m0,-1),from=to.slice(0,8)+'01';return{from,to,label:MONTHS_N[+from.slice(5,7)-1]}}
  return{from:ws,to:t,label:weekRange(ws)}}

function actStats(from,to,f){
  const by={};let total=0;const active=new Set();
  for(let d=from;d<=to;d=shiftDay(d,1)){const day=(S.done||{})[d];if(!day)continue;
    Object.keys(day).forEach(id=>{const n=day[id];if(!(n>0))return;
      const t=(S.tasks||[]).find(x=>x.id===id);
      if(f!=='all'&&!(t&&t.stats.includes(f)))return;
      const r=by[id]||(by[id]={id,t,name:t?t.name:((S.tnames||{})[id]||'—'),n:0,days:0});
      r.n+=n;r.days++;total+=n;active.add(d)})}
  const rows=Object.values(by).sort((a,b)=>b.n-a.n||b.days-a.days||a.name.localeCompare(b.name,'uk'));
  return{rows,total,active:active.size}}

function openActs(per,f){
  per=per||'w';f=f||'all';
  const P=actPeriod(per),st=actStats(P.from,P.to,f);
  const span=Math.round((new Date(P.to)-new Date(P.from))/864e5)+1;
  let h=histTabs('acts');
  h+='<div class="mchips" id="aP">'+[['w','цей тиждень'],['pw','минулий'],['m','цей місяць'],['pm','минулий місяць']]
    .map(o=>'<button class="mchip'+(per===o[0]?' on':'')+'" data-k="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
  h+='<div class="mchips" id="aF" style="margin-top:7px"><button class="mchip'+(f==='all'?' on':'')+'" data-k="all">усі</button>'
    +STATS.map(s=>'<button class="mchip'+(f===s.k?' on':'')+'" data-k="'+s.k+'" title="'+s.name+'"'
      +(f===s.k?' style="color:'+s.color+';border-color:'+s.line+';background:'+s.soft+'"':'')+'>'+s.emo+'</button>').join('')+'</div>';
  const w5=st.total%10,w100=st.total%100,dw=w5===1&&w100!==11?'дія':(w5>=2&&w5<=4&&(w100<12||w100>14)?'дії':'дій');
  h+='<div class="ac-sum"><span class="ac-n">'+st.total+'</span><span><b>'+dw+'</b> '+(per==='m'||per==='pm'?'за '+P.label:P.label)
    +'<br>різних справ — <b>'+st.rows.length+'</b>, днів із діями — <b>'+st.active+' з '+span+'</b></span></div>';
  if(S.doneSince&&S.doneSince>P.from)h+='<div class="ac-note">Окремі дії рахуються з '+dmy(S.doneSince)
    +'. Те, що було раніше, застосунок ще не записував.</div>';
  if(!st.rows.length)h+='<div class="empty" style="margin-top:10px">За цей час поки нічого не відмічено.</div>';
  else{const mx=st.rows[0].n;h+='<div class="ac-list">';
    st.rows.forEach((r,i)=>{const ks=r.t?r.t.stats:[],c0=ks.length?ST[ks[0]]:null,col=c0?c0.color:TV['--accent'];
      h+='<div class="ac-r"><div class="ac-t"><span class="ac-nm">'+esc(r.name)+(r.t?'':' <i>(видалено)</i>')+'</span>'
        +'<span class="ac-c" style="color:'+col+'">×'+r.n+'</span></div>'
        +'<div class="ac-b"><i style="width:'+Math.max(4,Math.round(r.n/mx*100))+'%;background:'+col
        +';animation-delay:'+Math.min(i,12)*35+'ms"></i></div>'
        +'<div class="ac-m">'+ks.map(k=>ST[k].emo).join(' ')+(ks.length?' · ':'')
        +(r.days===1?'в один день':'у '+r.days+' '+dayWord(r.days))+'</div></div>'});
    h+='</div>'}
  const never=(S.tasks||[]).filter(t=>(f==='all'||t.stats.includes(f))&&!st.rows.some(r=>r.id===t.id));
  if(never.length&&st.rows.length)h+='<div class="f" style="margin-top:12px"><label>Жодного разу за цей час</label>'
    +'<div class="ac-never">'+never.map(t=>'<span>'+esc(t.name)+'</span>').join('')+'</div></div>';
  h+='<div class="mrow"><button class="btn pri" id="aClose">Закрити</button></div>';
  open(h);
  bindHistTabs();
  modal.querySelectorAll('#aP .mchip').forEach(c=>c.onclick=()=>openActs(c.dataset.k,f));
  modal.querySelectorAll('#aF .mchip').forEach(c=>c.onclick=()=>openActs(per,c.dataset.k));
  modal.querySelector('#aClose').onclick=close}
function dayWord(n){const a=n%10,b=n%100;return a===1&&b!==11?'день':(a>=2&&a<=4&&(b<12||b>14)?'дні':'днів')}
function histTabs(cur){
  return '<div class="htabs" id="hTabs"><button data-t="cal" class="'+(cur==='cal'?'on':'')+'">Рік у клітинках</button>'
    +'<button data-t="acts" class="'+(cur==='acts'?'on':'')+'">Що я робила</button></div>'}

let RECAP_HOLD=true;
function maybeRecap(){
  if(RECAP_HOLD||!S.recapPending||veil.classList.contains('on'))return;
  const ws=S.recapPending;S.recapPending=null;S.recapSeen=ws;save();showRecap(ws,false)}

function showRecap(ws,fromHistory){
  const days=[...Array(7)].map((_,i)=>shiftDay(ws,i)).filter(d=>d<=today());
  const sum=a=>a.reduce((x,d)=>x+dayPts(d,'all'),0);
  const got=sum(days),pen=days.reduce((a,d)=>a+penDay(d),0),net=got-pen;
  const prevDays=[...Array(7)].map((_,i)=>shiftDay(shiftDay(ws,-7),i));
  const prev=sum(prevDays)-prevDays.reduce((a,d)=>a+penDay(d),0);
  const best=days.slice().sort((a,b)=>dayPts(b,'all')-dayPts(a,'all'))[0];
  const by={};SK.forEach(k=>by[k]=days.reduce((a,d)=>a+earned(d,k),0));
  const rank=SK.slice().sort((a,b)=>by[b]-by[a]);
  const we=weekEnd(ws),before=shiftDay(ws,-1),last=we<today()?we:today();
  const lines=[];
  const L=(e,t,sub)=>lines.push('<div class="rc-l"><span class="e">'+e+'</span><span class="t">'+t
    +(sub?'<small>'+sub+'</small>':'')+'</span></div>');
  if(best&&dayPts(best,'all')>0)L('⭐','Найкращий день — '+WD_FULL[dowMon(best)]+', +'+dayPts(best,'all'));
  if(got>0)L(ST[rank[0]].emo,'Найбільше — '+ST[rank[0]].name+' ('+by[rank[0]]+')',
    'найменше — '+ST[rank[rank.length-1]].emo+' '+ST[rank[rank.length-1]].name+' ('+by[rank[rank.length-1]]+')');
  SK.forEach(k=>{const r=rhyAt(k,last);
    if(r.mode==='week'){const pts=weekPts(ws,k),ok=pts>=r.norm,p=penOf(we,k);
      L(ST[k].emo,ST[k].name+': '+pts+' з '+r.norm+(ok?' — норму виконано ✓':''),
        !ok?(we<today()?(p?'штраф −'+p:'норму не добрано'):'тиждень ще триває'):'')}
    else if(r.mode==='state'){const ser=gaugeSeries(k),v=ser.end[last]!=null?ser.end[last]:ser.now;
      L(ST[k].emo,ST[k].name+': полоска на кінець тижня — '+v+'%')}});
  const ups=SK.map(k=>({k,a:Math.floor(lvlFromXp(xpAt(k,before))),b:Math.floor(lvlFromXp(xpAt(k,last)))}))
    .filter(x=>x.b>x.a);
  if(ups.length)L('🆙','Нові рівні',ups.map(x=>ST[x.k].emo+' '+ST[x.k].name+' → '+x.b+' ('+rankOf(x.k,x.b).name+')').join(', '));
  const qd=days.filter(d=>S.qDone&&S.qDone[d]).length;
  const top=actStats(ws,last,'all').rows.slice(0,3);
  if(top.length)L('🔁','Найчастіше',top.map(r=>esc(r.name)+' ×'+r.n).join(', '));
  L('🎯','Квест дня — '+qd+' з '+days.length);
  const ach=Object.values(S.ach||{}).filter(d=>d>=ws&&d<=we).length;
  if(ach)L('🏅','Нагород за тиждень — '+ach);
  if(pen)L('🔻','Штрафи — −'+pen);
  const dl=net-prev;
  let h='<h3>Тиждень '+weekRange(ws)+'</h3>';
  h+='<div class="rc-n" style="color:'+(net>=0?TV['--rad-line']:TV['--bad'])+'">'+(net>0?'+':'')+net+'</div>';
  h+='<div class="rc-d">'+(net===got?'балів за тиждень':'балів після штрафів')
    +(prev||net?' · '+(dl===0?'як тижнем раніше':(dl>0?'на '+dl+' більше':'на '+(-dl)+' менше')+', ніж тижнем раніше'):'')+'</div>';
  const peak=Math.max(20,...days.map(d=>dayPts(d,'all')));
  h+='<div class="wk-bars" style="margin-top:12px">';
  days.forEach(d=>{h+='<div class="wk-col">';
    if(!SK.some(k=>earned(d,k)>0))h+='<i style="height:3px;background:'+TV['--hb-empty']+'"></i>';
    else SK.forEach(k=>{const v=earned(d,k);if(v)h+='<i style="height:'+Math.max(2,Math.round(v/peak*36))
      +'px;background:'+ST[k].color+'"></i>'});
    h+='</div>'});
  h+='</div><div class="wk-days">'+days.map(d=>'<span>'+WD[new Date(d+'T12:00:00').getDay()]+'</span>').join('')+'</div>';
  h+='<div style="margin-top:10px">'+lines.join('')+'</div>';
  h+='<div class="mrow"><button class="btn pri" id="rcOk">'+(fromHistory?'Назад':'Далі')+'</button></div>';
  open(h);
  modal.querySelector('#rcOk').onclick=()=>{if(fromHistory)openHistory('all');else close()}}

function doExport(){
  S.lastExport=today();save();
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='waymark-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Файл збережено')}

/* просимо браузер не чистити дані застосунку */
let PERSIST=null;
function askPersist(){
  try{if(!(navigator.storage&&navigator.storage.persist))return;
    navigator.storage.persisted().then(p=>p?true:navigator.storage.persist())
      .then(ok=>{PERSIST=!!ok}).catch(()=>{})}catch(e){}}

function openRhythm(){
  const L={day:'щодня',week:'норма на тиждень',state:'полоска',free:'без штрафів'};
  const dr={};SK.forEach(k=>dr[k]=Object.assign({},rhy(k)));
  let h='<h3>Ритм стат</h3>';
  h+='<p class="note" style="margin:0 0 10px">Як рахується штраф для кожної стати. Зміни діють з сьогодні, '
    +'минулі дні й тижні не перераховуються.</p>';
  STATS.forEach(s=>{const r=dr[s.k];
    h+='<div class="rh f" data-k="'+s.k+'"><div class="rh-t"><span>'+s.emo+'</span><span>'+s.name+'</span></div>';
    h+='<div class="mchips">'+['day','week','state','free'].map(m=>'<button class="mchip'+(r.mode===m?' on':'')
      +'" data-m="'+m+'">'+L[m]+'</button>').join('')+'</div>';
    h+='<div class="rh-x" data-x="day">штраф за кожен день без жодного бала</div>';
    h+='<div class="rh-x" data-x="week"><input type="number" min="5" max="2000" step="5" value="'+r.norm
      +'"> балів за тиждень; у неділю штраф за кожні 10 недобраних</div>';
    h+='<div class="rh-x rh-st" data-x="state"><div>просідає на <input type="number" class="rd-dr" min="1" max="50" value="'+r.drain
      +'"> % щодня</div><div>1 бал дає <input type="number" class="rd-gn" min="0.1" max="5" step="0.1" value="'+r.gain
      +'"> % полоски</div><div class="rd-hint"></div></div>';
    h+='<div class="rh-x" data-x="free">бали, рівні й серії як завжди, тільки без штрафів</div></div>'});
  h+='<div class="mrow"><button class="btn" id="rBack">Назад</button><button class="btn pri" id="rSave">Зберегти</button></div>';
  open(h);
  const hint=row=>{const h=row.querySelector('.rd-hint');if(!h)return;
    const dr_=Math.max(1,+row.querySelector('.rd-dr').value||10),gn=Math.max(0.1,+row.querySelector('.rd-gn').value||1);
    const pts=Math.ceil(dr_/gn);
    h.textContent='Щоб полоска трималась на місці, треба ≈'+pts+' балів на день. Штраф — лише коли вона на нулі.'};
  const sync=row=>{const m=dr[row.dataset.k].mode;
    row.querySelectorAll('.rh-x').forEach(x=>x.style.display=x.dataset.x===m?'':'none');hint(row)};
  modal.querySelectorAll('.rh').forEach(row=>{sync(row);
    row.querySelectorAll('.rd-dr,.rd-gn').forEach(i=>i.oninput=()=>hint(row));
    row.querySelectorAll('.mchip').forEach(c=>c.onclick=()=>{dr[row.dataset.k].mode=c.dataset.m;
      row.querySelectorAll('.mchip').forEach(x=>x.classList.toggle('on',x===c));sync(row)})});
  modal.querySelector('#rBack').onclick=openSettings;
  modal.querySelector('#rSave').onclick=()=>{
    const changed=[];
    modal.querySelectorAll('.rh').forEach(row=>{const k=row.dataset.k;
      const nr={mode:dr[k].mode,
        norm:+row.querySelector('[data-x=week] input').value||80,
        drain:+row.querySelector('.rd-dr').value||10,
        gain:+row.querySelector('.rd-gn').value||1};
      if(setRhythm(k,nr))changed.push(ST[k].name)});
    if(changed.length){buildTracks();reconcile()}
    save();render();openSettings();
    toast(changed.length?'Новий ритм з сьогодні: '+changed.join(', '):'Без змін')}}

function openSettings(){
  const pace=S.pace||1;
  let h='<h3>Налаштування</h3>';
  h+='<div class="f"><label>Тема</label><div class="thchips" id="sTheme">';
  Object.entries(THEMES).forEach(([k,t])=>
    h+='<button class="thc'+(S.theme===k?' on':'')+'" data-k="'+k+'">'
      +'<span class="sw" style="background:'+t.sw+'"></span>'+t.name+'</button>');
  h+='</div></div>';
  h+='<div class="f"><label>Темп прокачки</label><div class="mchips" id="sPace">';
  [['0.7','швидше'],['1','звично'],['1.4','повільніше']].forEach(([v,l])=>
    h+='<button class="mchip'+(String(pace)===v?' on':'')+'" data-v="'+v+'">'+l+'</button>');
  h+='</div><p class="note">Впливає на те, скільки балів треба на рівень. Зараз до найвищого звання — '
    +Math.round(sumToTen()*pace)+' балів.</p></div>';
  h+='<div class="f"><label>Штраф і ритм стат</label><div class="qrow"><input type="number" id="sPen" min="0" max="50" value="'
    +S.penalty+'" style="width:88px"><button class="btn" id="sRhy" style="flex:1">Ритм стат</button></div>';
  h+='<p class="note">Базовий розмір штрафу. Щоденні стати: за день без балів, далі ×2, ×3, ×4, якщо пропуски поспіль. '
    +'Тижнева норма: у неділю — за кожні 10 недобраних балів. Полоска: коли стан падає до нуля. '
    +'Новий розмір діє з сьогодні. Постав 0, щоб вимкнути все.</p></div>';
  h+='<div class="f"><label>Передбачення — по одному на рядок</label>';
  h+='<textarea id="sFort" placeholder="Одне передбачення на рядок">'+esc((S.fortunes||[]).join('\n'))+'</textarea>';
  h+='<p class="note">Зараз їх '+(S.fortunes||[]).length+'. Показується одне на день, випадково, без повторів найближчим часом.</p></div>';
  h+='<div class="f"><label>Перенести на інший пристрій</label><div class="mrow" style="margin-top:0">';
  h+='<button class="btn" id="sExp">Експорт</button><button class="btn" id="sImp">Імпорт</button></div>';
  const pc=prevCopy();
  if(pc)h+='<button class="btn" id="sPrev" style="width:100%;margin-top:7px">Повернути дані до оновлення ('
    +pc.at.slice(8,10)+'.'+pc.at.slice(5,7)+')</button>';
  h+='<p class="note">Дані живуть тільки в цьому браузері. Експорт — це і перенесення на інший пристрій, і резервна копія. '
    +(S.lastExport?'Остання копія: '+S.lastExport.slice(8)+'.'+S.lastExport.slice(5,7)+'. ':'Копії ще не було. ')
    +(PERSIST===true?'Браузер погодився не чистити ці дані.':PERSIST===false?'Браузер не гарантує, що не почистить дані, — тримай свіжу копію.':'')
    +'</p></div>';
  h+='<div class="f"><label>Квест дня</label><div class="mchips" id="sQSrc">';
  [['mine','мої квести'],['mix','порівну'],['tasks','мої завдання']].forEach(o=>
    h+='<button class="mchip'+((S.questSrc||'mix')===o[0]?' on':'')+'" data-v="'+o[0]+'">'+o[1]+'</button>');
  h+='</div>';
  h+='<div class="mchips" id="sQBias" style="margin-top:7px">';
  h+='<button class="mchip'+(S.questBias?'':' on')+'" data-v="0">рівномірно</button>';
  h+='<button class="mchip'+(S.questBias?' on':'')+'" data-v="1">підтягувати слабке</button></div>';
  h+='<div class="qrow" style="margin-top:8px"><input type="number" id="sQMul" min="1" max="5" step="0.1" value="'
    +questMul()+'" style="width:88px"><button class="btn" id="sQEdit" style="flex:1">Мої квести ('
    +((S.quests||[]).length)+')</button></div>';
  h+='<p class="note">Множник балів за квест. Один квест на день, зʼявляється при першому відкритті. '
    +'«Мої завдання» — це ті зі списку, у яких увімкнено «може бути квестом». '
    +'«Підтягувати слабке» частіше підкидає квести по статях, які за останній тиждень відстають.</p></div>';
  h+='<div class="f"><label>Автоматичні нагороди</label><div class="mchips" id="sAuto">';
  h+='<button class="mchip'+(S.autoAch!==0?' on':'')+'" data-v="1">показувати</button>';
  h+='<button class="mchip'+(S.autoAch===0?' on':'')+'" data-v="0">сховати</button></div>';
  h+='<p class="note">Це блок «Нагороди» за серії та рівні. Якщо сховати — бали за них усе одно нараховуються, просто список не заважає.</p></div>';
  h+='<div class="f"><label>Почати спочатку</label><div class="mrow" style="margin-top:0">';
  h+='<button class="btn" id="sResetProg">Скинути прогрес</button>';
  h+='<button class="btn del" id="sReset">Стерти все</button></div>';
  h+='<p class="note">«Скинути прогрес» обнуляє рівні, бали, серії, журнал і відмітки — '
    +'але лишає твої завдання, мої досягнення й налаштування. «Стерти все» повертає застосунок '
    +'до заводського стану: твої завдання й досягнення теж зникнуть.</p></div>';
  h+='<div class="mrow"><button class="btn" id="sClose">Закрити</button><button class="btn pri" id="sSave">Зберегти</button></div>';
  open(h);
  modal.querySelectorAll('#sTheme .thc').forEach(c=>c.onclick=()=>{
    S.theme=c.dataset.k;applyTheme();save();
    modal.querySelectorAll('#sTheme .thc').forEach(x=>x.classList.toggle('on',x===c));
    render()});
  let nqsrc=S.questSrc||'mix',nqbias=S.questBias?1:0,nauto=S.autoAch!==0?1:0,np=pace;
  modal.querySelectorAll('#sQSrc .mchip').forEach(c=>c.onclick=()=>{nqsrc=c.dataset.v;
    modal.querySelectorAll('#sQSrc .mchip').forEach(x=>x.classList.toggle('on',x===c))});
  modal.querySelectorAll('#sQBias .mchip').forEach(c=>c.onclick=()=>{nqbias=+c.dataset.v;
    modal.querySelectorAll('#sQBias .mchip').forEach(x=>x.classList.toggle('on',x===c))});
  const commit=()=>{
    setPenalty(modal.querySelector('#sPen').value);
    S.pace=np;S.autoAch=nauto;S.questSrc=nqsrc;S.questBias=nqbias;
    S.questMul=Math.max(1,+modal.querySelector('#sQMul').value||1.5);
    const lines=modal.querySelector('#sFort').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(lines.length)S.fortunes=lines};
  modal.querySelector('#sQEdit').onclick=()=>{commit();save();openQuests()};
  modal.querySelector('#sRhy').onclick=()=>{commit();save();openRhythm()};
  modal.querySelectorAll('#sAuto .mchip').forEach(c=>c.onclick=()=>{nauto=+c.dataset.v;
    modal.querySelectorAll('#sAuto .mchip').forEach(x=>x.classList.toggle('on',x===c))});
  modal.querySelectorAll('#sPace .mchip').forEach(c=>c.onclick=()=>{np=+c.dataset.v;
    modal.querySelectorAll('#sPace .mchip').forEach(x=>x.classList.remove('on'));c.classList.add('on')});
  modal.querySelector('#sClose').onclick=close;
  modal.querySelector('#sSave').onclick=()=>{
    commit();save();render();close();toast('Збережено')};
  modal.querySelector('#sExp').onclick=()=>{doExport();openSettings()};
  const sp=modal.querySelector('#sPrev');
  if(sp)sp.onclick=()=>{const pc=prevCopy();if(!pc)return;
    if(!confirm('Замінити поточні дані копією, відкладеною браузером '+pc.at.slice(0,10)+'?\n\n'
      +'Поточний стан спершу збережеться файлом.'))return;
    try{const d=JSON.parse(pc.raw);doExport();
      S=normalize(Object.assign(structuredClone(blank),d),d);
      applyTheme();buildTracks();save();rollover();render();close();toast('Дані повернуто')}
    catch(e){toast('Копія пошкоджена — відновити не вийшло')}};
  modal.querySelector('#sImp').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
    i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.stats||!d.tasks)throw 0;
        S=normalize(Object.assign(structuredClone(blank),d),d);
        applyTheme();buildTracks();save();rollover();render();close();toast('Дані завантажено')}catch(e){toast('Файл не підходить')}};
      r.readAsText(f)};i.click()};
  modal.querySelector('#sResetProg').onclick=()=>{
    const nt=(S.tasks||[]).length,nb=(S.bonuses||[]).length;
    if(!confirm('Обнулити рівні, бали, серії та всі відмітки?\n\n'
      +'Лишаться: завдання ('+nt+'), мої досягнення ('+nb+'), теми й налаштування.\n'
      +'Це не можна скасувати.'))return;
    resetProgress();render();close();toast('Прогрес обнулено — з чистого аркуша')};
  modal.querySelector('#sReset').onclick=()=>{
    if(!confirm('Стерти ВСЕ — разом із твоїми завданнями й досягненнями?\n\n'
      +'Застосунок повернеться до стартового набору завдань. Це не можна скасувати.'))return;
    localStorage.removeItem(KEY);S=load();applyTheme();buildTracks();rollover();save();render();close();toast('Готово')}}
document.getElementById('btnSet').onclick=openSettings;

function sumToTen(){let s=0;for(let l=1;l<10;l++)s+=60+40*(l-1)+6*(l-1)*(l-1);return s}

document.querySelectorAll('.nv').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.nv').forEach(x=>x.classList.remove('on'));n.classList.add('on');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.dataset.p===n.dataset.p));
  window.scrollTo({top:0,behavior:'instant'});
  if(n.dataset.p==='map'){renderTop();renderRadar();renderGrid();renderWeek()}});

function goTab(p){const n=document.querySelector('.nv[data-p='+p+']');if(n)n.click()}

applyTheme();
rollover();
buildTracks();
askPersist();
pickQuest();
backfillAch();
const fresh=pickFortune();
render();
if(fresh)showFortuneModal();
RECAP_HOLD=false;if(!fresh)maybeRecap();
function dayTick(force){
  if(!force&&S.lastDay===today())return false;
  if(!force)syncFromStorage();
  RECAP_HOLD=true;rollover();pickQuest();const f=pickFortune();render();if(f)showFortuneModal();
  RECAP_HOLD=false;if(!f)maybeRecap();return true}
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;
  const fresh=syncFromStorage();
  if(!dayTick(true)&&fresh)render()});
window.addEventListener('storage',e=>{
  if(e.key!==KEY&&e.key!==null)return;
  if(syncFromStorage()){render();toast('Оновлено з іншого вікна')}});
setInterval(()=>{if(document.hidden)return;
  if(dayTick(false))return;
  if(S.questRef&&S.questRef.win&&S.questStart)renderQuest()},60000);
if(LOAD_ERR)setTimeout(()=>toast('Збережені дані не прочитались — їх відкладено, повернути можна в ⚙'),1200);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
