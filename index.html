<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCEBFB">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Waymark">
<title>Waymark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3F4E63; --ink-2:#6C7F97; --dim:#9DAFC4;
  --card:#FFFFFF; --edge:#D8E6F5; --edge-2:#C3D8ED; --soft:#EEF5FD;
  --field:#FFFFFF; --accent:#5D93C7; --sky:#8FC0EE; --good:#5A8F76; --bad:#C98080;
  --root:#E4F0FC; --page:linear-gradient(170deg,#DCEBFB 0%,#E9F1FE 45%,#F1ECFD 100%);
  --nav:rgba(240,246,254,.94); --veil:rgba(63,78,99,.4);
  --fort-bg:#FFF8E9; --fort-edge:#F2DFB4; --fort-lb:#B08A3A; --fort-tx:#7A5E22;
  --claim-bg:#FFF4D9; --claim-edge:#F0D79B; --claim-ink:#A9761B;
  --pri-bg:#CFE6FB; --pri-edge:#A6CDF2; --pri-ink:#2F5F8E;
  --del-bg:#FDECEC; --del-edge:#F3C4C4; --del-ink:#B25757;
  --rad-grid:#D8E6F5; --rad-spoke:#E4EDF8; --rad-face:#F7FAFE;
  --rad-fill:#A9CDF2; --rad-line:#79AEEC; --rad-label:#5A6B80;
  --seg-line:rgba(0,0,0,.07); --hb-empty:#E4EDF7;
  --disp:'Fredoka',system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--root)}
body{
  font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);
  background:var(--page);
  background-attachment:fixed;min-height:100vh;padding:0 0 96px;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.bar{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.bar .t{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:.02em}
.bar .s{font-size:11.5px;color:var(--ink-2);font-weight:600}
.ib{width:36px;height:36px;border-radius:11px;background:var(--card);border:2px solid var(--edge);
  box-shadow:0 2px 0 var(--edge);display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.ib:active{transform:translateY(2px);box-shadow:none}
.ib+.ib{margin-left:4px}
.spacer{margin-left:auto}

.page{display:none}
.page.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:4px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:var(--nav);backdrop-filter:blur(8px);border-top:2px solid var(--edge)}
.nv{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;
  border-radius:11px;font-family:var(--disp);font-size:12px;font-weight:500;color:var(--dim)}
.nv .e{font-size:17px;line-height:1.1;filter:grayscale(1);opacity:.5}
.nv.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge);border:2px solid var(--edge);padding:4px 2px}
.nv.on .e{filter:none;opacity:1}
.nv .dot{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;
  background:#EE9184;border:2px solid #FDEEEB;display:none}
.nv .dot.on{display:block}

.card{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);
  box-shadow:0 3px 0 var(--edge);padding:14px}
.radarcard{margin-bottom:9px;padding:8px 10px 4px}
.radarcard svg{width:100%;height:auto;display:block}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:9px}
.hero .txt{flex:1;min-width:0}
.hero h1{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.25}
.hero p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tchip{font-family:var(--disp);font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:8px;border:2px solid}

.fort{background:var(--fort-bg);border:2px solid var(--fort-edge);box-shadow:0 3px 0 var(--fort-edge);border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.fort .ic{font-size:17px;line-height:1.3;flex:none}
.fort .lb{font-family:var(--disp);font-size:11.5px;font-weight:500;color:var(--fort-lb);letter-spacing:.05em;text-transform:uppercase}
.fort .tx{font-size:14px;font-weight:600;color:var(--fort-tx);line-height:1.5;margin-top:3px}

.sh{display:flex;align-items:center;gap:7px;padding:18px 4px 9px}
.sh h2{font-family:var(--disp);font-size:16px;font-weight:600}
.sh .n{font-size:11px;color:var(--dim);font-weight:700}
.sh button{margin-left:auto;font-family:var(--disp);font-size:13px;font-weight:500;color:var(--accent);
  border:2px solid var(--edge);background:var(--card);border-radius:9px;padding:3px 10px;box-shadow:0 2px 0 var(--edge)}
.sh button:active{transform:translateY(2px);box-shadow:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc{border:2px solid;border-radius:13px;padding:10px 11px 11px;text-align:left;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.06)}
.sc:active{transform:translateY(2px);box-shadow:none}
.sc.sel{outline:2px dashed currentColor;outline-offset:2px}
.sc-top{display:flex;align-items:center;gap:6px}
.sc-emo{font-size:14px;line-height:1}
.sc-name{font-family:var(--disp);font-size:14.5px;font-weight:600;flex:1;color:var(--ink)}
.sc-lvl{font-family:var(--disp);font-size:15px;font-weight:600}
.sc-rank{font-size:12px;font-weight:700;line-height:1.3;margin-top:5px;min-height:16px}
.seg{display:flex;gap:2px;margin-top:8px}
.seg i{flex:1;height:7px;border-radius:1px;background:var(--field);border:1px solid var(--seg-line)}
.sc-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);margin-top:6px;font-weight:700}
.sc-gain{font-family:var(--disp);font-size:12.5px;font-weight:500}

.filters{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:9px}
.fchip{font-family:var(--disp);font-size:13px;font-weight:500;padding:4px 11px;border-radius:9px;
  background:var(--card);border:2px solid var(--edge);color:var(--ink-2);box-shadow:0 2px 0 var(--edge)}
.fchip.on{color:#fff}
.fchip:active{transform:translateY(2px);box-shadow:none}

.task{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:2px solid var(--edge);
  border-radius:12px;box-shadow:0 2px 0 var(--edge);padding:10px;margin-bottom:7px}
.task.done{background:var(--soft);box-shadow:none;border-color:var(--soft)}
.task.done.rep{background:var(--card);box-shadow:0 2px 0 var(--edge);border-color:var(--edge)}
.task.done.rep .tn{color:var(--ink);text-decoration:none}
.check{width:24px;height:24px;flex:none;border:2px solid var(--edge-2);border-radius:7px;background:var(--field);
  display:grid;place-items:center;font-size:13px;color:transparent;font-weight:700}
.done .check{color:#fff}
.check:active{transform:translateY(1px)}
.cnt{min-width:36px;height:26px;padding:0 7px;flex:none;border:2px solid var(--edge-2);border-radius:7px;background:var(--field);
  font-family:var(--disp);font-size:13.5px;font-weight:500;color:var(--ink-2);display:grid;place-items:center}
.cnt.has{color:var(--ink)}
.tb{flex:1;min-width:0;cursor:pointer}
.tn{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
.done .tn{color:var(--dim);text-decoration:line-through}
.tm{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}
.pill{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;line-height:1.7}
.dlab{font-size:10.5px;color:var(--dim);font-weight:700}
.xpv{font-family:var(--disp);font-size:13.5px;font-weight:500;color:var(--dim);flex:none;margin-top:3px}
.ed{color:var(--dim);font-size:13px;padding:2px 4px;flex:none;line-height:1}
.ed:hover{color:var(--ink)}
.empty{background:var(--card);border:2px dashed var(--edge-2);border-radius:12px;padding:14px;
  font-size:12.5px;color:var(--ink-2);line-height:1.6;text-align:center}

.bn{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);
  border-radius:12px;box-shadow:0 2px 0 var(--edge);padding:10px;margin-bottom:7px}
.claim{flex:none;font-family:var(--disp);font-size:13.5px;font-weight:500;padding:5px 12px;border-radius:9px;
  background:var(--claim-bg);border:2px solid var(--claim-edge);color:var(--claim-ink);box-shadow:0 2px 0 var(--claim-edge)}
.claim:active{transform:translateY(2px);box-shadow:none}

.add{display:flex;gap:6px;background:var(--card);border:2px solid var(--edge);border-radius:12px;
  box-shadow:0 2px 0 var(--edge);padding:8px 10px;margin-top:8px}
.add input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13.5px;font-weight:600}
.add input::placeholder{color:var(--dim);font-weight:400}
.add button{font-family:var(--disp);color:var(--accent);font-size:20px;padding:0 4px;line-height:1}

.veil{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(2px);z-index:60;
  display:none;align-items:center;justify-content:center;padding:16px}
.veil.on{display:flex}
.modal{background:var(--card);border:2px solid var(--edge-2);border-radius:16px;box-shadow:0 4px 0 var(--edge-2);
  padding:17px;width:100%;max-width:400px;max-height:88vh;overflow:auto}
.modal h3{font-family:var(--disp);font-size:17px;font-weight:600;margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-family:var(--disp);font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.f input[type=text],.f input[type=number],.f textarea{width:100%;background:var(--soft);border:2px solid var(--edge);
  border-radius:10px;padding:9px 11px;outline:none;font-size:14px;font-weight:600}
.f textarea{font-weight:400;font-size:13px;min-height:150px;resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus{border-color:var(--sky);background:var(--field)}
.mchips{display:flex;gap:5px;flex-wrap:wrap}
.mchip{padding:6px 10px;border-radius:9px;background:var(--soft);border:2px solid var(--edge);
  font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mchip.on{background:var(--field);border-color:var(--sky);color:var(--ink)}
.mrow{display:flex;gap:7px;margin-top:16px}
.btn{flex:1;font-family:var(--disp);font-size:15px;font-weight:500;padding:9px;border-radius:11px;
  background:var(--soft);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);text-align:center;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-edge);box-shadow:0 3px 0 var(--pri-edge);color:var(--pri-ink)}
.btn.del{flex:none;padding:9px 13px;background:var(--del-bg);border-color:var(--del-edge);box-shadow:0 3px 0 var(--del-edge);color:var(--del-ink)}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-top:8px}
.hrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.hdate{width:46px;color:var(--dim);font-size:10.5px;font-weight:700;flex:none}
.hbars{display:flex;gap:2px;flex:1;height:16px;align-items:flex-end}
.hb{flex:1;border-radius:1px;min-height:3px}
.htot{width:40px;text-align:right;font-family:var(--disp);font-size:13px;font-weight:500;flex:none}

.lv{text-align:center;padding:2px 0 0}
.lv-emo{font-size:54px;line-height:1.15}
.lv-stat{font-family:var(--disp);font-size:13.5px;font-weight:500;margin-top:10px}
.lv-fl{font-size:14px;line-height:1.62;margin-top:11px;color:var(--ink-2);font-weight:500;
  padding:0 4px;text-wrap:pretty}
.lv-was{font-size:12px;color:var(--dim);margin-top:12px;font-weight:600}
.lv-now{font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.3;margin-top:4px}
.lv-n{font-family:var(--disp);font-size:13px;color:var(--dim);margin-top:8px}

.fmodal{text-align:center;padding:4px 0 0}
.fmodal .ic{font-size:44px;line-height:1.2}
.fmodal .lb{font-family:var(--disp);font-size:12.5px;font-weight:500;color:var(--fort-lb);letter-spacing:.06em;
  text-transform:uppercase;margin-top:10px}
.fmodal .tx{font-size:16px;font-weight:600;line-height:1.6;margin-top:11px;color:var(--fort-tx)}

#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);background:var(--card);
  border:2px solid var(--edge-2);box-shadow:0 3px 0 var(--edge-2);padding:9px 15px;border-radius:11px;
  font-size:13px;font-weight:700;opacity:0;transition:.22s;pointer-events:none;z-index:80;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.wk{margin-bottom:9px;padding:12px 14px}
.wk-top{display:flex;align-items:baseline;gap:8px}
.wk-t{font-family:var(--disp);font-size:15px;font-weight:600}
.wk-sum{font-family:var(--disp);font-size:19px;font-weight:600;margin-left:auto}
.wk-d{font-size:11.5px;font-weight:700}
.wk-bars{display:flex;gap:4px;align-items:flex-end;height:38px;margin:11px 0 5px}
.wk-col{flex:1;display:flex;flex-direction:column-reverse;gap:1px;height:100%;justify-content:flex-start}
.wk-col i{display:block;border-radius:1px;min-height:0}
.wk-days{display:flex;gap:4px;font-size:9.5px;color:var(--dim);font-weight:700;text-align:center}
.wk-days span{flex:1}
.wk-l{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:7px}
.wk-l b{color:var(--ink)}

.strk{display:flex;flex-direction:column;gap:7px}
.sr{display:flex;align-items:center;gap:6px}
.sr .nm{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .p{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;line-height:1.75;flex:none}
.sr .rec{font-size:10px;color:var(--dim);font-weight:700;flex:none;min-width:38px;text-align:right}

.ach{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);
  border-radius:12px;box-shadow:0 2px 0 var(--edge);padding:9px 10px;margin-bottom:7px}
.ach.lock{background:var(--soft);box-shadow:none;border-color:var(--soft)}
.ach .md{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:16px;background:var(--soft);border:2px solid var(--edge)}
.ach.lock .md{opacity:.6;filter:grayscale(.55)}
.ach .tx{flex:1;min-width:0}
.ach .t1{font-size:13px;font-weight:700;line-height:1.35}
.ach.lock .t1{color:var(--ink-2)}
.ach .t2{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.ach .pb{height:5px;border-radius:3px;background:var(--edge);margin-top:5px;overflow:hidden}
.ach .pb i{display:block;height:100%;border-radius:3px}
.ach .rw{font-family:var(--disp);font-size:12.5px;font-weight:500;color:var(--dim);flex:none}
.ach.mine .tx{cursor:pointer}
.ach.done{background:var(--soft);box-shadow:none;border-color:var(--soft)}
.ach.done .t1{color:var(--ink-2)}
.mk{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--edge-2);
  background:var(--soft);display:grid;place-items:center;font-size:14px;font-weight:700;color:transparent}
.mk.on{color:#fff}
.mk.plus{color:var(--accent);background:var(--card)}
.mk.minus{color:var(--dim);background:var(--card);width:24px;height:28px;font-size:17px;line-height:1}
.mk:active{transform:translateY(1px)}
.achsub{font-size:11px;color:var(--dim);font-weight:700;padding:2px 4px 7px;text-transform:uppercase;letter-spacing:.04em}

.retro{display:flex;gap:5px;flex-wrap:wrap}
.rd{font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;background:var(--soft);
  border:2px solid var(--edge);color:var(--ink-2)}
.rd.hit{border-color:var(--sky);background:var(--field);color:var(--ink)}
.rd:active{transform:translateY(1px)}

.sortrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:0 2px 9px}
.sortrow .lb{font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.sch{font-family:var(--disp);font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:9px;
  background:var(--card);border:2px solid var(--edge);color:var(--ink-2);box-shadow:0 2px 0 var(--edge)}
.sch.on{background:var(--pri-bg);border-color:var(--pri-edge);box-shadow:0 2px 0 var(--pri-edge);color:var(--pri-ink)}
.sch:active{transform:translateY(2px);box-shadow:none}
.mn{width:22px;height:26px;flex:none;border:2px solid var(--edge-2);border-radius:7px;background:var(--field);
  font-family:var(--disp);font-size:14px;font-weight:500;color:var(--dim);display:grid;place-items:center;margin-right:-5px}
.mn:active{transform:translateY(1px)}
.xpv.hot{font-weight:600}
.thchips{display:flex;gap:6px;flex-wrap:wrap}
.thc{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:10px;
  background:var(--soft);border:2px solid var(--edge);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.thc.on{background:var(--field);border-color:var(--sky);color:var(--ink)}
.thc .sw{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(0,0,0,.12);flex:none}

.dk .nv .e{filter:grayscale(1);opacity:.45}
.dk .nv.on .e{filter:none;opacity:1}
.dk .sc{box-shadow:0 3px 0 rgba(0,0,0,.25)}
.dk .fchip.on,.dk .done .check{color:#1B2130}
.dk .modal,.dk .card,.dk .task,.dk .bn,.dk .add{backdrop-filter:none}

@media(min-width:620px){.wrap{max-width:820px}.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div><div class="t">Waymark</div><div class="s" id="hsub">—</div></div>
    <div class="spacer"></div>
    <button class="ib" id="btnHist" title="Історія">◴</button>
    <button class="ib" id="btnSet" title="Налаштування">⚙</button>
  </div>

  <section class="page on" data-p="map">
    <div class="card radarcard">
      <svg id="radar" viewBox="0 0 384 322"></svg>
    </div>
    <div class="card hero">
      <div class="txt">
        <h1 id="sumTitle">—</h1>
        <p id="sumText">—</p>
        <div class="chips" id="todayChips"></div>
      </div>
    </div>
    <div class="fort" id="fortCard" style="display:none">
      <span class="ic">🔮</span>
      <div><div class="lb">Передбачення дня</div><div class="tx" id="fortText"></div></div>
    </div>
    <div class="card wk" id="weekCard"></div>
    <div class="grid" id="statGrid"></div>
  </section>

  <section class="page" data-p="tasks">
    <div class="sh"><h2>Завдання</h2><span class="n" id="taskCount"></span><button id="btnNewTask">+ нове</button></div>
    <div class="filters" id="filters"></div>
    <div class="sortrow" id="sortRow"></div>
    <div id="taskList"></div>
    <div class="add"><input id="quickAdd" placeholder="Швидко додати завдання"><button id="quickBtn">+</button></div>
  </section>

  <section class="page" data-p="bonus">
    <div class="sh"><h2>Мої досягнення</h2><span class="n" id="myCount"></span><button id="btnNewAch">+ нове</button></div>
    <div id="myAchList"></div>
    <div class="sh"><h2>Серії</h2><span class="n" id="strkNote"></span></div>
    <div class="card" id="strkCard"></div>

function award(keys,amount,date,quiet){
  const d=date||today();
  if(!quiet&&!S.log[d])S.log[d]=Object.fromEntries(SK.map(k=>[k,0]));
  keys.forEach(k=>{const st=S.stats[k];if(!st)return;
    st.xp+=amount;
    if(!quiet){if(amount>0)st.total+=amount;S.log[d][k]=(S.log[d][k]||0)+amount}
    while(st.xp>=need(st.lvl)){const was=rankOf(k,st.lvl);st.xp-=need(st.lvl);st.lvl++;
      LVQ.push({k,lvl:st.lvl,was,now:rankOf(k,st.lvl)})}
    while(st.xp<0){if(st.lvl>1){st.lvl--;st.xp+=need(st.lvl)}else{st.xp=0;break}}})}

/* ---------- серії, пораховані з журналу ---------- */
const STREAK_MIN=10;
function shiftDay(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10)}
function dayVal(iso,k){const l=S.log[iso];return l?(l[k]||0):0}
function qual(iso,k,thr){return k==='*'?SK.every(x=>dayVal(iso,x)>=thr):dayVal(iso,k)>=thr}
function streakOf(k,thr){
  let d=today(),n=0,g=0;
  if(!qual(d,k,thr))d=shiftDay(d,-1);
  while(qual(d,k,thr)&&g++<500){n++;d=shiftDay(d,-1)}
  return n}
function maxRun(k,thr){
  const keys=Object.keys(S.log).sort();let best=0,run=0,prev=null;
  for(const d of keys){
    if(prev!==null&&shiftDay(prev,1)!==d)run=0;
    run=qual(d,k,thr)?run+1:0;
    if(run>best)best=run;prev=d}
  return best}

  if(i===1)return 'вчора';

    while(st.xp>=need(st.lvl)){const was=rankOf(k,st.lvl);st.xp-=need(st.lvl);st.lvl++;
      LVQ.push({k,lvl:st.lvl,was,now:rankOf(k,st.lvl)})}});
  award(keys,xp,iso)}

  if(!S.ach)S.ach={};

  while(guard++<5){

    TRACKS.forEach(tr=>{const c=trackCur(tr);
      tr.tiers.forEach((t,i)=>{const key=tr.id+'@'+t;
        if(c>=t&&!S.ach[key]){S.ach[key]=today();

    const day=S.log[cur]||Object.fromEntries(SK.map(k=>[k,0]));
    SK.forEach(k=>{const st=S.stats[k];
      if((day[k]||0)>0){st.miss=0}
      else{st.miss=(st.miss||0)+1;
        if(S.penalty>0){
          const pen=S.penalty*Math.min(st.miss,4);
          st.xp-=pen;lost+=pen;
          if(!S.log[cur])S.log[cur]=Object.fromEntries(SK.map(x=>[x,0]));
          S.log[cur][k]=(S.log[cur][k]||0)-pen;
          while(st.xp<0){if(st.lvl>1){st.lvl--;st.xp+=need(st.lvl)}else{st.xp=0;break}}}}});
    const n=new Date(cur+'T12:00:00');n.setDate(n.getDate()+1);cur=n.toISOString().slice(0,10)}
  S.tasks=S.tasks.filter(x=>!(x.once&&x.doneOn));
  S.tasks.forEach(x=>{x.doneOn=null;x.count=0});
  const keys=Object.keys(S.log).sort();
  if(keys.length>200)keys.slice(0,keys.length-200).forEach(k=>delete S.log[k]);
  S.lastDay=t;save();
  if(lost)setTimeout(()=>toast('Втрачено '+lost+' балів за дні без прогресу'),800)}

function pickFortune(){

  const avoid=(S.fortSeen||[]).slice(-Math.min(30,Math.floor(list.length/2)));
  let pool=list.filter(x=>!avoid.includes(x));

  S.fortDay=today();
  S.fortSeen=[...(S.fortSeen||[]),S.fortText].slice(-60);
  save();return true}

/* ---------- тижневий підсумок ---------- */
const WD=['нд','пн','вт','ср','чт','пт','сб'];
function weekData(){
  const days=[],prev=[];
  for(let i=6;i>=0;i--)days.push(shiftDay(today(),-i));
  for(let i=13;i>=7;i--)prev.push(shiftDay(today(),-i));
  const sum=a=>a.reduce((x,d)=>x+SK.reduce((y,k)=>y+dayVal(d,k),0),0);
  const byStat={};SK.forEach(k=>byStat[k]=days.reduce((a,d)=>a+dayVal(d,k),0));
  return{days,total:sum(days),prev:sum(prev),byStat,
    active:days.filter(d=>SK.some(k=>dayVal(d,k)>0)).length,
    full:days.filter(d=>qual(d,'*',STREAK_MIN)).length}}

function renderWeek(){
  const c=document.getElementById('weekCard'),w=weekData();
  const dl=w.total-w.prev;
  const peak=Math.max(20,...w.days.map(d=>SK.reduce((a,k)=>a+Math.max(0,dayVal(d,k)),0)));
  let h='<div class="wk-top"><span class="wk-t">Тиждень</span>';
  if(w.prev||w.total)h+='<span class="wk-d" style="color:'+(dl>0?TV['--good']:(dl<0?TV['--bad']:TV['--dim']))+'">'
    +(dl?((dl>0?'+':'')+dl+' до минулого'):'як минулого тижня')+'</span>';
  h+='<span class="wk-sum">'+(w.total>0?'+':'')+w.total+'</span></div>';
  h+='<div class="wk-bars">';
  w.days.forEach(d=>{h+='<div class="wk-col">';
    const any=SK.some(k=>dayVal(d,k)>0);
    if(!any)h+='<i style="height:3px;background:'+TV['--hb-empty']+'"></i>';
    else SK.forEach(k=>{const v=Math.max(0,dayVal(d,k));if(!v)return;
      h+='<i style="height:'+Math.max(2,Math.round(v/peak*36))+'px;background:'+ST[k].color+'"></i>'});
    h+='</div>'});
  h+='</div><div class="wk-days">';
  w.days.forEach(d=>{h+='<span>'+WD[new Date(d+'T12:00:00').getDay()]+'</span>'});
  h+='</div>';
  const ranked=SK.slice().sort((a,b)=>w.byStat[b]-w.byStat[a]);
  const top=ranked[0],low=ranked[ranked.length-1];
  if(w.total>0){
    h+='<div class="wk-l">Найбільше — <b>'+ST[top].emo+' '+ST[top].name+'</b> ('+w.byStat[top]+')'
      +', найменше — <b>'+ST[low].emo+' '+ST[low].name+'</b> ('+w.byStat[low]+').</div>';
    h+='<div class="wk-l">Днів із прогресом: <b>'+w.active+' з 7</b> · повних днів (10+ по всіх): <b>'+w.full+'</b>.</div>';
  } else h+='<div class="wk-l">За сім днів поки порожньо. Почни з одного завдання.</div>';
  c.innerHTML=h}

function bonusXp(b){return Math.max(0,Math.round(+b.xp||0))}
function bonusKeys(b){return SK.filter(k=>(b.stats||[]).includes(k))}
function bonusCount(b){return b.repeat?Math.max(0,b.count||0):(b.doneOn?1:0)}

function toggleBonus(id,dir){
  const b=(S.bonuses||[]).find(x=>x.id===id);if(!b)return;
  const xp=bonusXp(b),keys=bonusKeys(b);
  if(b.repeat){
    if(dir<0){if(!(b.count>0))return;b.count--;award(keys,-xp,null,true);
      if(!b.count)b.doneOn=null;save();render();toast('Мінус один')}
    else{b.count=(b.count||0)+1;b.doneOn=today();award(keys,xp,null,true);save();render();
      toast('+'+xp+' · '+b.name+' — '+b.count+'-й раз')}
    return}
  if(b.doneOn){b.doneOn=null;award(keys,-xp,null,true);save();render();toast('Відмітку знято')}
  else{b.doneOn=today();award(keys,xp,null,true);save();render();
    toast('+'+xp+' · '+b.name)}}

const DORD=Object.fromEntries(DIFF.map((d,i)=>[d.k,i]));
const SORTS=[{k:'def',label:'звичайно'},{k:'diff',label:'складність'},{k:'abc',label:'абетка'}];

function renderSort(){
  const r=document.getElementById('sortRow');if(!r)return;r.innerHTML='';
  const lb=document.createElement('span');lb.className='lb';lb.textContent='сортувати';r.appendChild(lb);
  SORTS.forEach(o=>{
    const b=document.createElement('button');
    const act=S.sort===o.k;
    b.className='sch'+(act?' on':'');
    b.textContent=o.label+(act&&o.k!=='def'?(S.sortDir===1?' ↑':' ↓'):'');
    b.onclick=()=>{
      if(S.sort===o.k&&o.k!=='def')S.sortDir=S.sortDir===1?-1:1;
      else{S.sort=o.k;S.sortDir=1}
      save();render()};
    r.appendChild(b)})}

function renderTasks(){
  const box=document.getElementById('taskList');box.innerHTML='';
  let list=[...S.tasks.filter(t=>filter==='all'||t.stats.includes(filter))];
  const dir=S.sortDir===-1?-1:1;
  if(S.sort==='diff')list.sort((a,b)=>((DORD[a.diff]||0)-(DORD[b.diff]||0))*dir
    ||a.name.localeCompare(b.name,'uk'));
  else if(S.sort==='abc')list.sort((a,b)=>a.name.localeCompare(b.name,'uk')*dir);
  list.sort((a,b)=>(a.doneOn?1:0)-(b.doneOn?1:0));
  const left=list.filter(t=>!t.doneOn).length;
  document.getElementById('taskCount').textContent=left?left+' лишилось':'усе виконано';
  const nd=document.getElementById('navDot');
  if(nd)nd.classList.toggle('on',S.tasks.some(t=>!t.doneOn));
  if(!list.length){box.innerHTML='<div class="empty">Тут поки порожньо.<br>Додай завдання й познач, до яких стат воно належить.</div>';return}
  list.forEach(t=>box.appendChild(taskRow(t)))}

function taskRow(t){
  const el=document.createElement('div');
  el.className='task'+(t.doneOn?' done':'')+(t.multi&&t.count?' rep':'');
  const xp=DF[t.diff].xp,c0=ST[t.stats[0]];
  if(t.multi){
    if(t.count){const mn=document.createElement('button');mn.className='mn';mn.textContent='−';
      mn.title='Прибрати один раз';
      mn.onclick=()=>{if(!t.count)return;t.count--;award(t.stats,-xp);
        if(!t.count)t.doneOn=null;save();render()};
      el.appendChild(mn)}
    const c=document.createElement('button');c.className='cnt'+(t.count?' has':'');
    c.textContent=t.count?'×'+t.count:'+';
    if(t.count){c.style.borderColor=c0.color;c.style.background=c0.soft;c.style.color=c0.color}
    c.onclick=()=>{t.count=(t.count||0)+1;t.doneOn=today();award(t.stats,xp);save();render()};
    el.appendChild(c)}
  else{const c=document.createElement('button');c.className='check';c.textContent='✓';
    if(t.doneOn){c.style.background=c0.color;c.style.borderColor=c0.color}
    c.onclick=()=>{if(t.doneOn){award(t.stats,-xp);t.doneOn=null;t.count=0}
      else{t.doneOn=today();t.count=1;award(t.stats,xp)}save();render()};
    el.appendChild(c)}
  const b=document.createElement('div');b.className='tb';
  b.innerHTML='<div class="tn">'+esc(t.name)+'</div>';
  const m=document.createElement('div');m.className='tm';
  t.stats.forEach(k=>{const s=ST[k],p=document.createElement('span');p.className='pill';
    p.style.color=s.color;p.style.background=s.soft;p.textContent=s.emo+' '+s.name;m.appendChild(p)});
  const d=document.createElement('span');d.className='dlab';d.textContent=DF[t.diff].label;m.appendChild(d);
  if(t.once){const o=document.createElement('span');o.className='dlab';o.textContent='· разове';m.appendChild(o)}
  b.appendChild(m);b.onclick=()=>openTask(t);el.appendChild(b);
  const n=t.count||0,earned=xp*n;
  const v=document.createElement('div');v.className='xpv'+(n?' hot':'');
  v.textContent='+'+(n?earned:xp);
  if(n){v.style.color=c0.color;v.title='сьогодні '+n+'× по '+xp}
  el.appendChild(v);
  const ed=document.createElement('button');ed.className='ed';ed.textContent='✎';
  ed.onclick=e=>{e.stopPropagation();openTask(t)};el.appendChild(ed);
  return el}

const veil=document.getElementById('veil'),modal=document.getElementById('modal');
veil.onclick=e=>{if(e.target===veil)close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function close(){veil.classList.remove('on');modal.innerHTML='';setTimeout(flushLevels,180)}
function open(h){modal.innerHTML=h;veil.classList.add('on')}

function flushLevels(){
  if(veil.classList.contains('on'))return;
  /* вище останнього прописаного рівня тексту вже немає — показуємо просто тост */
  const over=[];
  while(LVQ.length&&LVQ[0].lvl>(FLAVOR[LVQ[0].k]||[]).length)over.push(LVQ.shift());
  if(over.length){
    const txt=over.map(e=>ST[e.k].emo+' '+ST[e.k].name+' — рівень '+e.lvl).join(' · ');
    setTimeout(()=>toast(txt),over.length&&LVQ.length?0:250)}
  if(!LVQ.length){flushAch();return}
  const e=LVQ.shift(),s=ST[e.k],pool=FLAVOR[e.k];
  const fl=pool[Math.min(Math.max(1,e.lvl),pool.length)-1]||'';
  let h='<div class="lv">';
  h+='<div class="lv-emo">'+e.now.emo+'</div>';
  h+='<div class="lv-stat" style="color:'+s.color+'">'+s.emo+' '+s.name+'</div>';
  if(fl)h+='<div class="lv-fl">'+esc(fl)+'</div>';
  if(e.was.name!==e.now.name)h+='<div class="lv-was">Ти більше не '+esc(e.was.name)+'.</div>';
  h+='<div class="lv-now" style="color:'+s.color+'">Тепер ти '+esc(e.now.name)+'</div>';
  h+='<div class="lv-n">рівень '+e.lvl+'</div></div>';
  h+='<div class="mrow"><button class="btn pri" id="lvOk">Далі</button></div>';
  open(h);modal.querySelector('#lvOk').onclick=()=>{close();setTimeout(flushLevels,180)}}

function flushAch(){
  if(!AQ.length||veil.classList.contains('on'))return;
  if(AQ.length>=3){
    const all=AQ.splice(0,AQ.length);
    let h='<div class="lv"><div class="lv-emo">🏅</div>'
      +'<div class="lv-stat" style="color:'+TV['--accent']+'">Нагороди — '+all.length+'</div></div>';
    h+='<div class="f" style="margin-top:12px;max-height:44vh;overflow:auto">';
    all.forEach(e=>{const col=e.tr.ck?ST[e.tr.ck].color:TV['--accent'];
      h+='<div style="display:flex;gap:8px;align-items:baseline;font-size:12.5px;font-weight:700;padding:3px 0">'
        +'<span>'+e.tr.emo+'</span><span style="flex:1">'+esc(tierName(e.tr,e.tier))+'</span>'
        +'<span style="font-family:var(--disp);font-weight:500;color:'+col+'">+'+e.xp+'</span></div>'});
    h+='</div><div class="mrow"><button class="btn pri" id="aOk">Клас</button></div>';
    open(h);modal.querySelector('#aOk').onclick=()=>{close();setTimeout(flushLevels,180)};return}
  const e=AQ.shift(),col=e.tr.ck?ST[e.tr.ck].color:TV['--accent'];
  let h='<div class="lv">';
  h+='<div class="lv-emo">🏅</div>';
  h+='<div class="lv-stat" style="color:'+col+'">Нагорода</div>';
  h+='<div class="lv-now" style="color:'+col+';font-size:19px">'+esc(tierName(e.tr,e.tier))+'</div>';
  h+='<div class="lv-fl">'+(e.n>1?'+'+e.xp+' балів кожній статі':'+'+e.xp+' балів')+'</div>';
  h+='</div><div class="mrow"><button class="btn pri" id="aOk">Клас</button></div>';
  open(h);modal.querySelector('#aOk').onclick=()=>{close();setTimeout(flushLevels,180)}}

function openTask(t){
  const isNew=!t;
  t=t||{id:uid(),name:'',diff:'low',stats:[filter==='all'?'str':filter],multi:false,once:false,doneOn:null,count:0};
  let h='<h3>'+(isNew?'Нове завдання':'Завдання')+'</h3>';
  h+='<div class="f"><label>Назва</label><input type="text" id="tName" value="'+esc(t.name)+'" placeholder="Наприклад: медитація 10 хвилин"></div>';
  h+='<div class="f"><label>Стати — можна кілька</label><div class="mchips" id="tStats">';
  STATS.forEach(s=>h+='<button class="mchip'+(t.stats.includes(s.k)?' on':'')+'" data-k="'+s.k
    +'" style="'+(t.stats.includes(s.k)?'color:'+s.color+';border-color:'+s.line+';background:'+s.soft:'')+'">'+s.emo+' '+s.name+'</button>');
  h+='</div><p class="note">Кожна вибрана стата отримує повний бал, а не частину.</p></div>';
  h+='<div class="f"><label>Складність</label><div class="mchips" id="tDiff">';
  DIFF.forEach(d=>h+='<button class="mchip'+(t.diff===d.k?' on':'')+'" data-k="'+d.k+'">'+d.label+' · '+d.xp+'</button>');
  h+='</div></div>';
  h+='<div class="f"><label>Тип</label><div class="mchips" id="tType">';
  h+='<button class="mchip'+(t.multi?' on':'')+'" data-k="multi">рахувати повтори</button>';
  h+='<button class="mchip'+(t.once?' on':'')+'" data-k="once">разове</button></div></div>';
  if(!isNew){
    h+='<div class="f"><label>Забула відмітити?</label><div class="retro" id="tRetro">';
    for(let i=1;i<=7;i++){const iso=shiftDay(today(),-i);
      h+='<button class="rd" data-d="'+iso+'" data-i="'+i+'">'+retroLabel(iso,i)+'</button>'}
    h+='</div><p class="note">Нараховує бали за той день. Якщо за нього був штраф — він повернеться.</p></div>'}
  h+='<div class="mrow">'+(isNew?'':'<button class="btn del" id="tDel">✕</button>')
    +'<button class="btn" id="tCancel">Назад</button><button class="btn pri" id="tSave">Зберегти</button></div>';
  open(h);
  const dr={stats:[...t.stats],diff:t.diff,multi:t.multi,once:t.once};
  modal.querySelectorAll('#tStats .mchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,s=ST[k],i=dr.stats.indexOf(k);
    if(i>-1){if(dr.stats.length===1)return;dr.stats.splice(i,1);c.classList.remove('on');c.style.cssText=''}
    else{dr.stats.push(k);c.classList.add('on');c.style.color=s.color;c.style.borderColor=s.line;c.style.background=s.soft}});
  modal.querySelectorAll('#tDiff .mchip').forEach(c=>c.onclick=()=>{dr.diff=c.dataset.k;
    modal.querySelectorAll('#tDiff .mchip').forEach(x=>x.classList.remove('on'));c.classList.add('on')});
  modal.querySelectorAll('#tType .mchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;dr[k]=!dr[k];c.classList.toggle('on',dr[k]);
    if(dr.multi&&dr.once){const o=k==='multi'?'once':'multi';dr[o]=false;
      modal.querySelector('#tType .mchip[data-k='+o+']').classList.remove('on')}});
  modal.querySelectorAll('#tRetro .rd').forEach(c=>{let n=0;
    c.onclick=()=>{const iso=c.dataset.d,xp=DF[dr.diff].xp;
      const keys=SK.filter(k=>dr.stats.includes(k));
      retroAward(keys,xp,iso);
      n++;c.classList.add('hit');c.textContent=retroLabel(iso,+c.dataset.i)+' +'+(xp*n);
      save();syncStreaks();checkAch();renderTop();renderRadar();renderWeek();renderGrid();renderAch();
      toast('Зараховано за '+iso.slice(8)+'.'+iso.slice(5,7))}});
  modal.querySelector('#tCancel').onclick=close;
  const del=modal.querySelector('#tDel');
  if(del)del.onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);save();render();close();toast('Видалено')};
  modal.querySelector('#tSave').onclick=()=>{
    const n=modal.querySelector('#tName').value.trim();if(!n){toast('Впиши назву');return}
    t.name=n;t.stats=SK.filter(k=>dr.stats.includes(k));t.diff=dr.diff;t.multi=dr.multi;t.once=dr.once;
    if(isNew)S.tasks.unshift(t);save();render();close()}}

      r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.stats||!d.tasks)throw 0;
        S=Object.assign(structuredClone(blank),d);
        SK.forEach(k=>{if(!S.stats[k])S.stats[k]={xp:0,lvl:1,total:0,streak:0,best:0,miss:0};
          if(S.stats[k].miss==null)S.stats[k].miss=0});
        if(!S.fortunes||!S.fortunes.length)S.fortunes=FORTUNES.slice();
        if(!Array.isArray(S.bonuses))S.bonuses=[];
        if(S.autoAch==null)S.autoAch=1;
        if(!THEMES[S.theme])S.theme='sky';
        if(!['def','diff','abc'].includes(S.sort))S.sort='def';
        applyTheme();save();rollover();render();close();toast('Дані завантажено')}catch(e){toast('Файл не підходить')}};
      r.readAsText(f)};i.click()};
  modal.querySelector('#sResetProg').onclick=()=>{
    const nt=(S.tasks||[]).length,nb=(S.bonuses||[]).length;
    if(!confirm('Обнулити рівні, бали, серії та всі відмітки?\n\n'
      +'Лишаться: завдання ('+nt+'), мої досягнення ('+nb+'), теми й налаштування.\n'
      +'Це не можна скасувати.'))return;
    resetProgress();render();close();toast('Прогрес обнулено — з чистого аркуша')};
  modal.querySelector('#sReset').onclick=()=>{
    if(!confirm('Стерти ВСЕ — разом із твоїми завданнями й досягненнями?\n\n'
      +'Застосунок повернеться до стартового набору завдань. Це не можна скасувати.'))return;
    localStorage.removeItem(KEY);S=load();applyTheme();save();render();close();toast('Готово')}};

function sumToTen(){let s=0;for(let l=1;l<10;l++)s+=60+40*(l-1)+6*(l-1)*(l-1);return s}

document.querySelectorAll('.nv').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.nv').forEach(x=>x.classList.remove('on'));n.classList.add('on');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.dataset.p===n.dataset.p));
  window.scrollTo({top:0,behavior:'instant'})});

function goTab(p){const n=document.querySelector('.nv[data-p='+p+']');if(n)n.click()}

applyTheme();
rollover();
backfillAch();
const fresh=pickFortune();
render();
if(fresh)showFortuneModal();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){
  rollover();const f=pickFortune();render();if(f)showFortuneModal()}});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
