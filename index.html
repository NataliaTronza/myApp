<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCEBFB">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Waymark">
<title>Waymark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3F4E63; --ink-2:#6C7F97; --dim:#9DAFC4;
  --card:#FFFFFF; --edge:#D8E6F5; --edge-2:#C3D8ED; --soft:#EEF5FD;
  --field:#FFFFFF; --accent:#5D93C7; --sky:#8FC0EE; --good:#5A8F76; --bad:#C98080;
  --root:#E4F0FC; --page:linear-gradient(170deg,#DCEBFB 0%,#E9F1FE 45%,#F1ECFD 100%);
  --nav:rgba(240,246,254,.94); --veil:rgba(63,78,99,.4);
  --fort-bg:#FFF8E9; --fort-edge:#F2DFB4; --fort-lb:#B08A3A; --fort-tx:#7A5E22;
  --claim-bg:#FFF4D9; --claim-edge:#F0D79B; --claim-ink:#A9761B;
  --pri-bg:#CFE6FB; --pri-edge:#A6CDF2; --pri-ink:#2F5F8E;
  --del-bg:#FDECEC; --del-edge:#F3C4C4; --del-ink:#B25757;
  --rad-grid:#D8E6F5; --rad-spoke:#E4EDF8; --rad-face:#F7FAFE;
  --rad-fill:#A9CDF2; --rad-line:#79AEEC; --rad-label:#5A6B80;
  --seg-line:rgba(0,0,0,.07); --hb-empty:#E4EDF7;
  --disp:'Fredoka',system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--root)}
body{
  font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);
  background:var(--page);
  background-attachment:fixed;min-height:100vh;padding:0 0 96px;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.bar{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.bar .t{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:.02em}
.bar .s{font-size:11.5px;color:var(--ink-2);font-weight:600}
.ib{width:36px;height:36px;border-radius:11px;background:var(--card);border:2px solid var(--edge);
  box-shadow:0 2px 0 var(--edge);display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.ib:active{transform:translateY(2px);box-shadow:none}
.ib+.ib{margin-left:4px}
.spacer{margin-left:auto}

.page{display:none}
.page.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:4px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:var(--nav);backdrop-filter:blur(8px);border-top:2px solid var(--edge)}
.nv{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;
  border-radius:11px;font-family:var(--disp);font-size:12px;font-weight:500;color:var(--dim)}
.nv .e{font-size:17px;line-height:1.1;filter:grayscale(1);opacity:.5}
.nv.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge);border:2px solid var(--edge);padding:4px 2px}
.nv.on .e{filter:none;opacity:1}
.nv .dot{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;
  background:#EE9184;border:2px solid #FDEEEB;display:none}
.nv .dot.on{display:block}

.card{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);
  box-shadow:0 3px 0 var(--edge);padding:14px}
.radarcard{margin-bottom:9px;padding:8px 10px 4px}
.radarcard svg{width:100%;height:auto;display:block}
.rlg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 4px 6px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.rlg .k{display:flex;align-items:center;gap:5px}
.rlg .sw{width:16px;height:0;border-top:3px solid var(--rad-line);border-radius:2px}
.rlg .sw.g{border-top:2px dashed var(--ink-2);opacity:.7}
.rlg .seg2{margin-left:auto;display:flex;border:2px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--soft)}
.rlg .seg2 button{font-family:var(--disp);font-size:12px;font-weight:500;padding:3px 9px;color:var(--ink-2)}
.rlg .seg2 button.on{background:var(--card);color:var(--accent)}
.rlg .hint{width:100%;color:var(--dim);font-weight:600}

/* «+бали» вилітають з кнопки, яку натиснула */
.flt{position:fixed;z-index:90;pointer-events:none;font-family:var(--disp);font-weight:600;font-size:17px;
  transform:translate(-50%,0);text-shadow:0 1px 0 var(--card),0 0 6px var(--card);animation:flt .9s ease-out forwards}
@keyframes flt{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}

/* конфеті з квадратиків — таких самих, як точки на мапі */
.cf{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.veil .cf{z-index:1}
.cf i{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:2px;
  border:1.5px solid rgba(255,255,255,.9);animation:burst var(--d) var(--dl) both}
@keyframes burst{
  0%{transform:translate(0,0) rotate(0) scale(.3);opacity:1;animation-timing-function:cubic-bezier(.1,.8,.3,1)}
  32%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--rot)*.35)) scale(1);opacity:1;animation-timing-function:cubic-bezier(.55,0,.9,.6)}
  100%{transform:translate(calc(var(--dx)*1.25),calc(var(--dy) + 75vh)) rotate(var(--rot)) scale(.85);opacity:0}}
.lv-emo{animation:lvpop .55s cubic-bezier(.3,1.6,.5,1) .08s backwards}
@keyframes lvpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* рік у клітинках */
.hm{display:flex;gap:6px;margin-top:4px}
.hm-d{display:grid;grid-template-rows:14px repeat(7,12px);row-gap:3px;font-size:9.5px;color:var(--dim);font-weight:700;flex:none}
.hm-d span{line-height:12px}
.hm-s{overflow-x:auto;flex:1;scrollbar-width:thin;padding-bottom:4px}
.hm-g{display:grid;grid-auto-flow:column;grid-template-rows:14px repeat(7,12px);grid-auto-columns:12px;gap:3px;width:max-content}
.hm-m{font-size:9.5px;color:var(--dim);font-weight:700;white-space:nowrap;line-height:14px;overflow:visible}
.hm-c{width:12px;height:12px;border-radius:3px;background:var(--hb-empty);position:relative;padding:0;border:0}
.hm-c.pd::after{content:'';position:absolute;right:1px;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--bad)}
.hm-c.td{outline:2px solid var(--ink-2);outline-offset:1px}
.hm-c.sel{outline:2px solid var(--accent);outline-offset:1px}
.htabs{display:flex;border:2px solid var(--edge);border-radius:11px;overflow:hidden;background:var(--soft);margin-bottom:12px}
.htabs button{flex:1;font-family:var(--disp);font-size:13.5px;font-weight:500;padding:7px 4px;color:var(--ink-2)}
.htabs button.on{background:var(--card);color:var(--accent);box-shadow:0 2px 0 var(--edge)}
.ac-sum{display:flex;align-items:center;gap:12px;margin-top:13px;font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.5}
.ac-sum b{color:var(--ink)}
.ac-n{font-family:var(--disp);font-size:34px;font-weight:600;color:var(--rad-line);line-height:1;flex:none}
.ac-note{font-size:11.5px;color:var(--dim);font-weight:600;line-height:1.5;margin-top:8px}
.ac-list{display:flex;flex-direction:column;gap:10px;margin-top:13px}
.ac-t{display:flex;align-items:baseline;gap:8px}
.ac-nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.35}
.ac-nm i{font-style:normal;color:var(--dim);font-weight:600}
.ac-c{font-family:var(--disp);font-size:15px;font-weight:600;flex:none}
.ac-b{height:6px;border-radius:4px;background:var(--hb-empty);margin-top:4px;overflow:hidden}
.ac-b i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:acgrow .5s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes acgrow{from{transform:scaleX(0)}}
.ac-m{font-size:11px;color:var(--dim);font-weight:700;margin-top:3px}
.ac-never{display:flex;flex-wrap:wrap;gap:5px}
.ac-never span{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--soft);border:2px solid var(--edge);border-radius:8px;padding:2px 8px}
@media (prefers-reduced-motion: reduce){.ac-b i{animation:none}}
.hm-x{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.55;min-height:38px;margin-top:6px}
.hm-x b{color:var(--ink)}
.hm-lg{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--dim);font-weight:700;margin-top:4px}
.hm-lg i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* підсумок тижня */
.rc-n{font-family:var(--disp);font-size:34px;font-weight:600;line-height:1.1}
.rc-d{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:3px}
.rc-l{display:flex;gap:9px;align-items:baseline;font-size:13px;font-weight:600;line-height:1.45;padding:6px 0;
  border-top:2px dashed var(--edge)}
.rc-l .e{flex:none;width:20px;text-align:center}
.rc-l .t{flex:1;min-width:0}
.rc-l .t small{display:block;color:var(--ink-2);font-size:11.5px;font-weight:600}

/* ---------- рух ---------- */
.page.on{animation:pagein .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.veil.on{animation:vfade .18s ease-out}
@keyframes vfade{from{opacity:0}}
.modal{position:relative;z-index:2}
.veil.on .modal{animation:mup .34s cubic-bezier(.2,1.25,.35,1)}
@keyframes mup{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

/* галочка: пружинка й кільце кольору стати */
.check,.cnt{position:relative}
.check.pop,.cnt.pop{animation:ckpop .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes ckpop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop::after,.cnt.pop::after{content:'';position:absolute;inset:-7px;border-radius:12px;border:2px solid var(--ring);
  animation:ckring .55s ease-out forwards;pointer-events:none}
@keyframes ckring{from{opacity:.9;transform:scale(.7)}to{opacity:0;transform:scale(1.45)}}

/* картки стат: вміст завжди зверху; при нових балах — поштовх і клітинки, що заповнюються */
.sc{display:flex;flex-direction:column;justify-content:flex-start}
.sc.bump{animation:scbump .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes scbump{0%,100%{transform:none}35%{transform:scale(1.035)}}
.seg i.fill{animation:segfill .4s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes segfill{from{opacity:0;transform:scale(.3)}}
.sc-lvl.up{display:inline-block;animation:lvlup .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes lvlup{0%,100%{transform:none}40%{transform:scale(1.7) rotate(-8deg)}}

/* квест виконано: поштовх і відблиск */
.quest{position:relative;overflow:hidden}
.quest.justdone{animation:scbump .6s cubic-bezier(.3,1.5,.5,1)}
.quest.justdone::after{content:'';position:absolute;inset:0;pointer-events:none;transform:translateX(-110%);
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);animation:shine .9s ease-out .1s forwards}
html.dk .quest.justdone::after{background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%)}
@keyframes shine{to{transform:translateX(110%)}}

/* стовпчики тижня виростають при відкритті */
.wk-bars.grow .wk-col{transform-origin:bottom;animation:wkgrow .55s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes wkgrow{from{transform:scaleY(0)}}
/* рік у клітинках проявляється хвилею */
.hm-g.rev .hm-c{animation:hmin .3s ease-out backwards}
@keyframes hmin{from{opacity:0;transform:scale(.3)}}

/* новий рівень: промені за значком */
.lv-hero{position:relative;height:92px;display:grid;place-items:center}
.lv-hero .lv-emo{position:relative;z-index:1}
.lv-rays{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--c) 0deg 8deg,transparent 8deg 22.5deg);
  -webkit-mask:radial-gradient(circle,#000 14%,transparent 66%);mask:radial-gradient(circle,#000 14%,transparent 66%);
  opacity:.3;animation:raysin .7s cubic-bezier(.2,1.2,.4,1) backwards,rays 16s linear .7s infinite}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes raysin{from{opacity:0;transform:scale(.3) rotate(-60deg)}}

/* виконані завдання окремим блоком і прогрес дня */
.tsub{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);font-weight:700;padding:10px 4px 7px}
.tsub::after{content:'';flex:1;height:2px;background:var(--edge);border-radius:2px}
.tprog{height:6px;border-radius:4px;background:var(--edge);overflow:hidden;margin:-2px 4px 11px}
.tprog i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}

@media (prefers-reduced-motion: reduce){
  .flt,.cf,.lv-emo,.page.on,.veil.on,.veil.on .modal,.check.pop,.cnt.pop,.check.pop::after,.cnt.pop::after,
  .sc.bump,.seg i.fill,.sc-lvl.up,.quest.justdone,.quest.justdone::after,.wk-bars.grow .wk-col,.hm-g.rev .hm-c,.lv-rays{animation:none!important}
  .tprog i{transition:none}
  .cf,.flt{display:none}}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:9px}
.hero .txt{flex:1;min-width:0}
.hero h1{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.25}
.hero p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tchip{font-family:var(--disp);font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:8px;border:2px solid}

.fort{background:var(--fort-bg);border:2px solid var(--fort-edge);box-shadow:0 3px 0 var(--fort-edge);border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.fort .ic{font-size:17px;line-height:1.3;flex:none}
.fort .lb{font-family:var(--disp);font-size:11.5px;font-weight:500;color:var(--fort-lb);letter-spacing:.05em;text-transform:uppercase}
.fort .tx{font-size:14px;font-weight:600;color:var(--fort-tx);line-height:1.5;margin-top:3px}

.quest{background:var(--card);border:2px solid var(--accent);box-shadow:0 3px 0 var(--accent);
  border-radius:var(--r);padding:12px 13px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.quest.qdone{border-color:var(--edge-2);box-shadow:0 3px 0 var(--edge-2);background:var(--soft)}
.quest .ic{font-size:20px;line-height:1.25;flex:none}
.quest .qb{flex:1;min-width:0}
.quest .lb{font-family:var(--disp);font-size:11px;font-weight:500;color:var(--accent);
  letter-spacing:.05em;text-transform:uppercase}
.quest.qdone .lb{color:var(--dim)}
.quest .tn{font-size:14.5px;font-weight:700;margin-top:4px;line-height:1.35}
.quest .td{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:4px}
.quest .qm{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.quest .qx{font-family:var(--disp);font-size:13px;font-weight:600;color:var(--accent);flex:none;margin-top:2px}
.quest.qdone .qx{color:var(--dim)}
.quest.qdone .check{color:#fff}
.qrow{display:flex;align-items:center;gap:8px}
.qlist{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow:auto;margin-top:4px;padding-right:2px}
.qi{display:flex;gap:9px;align-items:flex-start;background:var(--field);border:2px solid var(--edge);
  border-radius:11px;padding:9px 10px;cursor:pointer;text-align:left;width:100%}
.qi .n1{font-size:13.5px;font-weight:700;line-height:1.35}
.qi .n2{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:3px}
.sh{display:flex;align-items:center;gap:7px;padding:18px 4px 9px}
.sh h2{font-family:var(--disp);font-size:16px;font-weight:600}
.sh .n{font-size:11px;color:var(--dim);font-weight:700}
.sh button{margin-left:auto;font-family:var(--disp);font-size:13px;font-weight:500;color:var(--accent);
  border:2px solid var(--edge);background:var(--card);border-radius:9px;padding:3px 10px;box-shadow:0 2px 0 var(--edge)}
.sh button:active{transform:translateY(2px);box-shadow:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc{border:2px solid;border-radius:13px;padding:10px 11px 11px;text-align:left;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.06)}
.sc:active{transform:translateY(2px);box-shadow:none}
.sc.sel{outline:2px dashed currentColor;outline-offset:2px}
.sc-top{display:flex;align-items:center;gap:6px}
.sc-emo{font-size:14px;line-height:1}
.sc-name{font-family:var(--disp);font-size:14.5px;font-weight:600;flex:1;color:var(--ink)}
.sc-lvl{font-family:var(--disp);font-size:15px;font-weight:600}
.sc-rank{font-size:12px;font-weight:700;line-height:1.3;margin-top:5px;min-height:16px}
.seg{display:flex;gap:2px;margin-top:8px}
.seg i{flex:1;height:7px;border-radius:1px;background:var(--field);border:1px solid var(--seg-line)}
.sc-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);margin-top:6px;font-weight:700}
.sc-gain{font-family:var(--disp);font-size:12.5px;font-weight:500}

.sc-r{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-2);margin-top:6px}
.sc-r .gb{flex:1;height:7px;border-radius:4px;background:var(--field);border:1px solid var(--seg-line);overflow:hidden}
.sc-r .gb i{display:block;height:100%;border-radius:3px}
.sc-r .dt{flex:1;display:flex;gap:3px;align-items:center}
.sc-r .dt i{width:8px;height:8px;border-radius:50%;border:1.5px solid;box-sizing:border-box}
.grid .sc:last-child:nth-child(odd){grid-column:1/-1}
.bk{display:flex;align-items:center;gap:10px;background:var(--card);border:2px dashed var(--edge-2);
  border-radius:var(--r);padding:10px 12px;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.45}
.bk .ic{font-size:17px;flex:none}
.bk span{flex:1}
.bk button{flex:none;font-family:var(--disp);font-size:13px;font-weight:500;color:var(--accent);
  border:2px solid var(--edge);background:var(--card);border-radius:9px;padding:4px 10px;box-shadow:0 2px 0 var(--edge)}
.rh{border-top:2px dashed var(--edge);padding:10px 0 2px;margin-bottom:6px}
.rh-t{display:flex;gap:7px;align-items:center;font-size:13.5px;font-weight:700;margin-bottom:7px}
.rh-x{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:8px;display:flex;align-items:center;gap:7px}
.rh-st{flex-direction:column;align-items:flex-start!important;gap:6px}
.rh-st div{display:flex;align-items:center;gap:7px}
.rh-st .rd-hint{color:var(--dim);font-weight:600;font-size:11.5px;line-height:1.5;display:block}
.rh-x input[type=number]{width:64px!important;text-align:center;padding:5px 6px!important}
.filters{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:9px}
.fchip{font-family:var(--disp);font-size:13px;font-weight:500;padding:4px 11px;border-radius:9px;
  background:var(--card);border:2px solid var(--edge);color:var(--ink-2);box-shadow:0 2px 0 var(--edge)}
.fchip.on{color:#fff}
.fchip:active{transform:translateY(2px);box-shadow:none}

.task{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:2px solid var(--edge);

function hexA(h,a){const n=parseInt(h.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}

function applyTheme(){
  const t=THEMES[S.theme]||THEMES.sky;TV=t.v;
  const r=document.documentElement;
  Object.entries(t.v).forEach(([k,v])=>r.style.setProperty(k,v));
  r.classList.toggle('dk',!!t.dark);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t.v['--tc']);
  STATS.forEach(s=>{
    if(t.dark){const c=DARK_STAT[s.k];s.color=c;s.soft=hexA(c,.15);s.line=hexA(c,.42)}
    else{s.color=s.base.color;s.soft=s.base.soft;s.line=s.base.line}})}

 health:[

  /* 5*/ "Квітуча не лише виконує необхідне, а й залишає місце для власного задоволення. Вона знаходить час на улюблені заняття, спілкування, рух і маленькі приємності без потреби спершу заслужити їх подвійною нормою справ. Виявляється, радість не обов’язково має бути премією за ідеально продуктивний день.",
  /* 6*/ "Іскриста краще відчуває, що додає їй енергії, а що непомітно її забирає. Вона вміє шукати маленькі способи відновитися й не соромиться вносити у звичайний день трохи приємного: музику, ароматну свічку, прогулянку чи улюблену книжку. Життя не мусить перетворюватися на фестиваль щодня. Але кілька вогників дуже допомагають.",
  /* 7*/ "Сяюча дедалі впевненіше ставиться до себе й не будує всю самооцінку на одному дзеркалі, одній фотографії чи одному невдалому дні. Вона помічає свої сильні сторони, дбає про тіло й дозволяє собі почуватися добре без нескінченного списку виправлень. Не кожен день буде днем сяйва. Іноді сяйво сьогодні просто вчасно лягло спати.",
  /* 8*/ "Впевнена знає, що її потреби теж важливі. Вона може відмовитися від зайвого, попросити про допомогу, обрати те, що їй підходить, і не писати внутрішню пояснювальну записку на три сторінки через кожне власне рішення. Вона не стає байдужою до інших. Просто перестає автоматично ставити себе останньою в черзі.",
  /* 9*/ "Граційна вміє дбати про себе без війни із собою. Вона поєднує увагу до тіла, внутрішнього стану, зовнішності й особистих меж, не перетворюючи жоден із цих пунктів на нескінченний ремонт. Вона може прагнути змін і водночас цінувати себе теперішню. Дивовижно, але ці дві речі чудово співіснують.",
  /*10*/ "Довершена не означає бездоганна. Це людина, яка навчилася ставитися до себе з повагою, помічати власні потреби, відновлювати сили й будувати життя, у якому є місце і для розвитку, і для задоволення. Вона не мусить щодня сяяти, бути спокійною чи робити все правильно. Її головне досягнення в тому, що турбота про себе більше не залежить від того, наскільки добре вона сьогодні впоралася з усім іншим."
 ],
 ord:[
  /* 1*/ "Десь тут була чашка. Ключі теж мали бути десь тут. А ця річ на столі взагалі звідки взялася? Хаотик живе серед маленьких побутових загадок, і кожна поверхня часом перетворюється на археологічний шар. Але навіть посеред цього всього можна почати з одного маленького куточка. Не треба перемагати весь хаос до обіду.",
  /* 2*/ "Охайна вже помічає, як приємно, коли речі мають своє місце, а стіл не нагадує місце розкопок після дуже насиченого сезону. Вона прибирає потроху, повертає предмети додому й відкриває, що чиста поверхня справді може існувати довше за сім хвилин. Іноді. У сприятливих умовах.",
  /* 3*/ "Організована починає планувати справи, розкладати завдання на кроки й використовувати списки не лише для того, щоб красиво їх створювати. Вона вже краще розуміє, що потрібно зробити сьогодні, а що спокійно переживе до завтра. Список справ іще може розростися до розмірів роману, але тепер у цього роману хоча б є зміст і розділи.",
  /* 4*/ "Чепурна любить, коли простір виглядає приємно й нічого не проситься до уваги зі словами «розбери мене негайно». Вона помічає дрібниці, прибирає зайве й створює навколо себе відчуття зібраності. Не обов’язково жити в інтер’єрі з каталогу. Достатньо, щоб удома було приємно бути, а не страшно відкрити шафу.",
  /* 5*/ "Дбайлива вже не чекає, поки накопичиться гора справ із погрозливим виглядом. Вона підтримує порядок маленькими регулярними діями: миє посуд, поки він не заснував власну державу, прибирає речі й завчасно помічає, що закінчується. Її секрет не в нескінченній продуктивності. Просто дрібні справи більше не мають шансів непомітно вирости до фінального боса.",
  /* 6*/ "Гармонійна знаходить ритм, у якому порядок підтримує життя, а не з’їдає його. У неї є звичні місця для речей, зручні системи зберігання й реалістичне розуміння того, скільки часу забирає побут. Якщо сьогодні немає сил на все, світ не руйнується. Крихти на столі не можуть скасувати всі попередні досягнення.",
  /* 7*/ "Господиня знає свій простір і вміє дбати про нього без постійного режиму пожежної тривоги. Вона розуміє, що коли краще прибрати, що поповнити й як організувати побут, аби він працював на неї. Замість щотижневого героїчного порятунку квартири маємо систему, яка не вимагає викликати підкріплення щоразу, коли приходять гості.",
  /* 8*/ "Берегиня створює простір, у якому речі служать життю, а не життя обертається навколо речей. Вона підтримує лад, дбає про улюблені предмети й уміє відпускати те, що вже не потрібне. Дім стає не складом на випадок гіпотетичного «колись знадобиться», а місцем, де є простір для теперішнього.",
  /* 9*/ "Хранителька затишку знає: порядок це не лише прибрані поверхні, а й світло ввечері, улюблена чашка, плед на своєму місці та відсутність загадкового пакета, який уже місяць живе біля дверей. Вона створює атмосферу, до якої хочеться повертатися. І не панікує, якщо на дивані залишилася книжка. Можливо, вона там саме для того, щоб її читали.",
  /*10*/ "Душа дому перетворює побут на частину хорошого життя, а не на нескінченний список претензій до себе. Вона знає, як підтримувати простір, створювати затишок і залишати місце для спонтанності. Дім не мусить бути бездоганним щосекунди. Він має бути живим, зручним і своїм. А якщо раптом на кухні з’явиться чашка не на тому місці, це ще не привід скликати раду безпеки."
 ],
 art:[
  /* 1*/ "У голові з’являються ідеї. Деякі чудові, деякі дивні, а деякі нагадують сюжет сну після пізньої вечері. Фантазерка ще не завжди знає, що з ними робити, але вже дозволяє собі уявляти й вигадувати без вимоги негайно створити шедевр. Ідеї не зобов’язані одразу приносити користь. Деякі спочатку просто смішні.",
  /* 2*/ "Мріяниця вже не лише уявляє цікаві речі, а й починає збирати з них власні маленькі світи. Вона записує думки, зберігає натхненні картинки, придумує історії або уявляє, як колись спробує нове заняття. Її папка «Ідеї» росте швидше, ніж список реалізованих проєктів. Але тепер серед мрій починають з’являтися перші справжні кроки.",
  /* 3*/ "Натхненниця починає помічати ідеї навколо: у розмовах, книжках, природі, випадкових поєднаннях кольорів і навіть у невдалих спробах. Вона вчиться збирати враження й перетворювати їх на щось своє. Натхнення вже не обов’язково мусить спуститися з небес у супроводі хору. Іноді воно приходить, коли просто сідаєш і починаєш.",
  /* 4*/ "Муза знаходить власні джерела натхнення й поступово створює творчі ритуали. Вона читає, слухає, спостерігає, пробує різні формати й дозволяє собі творити без гарантії ідеального результату. Порожній аркуш іще може дивитися з викликом. Але тепер Муза знає: його можна заповнити, навіть якщо перший варіант буде трохи схожий на інструкцію до невідомого приладу.",
  /* 5*/ "Експериментаторка пробує нові матеріали, техніки й підходи. Вона може змішати кольори, змінити сюжет, розпустити невдалий ряд в’язання чи раптом виявити, що задум працює зовсім не так, як очікувалося. Раніше це могло називатися провалом. Тепер це дослід із неочікуваними результатами. Науковий журнал можна вести подумки, а можна хоча б сфотографувати катастрофу для історії.",
  /* 6*/ "Мисткиня вже має власні творчі звички й уміє втілювати задум у конкретну форму. Вона розвиває навички, тренує око, руку чи голос і вчиться проходити через моменти, коли результат не збігається з уявленням. Це нормально: внутрішній художній директор зазвичай має бюджет на шедевр, а реальні руки працюють за наявними ресурсами. Зате з кожною спробою задум стає ближчим до реальності.",
  /* 7*/ "Авторка створює власні роботи, історії, проєкти чи вироби, які мають її почерк. Вона вже не лише збирає натхнення, а й завершує розпочате, редагує, переробляє та дозволяє результатам існувати поза межами голови. Не кожна робота стане улюбленою. Деякі потрібні, щоб наступна вийшла кращою. Навіть геніальні ідеї іноді починаються з дуже дивного першого абзацу.",
  /* 8*/ "Новаторка вміє поєднувати знайомі речі несподіваним способом і знаходити власні рішення. Вона не боїться відходити від інструкції, якщо має причину, й не плутає оригінальність із необхідністю вигадати щось небачене в історії людства. Іноді достатньо зробити звичну річ по-своєму. А іноді виходить щось настільки нове, що навіть сама авторка кілька хвилин роздивляється результат.",
  /* 9*/ "Шокунін поважає ремесло. Він відточує техніку, помічає дрібні деталі й розуміє, що майстерність росте не лише від великих натхненних поривів, а й від повторення, уваги та терпіння. Він може переробити маленький фрагмент роботи не тому, що ніхто не помітить різниці, а тому, що помітить сам. Досконалість не приходить за одну ніч. Особливо якщо всю ніч розпускати шкарпетку, яка знову вийшла не того розміру.",
  /*10*/ "Віртуозка вільно володіє своїми інструментами й може втілювати складні задуми, поєднувати техніку з уявою та знаходити власні способи самовираження. Вона знає правила достатньо добре, щоб свідомо їх змінювати, і не боїться нових творчих викликів. Але навіть на цьому рівні залишаються невдалі спроби, дивні ідеї та моменти «а що, якщо спробувати інакше?». Саме тому творчість не закінчується разом із досягненням найвищого рівня."
 ],
 mind:[
  /* 1*/ "Одне маленьке запитання, одна цікава стаття, одне відео з назвою «А ви знали?..». І ось кошеня вже сидить посеред купи нових фактів, забувши, навіщо взагалі відкрило телефон. Воно ще не мусить знати всього. Достатньо зберігати цікавість і дозволяти собі запитувати навіть про те, що інші нібито давно знають.",
  /* 2*/ "Шукач не дуже довіряє відповідям на кшталт «ну, це просто так працює». Йому потрібні пояснення, приклади й хоча б одна надійна відповідь на запитання «але чому?». Він починає перевіряти інформацію, порівнювати джерела й помічати, що впевнено написаний допис ще не робить автора експертом. Інтернет, звісно, не в захваті від такої прискіпливості.",
  /* 3*/ "Дослідник уже не просто збирає факти, а прокладає між ними маршрути. Він помічає зв’язки, знаходить нові теми й іноді заходить у такі інтелектуальні нетрі, що початкове запитання давно загубилося десь за поворотом. Але тепер він хоча б розуміє, як повернутися назад. Зазвичай.",
  /* 4*/ "Учений любить розібратися в темі ґрунтовно. Він читає, занотовує, порівнює різні погляди й намагається зрозуміти не лише висновок, а й те, як до нього дійшли. Звісно, іноді нотаток уже більше, ніж самої прочитаної книжки. Та знання поступово перетворюються на систему, а не на склад цікавих фактів без підписів.",
  /* 5*/ "Стратег навчився дивитися на кілька кроків уперед. Він оцінює варіанти, передбачає наслідки й не поспішає хапатися за перше рішення, яке красиво блимає перед очима. План, звісно, може розсипатися після першого контакту з реальністю. Але тепер у нього є не лише план А, а й кілька запасних ходів та здорова підозра до надто простих відповідей.",
  /* 6*/ "Мислитель не боїться складних запитань і вміє залишатися з ними довше, ніж три хвилини. Він перевіряє власні переконання, помічає суперечності й допускає, що може помилятися. Це не завжди комфортно: внутрішня дискусія іноді нагадує токшоу, де всі учасники говорять одночасно. Зате поступово з’являється здатність мислити глибше, а не просто голосніше.",
  /* 7*/ "Мудрець уже знає, що розумна відповідь не завжди найдовша, а впевненість не завжди означає правоту. Він уміє відокремлювати важливе від другорядного, бачити різні перспективи й визнавати межі власних знань. Найдивовижніше відкриття: іноді наймудріша фраза починається зі слів «Я не знаю, давай розберемося».",
  /* 8*/ "Полімат збирає знання з різних світів і раптом помічає, що вони починають розмовляти між собою. Історія допомагає зрозуміти мистецтво, психологія пояснює поведінку персонажів, а наукова стаття несподівано стає ключем до зовсім іншої проблеми. У голові вже ціла міждисциплінарна конференція. Добре, що для неї не потрібно бронювати залу.",
  /* 9*/ "Сеннін дивиться на знання не як на колекцію дипломів, а як на спосіб краще розуміти світ. Він бачить складність там, де раніше здавалися очевидними прості відповіді, і вміє знаходити ясність серед суперечностей. Не кожну загадку потрібно розв’язати негайно. Деякі можна просто залишити собі на подумати, не перетворюючи кожну вечерю на філософський симпозіум.",
  /*10*/ "Всезнавець пройшов довгий шлях від першого «а чому?» до здатності орієнтуватися у складних темах, поєднувати ідеї й навчатися самостійно. Він не знає абсолютно всього, бо навіть людство ще не розібралося з усім, що відбувається у Всесвіті. Зате він уміє ставити хороші запитання, знаходити надійні відповіді й не боятися невідомого. А це, погодьмося, значно корисніше за енциклопедію, яка вміє ходити."
 ],
 lang:[
  /* 1*/ "Спочатку є цікавість і кілька знайомих слів, які підморгують із пісень, серіалів або меню в кафе. Решта нагадує таємне послання, яке хтось забув перекласти. Але іскра вже є! Кілька слів сьогодні, ще кілька завтра, і ось ти вже впізнаєш щось без підказки.",
  /* 2*/ "Окремі слова вже знайомі, а в простих фразах починає проступати сенс. Ти слухаєш і раптом ловиш знайомий вислів. Стривай, я це зрозуміла? Без субтитрів? Без перекладача? Хтось має вручити тобі медаль, але поки підійде й задоволене «ага!».",
  /* 3*/ "Ти вже можеш складати прості речення, розповісти щось про себе й поставити запитання. Так, іноді дієслово стоїть не там, а потрібне слово зникає саме в ту мить, коли воно конче необхідне. Але думка доходить до адресата. Граматична поліція поки не приїхала, тож рухаємося далі.",
  /* 4*/ "Ти починаєш говорити сміливіше: можеш підтримати просту розмову, описати свій день і пояснити, чого хочеш. Не кожне речення ідеальне, зате його вже не потрібно спершу написати подумки, відредагувати й погодити з комісією. Мова потроху стає твоїм голосом, а не контрольним завданням.",
  /* 5*/ "Ти розширюєш словниковий запас, опановуєш нові конструкції й дедалі частіше обходишся без перекладача. Можеш висловити складнішу думку або пояснити забуте слово іншими словами. Це вже не випадкове чаклування над реченням. У тебе з’являються робочі заклинання, і деякі навіть спрацьовують із першої спроби.",
  /* 6*/ "У твоєму мовному арсеналі вже є сталі вирази, складніші конструкції та кілька способів сказати те саме. Ти читаєш тексти, розумієш більше на слух і не перетворюєш кожен абзац на археологічні розкопки зі словником. Щоправда, на полях гримуару досі трапляються нотатки на кшталт «ЧОМУ ТУТ САМЕ ЦЕЙ ПРИЙМЕННИК?!».",
  /* 7*/ "Мова звучить природніше. Ти краще вловлюєш інтонації, гумор і сталі вирази, а слова іноді приходять самі, без довгих пошуків у внутрішньому архіві. Найприємніше, коли розумієш жарт без перекладача. Найнеприємніше, коли смієшся на пів секунди пізніше за всіх, бо мозок таки вирішив перевірити переклад.",
  /* 8*/ "Ти відчуваєш відтінки значень, стиль і настрій. Можеш пожартувати, розповісти історію, підібрати влучне формулювання й помітити, коли буквальний переклад звучить так, ніби його створив дуже старанний робот після безсонної ночі. Тепер важливо не лише те, що ти говориш, а і як саме.",
  /* 9*/ "Ти впевнено користуєшся мовою в різних ситуаціях, обговорюєш складні теми й розумієш багато підтекстів. Незнайомий вислів уже не обов’язково зупиняє всю розмову: часто сенс можна вловити з контексту. Звісно, іноді трапляється слово, якого ти ніколи не бачила. Мова просто нагадує, що в неї ще є таємні кімнати.",
  /*10*/ "Мова стає повноцінним інструментом твого життя. Ти можеш навчатися, працювати, жартувати, читати улюблених авторів і знаходити людей, з якими вас об’єднує більше, ніж спільний словник. Це не означає знати абсолютно все: навіть рідною мовою часом доводиться гуглити правопис. Просто тепер мова не стоїть між тобою та світом. Вона допомагає тобі його відкривати."
 ],

  /* 8*/ "Ретривер щиро радіє людям і не приховує цього за обличчям людини, яка щойно згадала про неоплачену комуналку. Він сам пропонує зустрітися, підтримує контакт і дає іншим зрозуміти, що радий їх бачити. Поруч із ним простіше розслабитися. Тепло теж уміє бути дією.",

 joy:[

  /* 6*/ "Стривай, а хіба тут завжди було так гарно? Сонячний пил у кімнаті, сніг за вікном, улюблена мелодія в потрібний момент. Світ на секунду вмикає режим кіно, а ти випадково опиняєшся в головній ролі. Бюджет фільму невідомий, зате атмосфера чудова.",

/* Приводить будь-які збережені дані (старі, імпортовані, свіжі) до поточної моделі. */
function migrate(m,d){
  const t=today();
  const had=Object.fromEntries(SK.map(k=>[k,!!(d&&d.stats&&d.stats[k])]));
  SK.forEach(k=>{if(!m.stats[k])m.stats[k]={xp:0,lvl:1,total:0,streak:0,best:0,miss:0};
    if(m.stats[k].miss==null)m.stats[k].miss=0;if(m.stats[k].wbest==null)m.stats[k].wbest=0});
  if(!m.pen||typeof m.pen!=='object')m.pen={};
  if(!m.rhythm||typeof m.rhythm!=='object')m.rhythm={};
  if(!m.since||typeof m.since!=='object')m.since={};
  if(!m.gauge||typeof m.gauge!=='object')m.gauge={};
  SK.forEach(k=>{if(!m.rhythm[k])m.rhythm[k]=structuredClone(DEF_RHY[k]||{mode:'day'})});
  if(d&&(!d.v||d.v<4)){
    /* до v4 штрафи писались у журнал мінусом — переносимо їх в окрему відомість */
    Object.keys(m.log||{}).forEach(iso=>{const l=m.log[iso];
      Object.keys(l).forEach(k=>{if(l[k]<0){(m.pen[iso]=m.pen[iso]||{})[k]=-l[k];l[k]=0}})});
    const keys=Object.keys(m.log||{}).sort();
    m.startDay=m.startDay||[keys[0],m.lastDay].filter(Boolean).sort()[0]||null;
    m.penThrough=m.lastDay?shiftDay(m.lastDay,-1):null;
    /* новий ритм і нові стати стартують сьогодні — без штрафів заднім числом */
    SK.forEach(k=>{if(m.since[k])return;
      m.since[k]=(had[k]&&m.rhythm[k].mode==='day'&&m.startDay)?m.startDay:t});
    m.v=4}
  if(d&&(!d.v||d.v<5)){
    /* v4 рахувала тижневу норму в днях; тепер — у балах. Спілкування — без штрафів. */
    SK.forEach(k=>{const r=m.rhythm[k];
      if(r&&r.mode==='week'&&(+r.norm||0)<=7)m.rhythm[k]=k==='soc'?{mode:'free'}:{mode:'week',norm:80}});
    m.v=5}
  if(d&&(!d.v||d.v<7)){
    /* типу «разове» (видалявся після виконання) більше немає — усі завдання стають щоденними */
    (m.tasks||[]).forEach(t=>{if(t)t.once=false});
    if(d.v>=6)m.v=7}
  if(d&&(!d.v||d.v<6)){
    /* v6: нові 100 передбачень замінюють усі попередні */
    m.fortunes=FORTUNES.slice();m.fortSeen=[];
    if(m.fortText&&!FORTUNES.includes(m.fortText))m.fortText=FORTUNES[Math.floor(Math.random()*FORTUNES.length)];
    m.v=7}
  if(!m.rhyHist||typeof m.rhyHist!=='object')m.rhyHist={};
  SK.forEach(k=>{if(!Array.isArray(m.rhyHist[k])||!m.rhyHist[k].length)
    m.rhyHist[k]=[Object.assign({d:'2000-01-01'},normRule(m.rhythm[k]))]});
  if(!Array.isArray(m.penHist)||!m.penHist.length)m.penHist=[{d:'2000-01-01',p:Math.max(0,+m.penalty||0)}];
  if(!m.bon||typeof m.bon!=='object')m.bon={};
  if(!m.qDone||typeof m.qDone!=='object')m.qDone={};
  if(!['w','m','off'].includes(m.ghost))m.ghost='w';
  if(m.startDay)SK.forEach(k=>{if(!m.since[k])m.since[k]=had[k]?m.startDay:t});
  SK.forEach(k=>{if(normRule(m.rhythm[k]).mode==='state'&&!m.gauge[k]&&m.since[k])
    m.gauge[k]={d:m.since[k],v:50}});
  return m}

/* Повна підготовка даних: старі версії, міграція, значення за замовчуванням. */
function normalize(m,d){
  if(d&&(!d.v||d.v<2)){m.v=2;if(!d.penalty||d.penalty<=1)m.penalty=5;m.pace=1}
  if(d&&(!d.v||d.v<3)){m.v=3;SK.forEach(k=>{if(m.stats&&m.stats[k])m.stats[k].best=0})}
  if(!m.stats||typeof m.stats!=='object')m.stats={};
  if(!m.log||typeof m.log!=='object')m.log={};
  if(!Array.isArray(m.tasks))m.tasks=[];
  migrate(m,d);
  /* журнал дій: який саме таск і скільки разів за день. Раніше не вівся —
     починаємо з сьогоднішніх відміток. */
  if(!(d&&d.done&&typeof d.done==='object')){m.done={};
    const t=today();m.tasks.forEach(x=>{if(x&&x.doneOn===t&&x.count>0)(m.done[t]=m.done[t]||{})[x.id]=x.count})}
  if(!m.tnames||typeof m.tnames!=='object')m.tnames={};
  m.tasks.forEach(x=>{if(x&&x.id)m.tnames[x.id]=x.name});
  if(!m.doneSince)m.doneSince=Object.keys(m.done).sort()[0]||today();
  if(!m.ach)m.ach={};
  if(!Array.isArray(m.bonuses))m.bonuses=[];
  m.bonuses.forEach(b=>{if(b.repeat==null)b.repeat=false;if(b.count==null)b.count=0});
  if(!Array.isArray(m.quests)||!m.quests.length)m.quests=seedQuests();
  if(m.questMul==null)m.questMul=1.5;
  if(!m.questSrc)m.questSrc='mix';
  if(m.questBias==null)m.questBias=0;
  if(!Array.isArray(m.qEvt))m.qEvt=[];
  if(!Array.isArray(m.questSeen))m.questSeen=[];
  m.tasks.forEach(t=>{if(t.quest==null)t.quest=true;if(!Array.isArray(t.stats)||!t.stats.length)t.stats=['str'];
    t.stats=t.stats.filter(k=>SK.includes(k));if(!t.stats.length)t.stats=['str'];if(!DF[t.diff])t.diff='low'});
  if(m.autoAch==null)m.autoAch=1;
  if(!m.fortunes||!m.fortunes.length)m.fortunes=FORTUNES.slice();
  if(!m.fortSeen)m.fortSeen=[];
  return m}

/* Перед оновленням формату й після невдалого читання дані відкладаються сюди. */
function keepPrev(raw){try{localStorage.setItem(PREV_KEY,JSON.stringify({at:new Date().toISOString(),raw}))}catch(e){}}
function prevCopy(){try{const x=JSON.parse(localStorage.getItem(PREV_KEY)||'null');return x&&x.raw?x:null}catch(e){return null}}

function load(){
  let r=null;try{r=localStorage.getItem(KEY)}catch(e){}
  if(r){try{const d=JSON.parse(r),m=structuredClone(blank);
      if(!d||typeof d!=='object')throw new Error('bad');
      if((d.v||0)<blank.v)keepPrev(r);
      LAST_RAW=r;
      Object.assign(m,d);return normalize(m,d)}
    catch(e){keepPrev(r);LOAD_ERR=true}}
  const d=structuredClone(blank);d.tasks=seed();d.quests=seedQuests();return migrate(d,null)}
/* Якщо інше вікно (встановлений застосунок і вкладка в браузері) встигло щось записати,
   не затираємо його завдання, квести й досягнення, а доливаємо їх до своїх. */
function mergeLists(o){
  ['tasks','quests','bonuses'].forEach(f=>{if(!Array.isArray(o[f]))return;
    if(!Array.isArray(S[f]))S[f]=[];
    const have=new Set(S[f].map(x=>x&&x.id));
    o[f].forEach(x=>{if(x&&x.id&&!have.has(x.id)&&!GONE.has(x.id))S[f].push(x)})})}
function save(){
  try{
    let cur=null;try{cur=localStorage.getItem(KEY)}catch(e){}
    if(cur&&LAST_RAW&&cur!==LAST_RAW){try{mergeLists(JSON.parse(cur))}catch(e){}}
    const j=JSON.stringify(S);localStorage.setItem(KEY,j);LAST_RAW=j}
  catch(e){toast('Не вдалося зберегти')}}

/* підтягнути свіжі дані, якщо їх змінило інше вікно */
function syncFromStorage(){
  let r=null;try{r=localStorage.getItem(KEY)}catch(e){return false}
  if(!r||r===LAST_RAW)return false;
  try{JSON.parse(r)}catch(e){return false}
  if(veil.classList.contains('on')){veil.classList.remove('on');modal.innerHTML=''}
  S=load();applyTheme();buildTracks();RAD_PREV=null;
  return true}
function uid(){return Math.random().toString(36).slice(2,10)}
function today(){const d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}
function need(l){return Math.round((60+40*(l-1)+6*(l-1)*(l-1))*(S.pace||1))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2100)}

function award(keys,amount,date,quiet){
  const d=date||today();
  if(!quiet&&!S.log[d])S.log[d]=Object.fromEntries(SK.map(k=>[k,0]));
  keys.forEach(k=>{const st=S.stats[k];if(!st)return;
    st.xp+=amount;
    if(!quiet){if(amount>0)st.total+=amount;S.log[d][k]=(S.log[d][k]||0)+amount}
    while(st.xp>=need(st.lvl)){const was=rankOf(k,st.lvl);st.xp-=need(st.lvl);st.lvl++;
      LVQ.push({k,lvl:st.lvl,was,now:rankOf(k,st.lvl)})}
    while(st.xp<0){if(st.lvl>1){st.lvl--;st.xp+=need(st.lvl)}else{st.xp=0;break}}})}

/* ---------- серії, пораховані з журналу ---------- */
const STREAK_MIN=10;
function shiftDay(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10)}
function dayVal(iso,k){const l=S.log[iso];return l?(l[k]||0):0}
function qual(iso,k,thr){return k==='*'?dailyKeys().every(x=>dayVal(iso,x)>=thr):dayVal(iso,k)>=thr}
function streakOf(k,thr){
  let d=today(),n=0,g=0;
  if(!qual(d,k,thr))d=shiftDay(d,-1);
  while(qual(d,k,thr)&&g++<500){n++;d=shiftDay(d,-1)}
  return n}
function maxRun(k,thr){
  const keys=Object.keys(S.log).sort();let best=0,run=0,prev=null;
  for(const d of keys){
    if(prev!==null&&shiftDay(prev,1)!==d)run=0;
    run=qual(d,k,thr)?run+1:0;
    if(run>best)best=run;prev=d}
  return best}
/* ---------- ритм і штрафи ----------
   Журнал S.log містить лише зароблене. Штрафи живуть у S.pen і перераховуються
   за останній тиждень, тож ретро-відмітка сама повертає або донараховує різницю.
   Ритм і розмір штрафу мають історію: зміна діє з дня, коли її зробили. */
function normRule(r){r=r||{};const mode=['day','week','state','free'].includes(r.mode)?r.mode:'day';
  return{mode,norm:Math.min(2000,Math.max(5,Math.round(+r.norm||80))),
    drain:Math.min(50,Math.max(1,Math.round(+r.drain||10))),
    gain:Math.min(5,Math.max(0.1,Math.round((+r.gain||1)*100)/100))}}
function rhyHist(k){const h=(S.rhyHist||{})[k];
  return h&&h.length?h:[Object.assign({d:'2000-01-01'},normRule((S.rhythm||{})[k]||DEF_RHY[k]))]}
function rhyAt(k,iso){const h=rhyHist(k);let r=h[0];for(const e of h){if(e.d<=iso)r=e;else break}return normRule(r)}
function rhy(k){const h=rhyHist(k);return normRule(h[h.length-1])}
function penAt(iso){const h=(S.penHist&&S.penHist.length)?S.penHist:[{d:'2000-01-01',p:+S.penalty||0}];
  let p=h[0].p;for(const e of h){if(e.d<=iso)p=e.p;else break}return Math.max(0,+p||0)}
function setPenalty(v){v=Math.max(0,Math.min(50,Math.round(+v||0)));
  if(v===penAt(today())){S.penalty=v;return false}
  const t=today();S.penHist=(S.penHist||[]).filter(e=>e.d<t);S.penHist.push({d:t,p:v});S.penalty=v;return true}

function earned(iso,k){return Math.max(0,dayVal(iso,k))}
function penOf(iso,k){const p=(S.pen||{})[iso];return p?(p[k]||0):0}
function penDay(iso){const p=(S.pen||{})[iso];return p?SK.reduce((a,k)=>a+(p[k]||0),0):0}
function bonOf(iso,k){const p=(S.bon||{})[iso];return p?(p[k]||0):0}
function dowMon(iso){return(new Date(iso+'T12:00:00').getDay()+6)%7}
function weekStart(iso){return shiftDay(iso,-dowMon(iso))}
function weekEnd(ws){return shiftDay(ws,6)}
function weekPts(ws,k){let n=0;const t=today();
  for(let i=0;i<7;i++){const d=shiftDay(ws,i);if(d>t)break;n+=earned(d,k)}return n}
function weekRule(ws,k){const e=weekEnd(ws),t=today();return rhyAt(k,e<t?e:t)}
function weekMet(ws,k){const r=weekRule(ws,k);return r.mode==='week'&&weekPts(ws,k)>=r.norm}
function noPen(k){const m=rhy(k).mode;return m==='week'||m==='free'}
function dailyKeys(){return SK.filter(k=>!noPen(k))}

/* бонусні бали (нагороди, мої досягнення) — поза денним журналом, але з датою */
function awardBonus(keys,amount){
  award(keys,amount,null,true);
  const d=today();if(!S.bon)S.bon={};if(!S.bon[d])S.bon[d]={};
  keys.forEach(k=>{S.bon[d][k]=(S.bon[d][k]||0)+amount})}

/* полоска: значення на початку дня cp.d → щодня + зароблене, − злив того дня */
function gaugeSeries(k){
  const t=today(),cp=(S.gauge||{})[k]||{d:(S.since||{})[k]||t,v:50};
  let v=Math.min(100,Math.max(0,+cp.v||0)),d=cp.d,g=0;const end={};
  while(d<=t&&g++<900){const r=rhyAt(k,d);v=Math.min(100,v+earned(d,k)*r.gain);
    if(d<t){v=Math.max(0,v-r.drain);end[d]=v}
    d=shiftDay(d,1)}
  return{end,now:Math.round(v)}}
function gaugeNow(k){return gaugeSeries(k).now}

function owed(iso,k,ctx){
  const since=(S.since||{})[k],P=penAt(iso);
  if(!since||iso<since||!P)return 0;
  const r=rhyAt(k,iso);
  if(r.mode==='free')return 0;
  if(r.mode==='week'){
    if(dowMon(iso)!==6)return 0;
    const ws=shiftDay(iso,-6);if(ws<since)return 0;
    const short=r.norm-weekPts(ws,k);if(short<=0)return 0;
    let run=1;
    for(let w=1;w<4;w++){const wsx=shiftDay(ws,-7*w);if(wsx<since)break;
      const rr=rhyAt(k,weekEnd(wsx));if(rr.mode!=='week'||weekPts(wsx,k)>=rr.norm)break;run++}
    return P*Math.ceil(short/10)*Math.min(run,4)}
  if(r.mode==='state'){
    const ser=ctx[k]||(ctx[k]=gaugeSeries(k));
    if(!(iso in ser.end)||ser.end[iso]>0)return 0;
    let run=0;
    for(let i=0;i<4;i++){const d=shiftDay(iso,-i);
      if(d<since||!(d in ser.end)||ser.end[d]>0)break;run++}
    return P*Math.min(run,4)}
  if(earned(iso,k)>0)return 0;
  let run=0;
  for(let i=0;i<4;i++){const d=shiftDay(iso,-i);if(d<since||earned(d,k)>0)break;run++}
  return P*Math.min(run,4)}

function reconcile(){
  const t=today(),y=shiftDay(t,-1);
  if(!S.startDay)return{lost:0,back:0};
  if(!S.pen)S.pen={};
  let lo=S.penThrough?shiftDay(S.penThrough,1):S.startDay;
  const win=shiftDay(t,-8);if(win<lo)lo=win;
  if(lo<S.startDay)lo=S.startDay;
  const far=shiftDay(t,-400);if(lo<far)lo=far;
  const ctx={};let lost=0,back=0,d=lo,g=0;
  while(d<=y&&g++<420){
    SK.forEach(k=>{const since=S.since[k];if(!since||d<since)return;
      const o=owed(d,k,ctx),a=penOf(d,k),diff=o-a;
      if(!diff)return;
      /* повернення штрафу не вітає вдруге з рівнем, який уже був */
      const n0=LVQ.length;award([k],-diff,null,true);if(diff<0)LVQ.length=n0;
      if(!S.pen[d])S.pen[d]={};
      if(o)S.pen[d][k]=o;else delete S.pen[d][k];
      if(diff>0)lost+=diff;else back-=diff});
    if(S.pen[d]&&!Object.keys(S.pen[d]).length)delete S.pen[d];
    d=shiftDay(d,1)}
  if(!S.penThrough||S.penThrough<y)S.penThrough=y;
  return{lost,back}}

/* тримаємо точку відліку полоски за ~2 тижні, щоб перерахунок був стабільним */
function advanceGauges(){
  const target=shiftDay(today(),-14);
  SK.forEach(k=>{if(rhy(k).mode!=='state')return;const cp=S.gauge[k];if(!cp||cp.d>=target)return;
    let v=cp.v,d=cp.d,g=0;
    while(d<target&&g++<900){const r=rhyAt(k,d);v=Math.max(0,Math.min(100,v+earned(d,k)*r.gain)-r.drain);d=shiftDay(d,1)}
    S.gauge[k]={d:target,v}})}

/* Нове правило діє з сьогодні. Зміна режиму — новий відлік для стати;
   зміна лише норми чи зливу — просто нове значення далі, минуле не чіпається. */
function setRhythm(k,nr){
  const old=rhy(k),fresh=normRule(Object.assign({},old,nr));
  if(old.mode===fresh.mode&&(fresh.mode!=='week'||old.norm===fresh.norm)
    &&(fresh.mode!=='state'||(old.drain===fresh.drain&&old.gain===fresh.gain)))return false;
  const t=today();
  if(old.mode!==fresh.mode){
    let gv=50;
    if(old.mode==='state')gv=Math.max(0,gaugeSeries(k).now-earned(t,k));
    S.since[k]=t;
    if(fresh.mode==='state')S.gauge[k]={d:t,v:gv};else delete S.gauge[k]}
  if(!S.rhyHist)S.rhyHist={};
  const h=rhyHist(k).filter(e=>e.d<t);h.push(Object.assign({d:t},fresh));
  S.rhyHist[k]=h;S.rhythm[k]=fresh;
  return true}

/* тижнева серія — скільки тижнів поспіль виконано норму */
function weekStreak(k){
  let ws=weekStart(today()),n=0,g=0;
  if(!weekMet(ws,k))ws=shiftDay(ws,-7);
  while(weekMet(ws,k)&&g++<300){n++;ws=shiftDay(ws,-7)}
  return n}
function weekBest(k){
  const keys=Object.keys(S.log).sort();if(!keys.length)return 0;
  let ws=weekStart(keys[0]),end=weekStart(today()),best=0,run=0,g=0;
  while(ws<=end&&g++<400){if(weekMet(ws,k)){run++;if(run>best)best=run}else if(ws<end)run=0;ws=shiftDay(ws,7)}
  return best}

/* ---------- відтворення минулого стану (для тіні на мапі й підсумку) ---------- */
function totalXp(k){const st=S.stats[k];let v=st.xp;for(let l=1;l<st.lvl;l++)v+=need(l);return v}
function lvlFromXp(v){let l=1;v=Math.max(0,v);while(l<60&&v>=need(l)){v-=need(l);l++}return l+v/need(l)}
function xpAt(k,iso){let v=totalXp(k),d=shiftDay(iso,1),g=0;const t=today();
  while(d<=t&&g++<420){v-=earned(d,k)-penOf(d,k)+bonOf(d,k);d=shiftDay(d,1)}
  return Math.max(0,v)}
function lvlNow(k){const st=S.stats[k];return st.lvl+st.xp/need(st.lvl)}

function retroLabel(iso,i){
  if(i===1)return 'вчора';
  if(i===2)return 'позавчора';
  return WD[new Date(iso+'T12:00:00').getDay()]+' '+iso.slice(8)+'.'+iso.slice(5,7)}
function retroAward(keys,xp,iso){
  award(keys,xp,iso);
  return reconcile()}
function syncStreaks(){
  SK.forEach(k=>{const st=S.stats[k];
    if(rhy(k).mode==='week'){st.streak=weekStreak(k);
      const b=weekBest(k);if(b>(st.wbest||0))st.wbest=b;return}
    st.streak=streakOf(k,STREAK_MIN);
    const b=maxRun(k,STREAK_MIN);if(b>(st.best||0))st.best=b})}

/* ---------- автоматичні досягнення ---------- */
let TRACKS=[];
function buildTracks(){
  TRACKS=[];
  STATS.forEach(s=>{
    if(rhy(s.k).mode==='week'){
      TRACKS.push({id:'w_'+s.k,kind:'wstreak',stat:s.k,emo:s.emo,ck:s.k,
        name:'Тижнева норма · '+s.name,tiers:[2,4,8,16,26],xp:[20,40,80,150,300],reward:[s.k]});
      return}
    TRACKS.push({id:'s10_'+s.k,kind:'streak',stat:s.k,thr:10,emo:s.emo,ck:s.k,
      name:'10+ балів щодня · '+s.name,tiers:[7,14,30,60,100],xp:[20,40,80,150,300],reward:[s.k]});
    TRACKS.push({id:'s20_'+s.k,kind:'streak',stat:s.k,thr:20,emo:s.emo,ck:s.k,
      name:'20+ балів щодня · '+s.name,tiers:[5,14,30,60],xp:[30,70,140,260],reward:[s.k]})});
  const dk=dailyKeys();
  TRACKS.push({id:'a10',kind:'streak',stat:'*',thr:10,emo:'🌟',
    name:'10+ по всіх щоденних',tiers:[3,7,14,30,60],xp:[10,20,40,80,150],reward:dk.slice()});
  TRACKS.push({id:'a20',kind:'streak',stat:'*',thr:20,emo:'💫',
    name:'20+ по всіх щоденних',tiers:[3,7,14,30],xp:[15,30,60,120],reward:dk.slice()});
  TRACKS.push({id:'lvl',kind:'level',emo:'🏔️',
    name:'Усі стати рівня',tiers:[2,3,5,7,10],xp:[20,40,80,150,300],reward:SK.slice()});
  TRACKS.push({id:'tot',kind:'total',emo:'💎',
    name:'Балів усього',tiers:[500,1500,4000,10000,25000],xp:[20,50,120,250,500],reward:SK.slice()})}
buildTracks();

function trackCur(tr){
  if(tr.kind==='wstreak')return weekStreak(tr.stat);
  if(tr.kind==='streak')return streakOf(tr.stat,tr.thr);
  if(tr.kind==='level')return Math.min(...SK.map(k=>S.stats[k].lvl));
  return SK.reduce((a,k)=>a+(S.stats[k].total||0),0)}
function tierName(tr,t){
  if(tr.kind==='wstreak')return tr.name+' — '+t+' тиж. поспіль';
  if(tr.kind==='streak')return tr.name+' — '+t+' дн.';
  if(tr.kind==='level')return 'Усі стати рівня '+t;
  return t+' балів усього'}
function achTotal(){return TRACKS.reduce((a,t)=>a+t.tiers.length,0)}
function achDone(){const a=S.ach||{};
  return TRACKS.reduce((n,tr)=>n+tr.tiers.filter(t=>a[tr.id+'@'+t]).length,0)}

function backfillAch(){
  if(S.achInit)return;
  S.ach=S.ach||{};
  TRACKS.forEach(tr=>{const c=trackCur(tr);
    tr.tiers.forEach(t=>{if(c>=t)S.ach[tr.id+'@'+t]=today()})});
  S.achInit=1;save()}

function checkAch(){
  if(!S.ach)S.ach={};
  let guard=0,got=[];
  while(guard++<5){
    let any=false;
    TRACKS.forEach(tr=>{const c=trackCur(tr);
      tr.tiers.forEach((t,i)=>{const key=tr.id+'@'+t;
        if(c>=t&&!S.ach[key]){S.ach[key]=today();
          awardBonus(tr.reward,tr.xp[i]);
          got.push({tr,tier:t,xp:tr.xp[i],n:tr.reward.length});any=true}})});
    if(!any)break}
  if(got.length){AQ.push(...got);save()}}

/* Скидає тільки прогрес. Завдання, мої досягнення, налаштування й теми лишаються. */
function resetProgress(){
  SK.forEach(k=>{S.stats[k]={xp:0,lvl:1,total:0,streak:0,best:0,wbest:0,miss:0}});
  S.log={};S.ach={};S.achInit=0;S.lastDay=null;S.done={};S.doneSince=today();
  S.pen={};S.bon={};S.qDone={};S.recapPending=null;S.recapSeen=weekStart(today());
  S.startDay=today();S.penThrough=shiftDay(today(),-1);S.since={};S.gauge={};
  SK.forEach(k=>S.since[k]=today());migrate(S,null);
  S.fortDay=null;S.fortText='';S.fortSeen=[];
  (S.tasks||[]).forEach(t=>{t.doneOn=null;t.count=0});
  (S.bonuses||[]).forEach(b=>{b.doneOn=null;b.count=0});
  S.questDay=null;S.questRef=null;S.questProg=0;S.questPaid=0;S.questSeen=[];
  S.questStart=0;S.qEvt=[];
  LVQ.length=0;AQ.length=0;
  save();backfillAch();AQ.length=0;save()}

/* дрібний журнал виконань за сьогодні — потрібен квестам-наборам */
function qEvtAdd(t){S.qEvt=[...(S.qEvt||[]),{ts:Date.now(),id:t.id,k:(t.stats||[]).slice()}].slice(-200)}
function qEvtDel(t){const a=S.qEvt||[];
  for(let i=a.length-1;i>=0;i--)if(a[i].id===t.id){a.splice(i,1);return}}

function questWindowEnd(){
  const r=S.questRef;
  if(!r||!r.win||!S.questStart)return 0;
  return S.questStart+r.win*60000}
function questWindowLeft(){
  const e=questWindowEnd();return e?Math.max(0,Math.ceil((e-Date.now())/60000)):0}

function questCollected(){
  const r=S.questRef;if(!r||r.kind!=='collect')return [];
  const from=r.win?(S.questStart||0):0,to=r.win?questWindowEnd():Infinity;
  const seen=new Set(),out=[];
  (S.qEvt||[]).forEach(e=>{
    if(r.win&&(e.ts<from||e.ts>to))return;
    if(!(e.k||[]).some(k=>(r.stats||[]).includes(k)))return;
    if(seen.has(e.id))return;seen.add(e.id);out.push(e)});
  return out}

function questMul(){const m=+S.questMul;return m>0?m:1}
function questTotal(r){return r?Math.ceil(DF[r.diff].xp*questMul()):0}
function questTask(r){return r&&r.kind==='link'?(S.tasks||[]).find(t=>t.id===r.taskId):null}
function questBonus(r){const t=questTask(r);if(!t)return 0;
  return Math.max(0,questTotal(r)-DF[t.diff].xp)}
function questEligible(t){return t.quest!==false&&!t.doneOn}

function questCandidates(){
  const mine=[],auto=[];
  (S.quests||[]).forEach(q=>{
    if(q.taskId){const t=(S.tasks||[]).find(x=>x.id===q.taskId);
      if(!t||!questEligible(t))return;
      mine.push({key:'q:'+q.id,kind:'link',qid:q.id,taskId:t.id,emo:q.emo||'⭐',
        name:q.name||t.name,desc:q.desc||'',stats:t.stats.slice(),diff:q.diff||t.diff,goal:1})}
    else mine.push({key:'q:'+q.id,kind:q.mode==='collect'?'collect':'own',qid:q.id,taskId:null,
      emo:q.emo||'⭐',name:q.name,desc:q.desc||'',stats:(q.stats||[]).slice(),diff:q.diff,
      goal:Math.max(1,q.goal||1),win:q.mode==='collect'?Math.max(0,q.win||0):0})});
  (S.tasks||[]).forEach(t=>{if(!questEligible(t))return;
    auto.push({key:'t:'+t.id,kind:'link',qid:null,taskId:t.id,emo:'📋',
      name:t.name,desc:'',stats:t.stats.slice(),diff:t.diff,goal:1})});
  return {mine,auto}}

/* Чим менше бали за останні 7 днів — тим більша вага. Діапазон 1..3. */
function statWeights(){
  const raw={},days=[];
  for(let i=0;i<7;i++)days.push(shiftDay(today(),-i));
  SK.forEach(k=>{let v=0;days.forEach(d=>{const x=(S.log[d]||{})[k]||0;if(x>0)v+=x});raw[k]=v});
  const vals=SK.map(k=>raw[k]),mx=Math.max(...vals);
  const w={};SK.forEach(k=>{w[k]=mx>0?1+2*(1-raw[k]/mx):2});
  return w}

function questWeight(x,w){
  const ks=(x.stats||[]).filter(k=>w[k]!=null);
  if(!ks.length)return 1;
  return ks.reduce((a,k)=>a+w[k],0)/ks.length}

function weightedPick(pool){
  if(!S.questBias)return pool[Math.floor(Math.random()*pool.length)];
  const w=statWeights(),ws=pool.map(x=>questWeight(x,w));
  let sum=ws.reduce((a,b)=>a+b,0);
  if(!(sum>0))return pool[Math.floor(Math.random()*pool.length)];
  let r=Math.random()*sum;
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}
  return pool[pool.length-1]}

function pickQuest(force){
  if(!force&&S.questDay===today()&&S.questRef)return false;
  const {mine,auto}=questCandidates();
  const src=S.questSrc||'mix';
  let bag;
  if(src==='mine')bag=mine.length?mine:auto;
  else if(src==='tasks')bag=auto.length?auto:mine;
  else{const wantMine=Math.random()<0.6;
    bag=(wantMine?mine:auto);if(!bag.length)bag=wantMine?auto:mine}
  if(!bag||!bag.length){S.questDay=today();S.questRef=null;S.questProg=0;S.questPaid=0;S.questStart=0;
    save();return false}
  const seen=(S.questSeen||[]).slice(-Math.max(4,Math.floor(bag.length*0.7)));
  let pool=bag.filter(x=>!seen.includes(x.key));
  if(!pool.length)pool=bag;
  const r=weightedPick(pool);
  S.questDay=today();S.questRef=r;S.questProg=0;S.questPaid=0;S.questStart=0;
  S.questSeen=[...(S.questSeen||[]),r.key].slice(-60);
  save();return true}

/* нараховує/знімає різницю так, щоб виплачено було рівно stepPaid */
function markQuest(done){if(!S.qDone)S.qDone={};const d=today();if(done)S.qDone[d]=1;else delete S.qDone[d]}
function questPayTo(prog){
  const r=S.questRef;if(!r)return;
  const total=questTotal(r),goal=Math.max(1,r.goal||1);
  const want=Math.round(total*Math.min(Math.max(prog,0),goal)/goal);
  const diff=want-(S.questPaid||0);
  if(diff)award(r.stats,diff);
  S.questProg=prog;S.questPaid=want;markQuest(prog>=goal)}

function questStep(dir){
  const r=S.questRef;if(!r||r.kind!=='own')return;
  const goal=Math.max(1,r.goal||1),n=Math.min(goal,Math.max(0,(S.questProg||0)+dir));
  if(n===(S.questProg||0))return;
  const before=S.questPaid||0;
  questPayTo(n);save();render();
  const d=(S.questPaid||0)-before;
  if(d>0)toast('+'+d+' · квест'+(goal>1?' '+n+' з '+goal:''));
  else if(d<0)toast('Знято '+(-d))}

function questSyncCollect(){
  const r=S.questRef;if(!r||r.kind!=='collect')return;
  const goal=Math.max(1,r.goal||1),n=questCollected().length;
  const full=n>=goal,want=full?questTotal(r):0;
  if(want!==(S.questPaid||0)){
    const diff=want-(S.questPaid||0);
    award(r.stats,diff);
    S.questPaid=want;
    if(diff>0)setTimeout(()=>toast('Квест зібрано · +'+diff),260)}
  S.questProg=Math.min(n,goal);markQuest(full)}

/* бонус за квест, привʼязаний до завдання */
function questSyncLink(){
  const r=S.questRef;if(!r||r.kind!=='link')return;
  const t=questTask(r);
  const on=!!(t&&t.doneOn);
  if(on&&!(S.questProg>0)){const b=questBonus(r);if(b)award(t.stats,b);
    S.questProg=1;S.questPaid=b;markQuest(true);if(b)setTimeout(()=>toast('+'+b+' бонус за квест дня'),260)}
  else if(!on&&S.questProg>0){if(S.questPaid)award(r.stats,-S.questPaid);
    S.questProg=0;S.questPaid=0;markQuest(false)}}

  h+='<div class="qm">';
  (r.stats||[]).forEach(k=>{const st=ST[k];if(!st)return;

  h+='</div></div>';
  if(r.kind==='own'){
    h+='<div class="qrow">';
    if(goal>1){
      if(prog)h+='<button class="mn" id="qMinus" title="Крок назад">−</button>';
      h+='<button class="cnt'+(prog?' has':'')+'" id="qPlus">'+(prog?prog+'/'+goal:'+')+'</button>'}
    else h+='<button class="check" id="qPlus">✓</button>';
    h+='</div>'}
  else h+='<div class="qx">'+(S.questProg>0?'✓ +'+(S.questPaid||0):'+'+questBonus(r))+'</div>';

function rollover(){
  const t=today();
  if(!S.startDay){S.startDay=t;SK.forEach(k=>{if(!S.since[k])S.since[k]=t});migrate(S,null)}
  const newDay=!!S.lastDay&&S.lastDay!==t;
  if(newDay&&weekStart(t)!==weekStart(S.lastDay)){
    const ws=shiftDay(weekStart(t),-7);
    if(S.recapSeen!==ws&&weekHasData(ws))S.recapPending=ws}
  if(newDay){
    S.tasks.forEach(x=>{x.doneOn=null;x.count=0});
    S.qEvt=[];S.questStart=0}
  const r=reconcile();
  advanceGauges();
  const cut=shiftDay(t,-400);
  ['log','pen','bon','qDone','done'].forEach(f=>Object.keys(S[f]||{}).forEach(k=>{if(k<cut)delete S[f][k]}));
  S.lastDay=t;save();
  const msg=[];
  if(newDay&&r.lost)msg.push('штраф −'+r.lost+' балів за пропущене');
  if(msg.length)setTimeout(()=>toast(msg.join(' · ')),800)}

/* ---------- тижневий підсумок ---------- */
const WD=['нд','пн','вт','ср','чт','пт','сб'];
function weekData(){
  const days=[],prev=[];
  for(let i=6;i>=0;i--)days.push(shiftDay(today(),-i));
  for(let i=13;i>=7;i--)prev.push(shiftDay(today(),-i));
  const sum=a=>a.reduce((x,d)=>x+SK.reduce((y,k)=>y+earned(d,k),0)-penDay(d),0);
  const byStat={};SK.forEach(k=>byStat[k]=days.reduce((a,d)=>a+dayVal(d,k),0));
  return{days,total:sum(days),prev:sum(prev),byStat,
    active:days.filter(d=>SK.some(k=>dayVal(d,k)>0)).length,
    pen:days.reduce((a,d)=>a+penDay(d),0),
    full:days.filter(d=>qual(d,'*',STREAK_MIN)).length}}

function renderWeek(){
  const c=document.getElementById('weekCard'),w=weekData();
  const dl=w.total-w.prev;
  const peak=Math.max(20,...w.days.map(d=>SK.reduce((a,k)=>a+Math.max(0,dayVal(d,k)),0)));
  let h='<div class="wk-top"><span class="wk-t">Тиждень</span>';
  if(w.prev||w.total)h+='<span class="wk-d" style="color:'+(dl>0?TV['--good']:(dl<0?TV['--bad']:TV['--dim']))+'">'
    +(dl?((dl>0?'+':'')+dl+' до минулого'):'як минулого тижня')+'</span>';
  h+='<span class="wk-sum">'+(w.total>0?'+':'')+w.total+'</span></div>';
  const grow=!WK_GROWN&&mapOn()&&!REDUCED();if(mapOn())WK_GROWN=true;
  h+='<div class="wk-bars'+(grow?' grow':'')+'">';
  w.days.forEach((d,i)=>{h+='<div class="wk-col"'+(grow?' style="animation-delay:'+(i*55)+'ms"':'')+'>';
    const any=SK.some(k=>dayVal(d,k)>0);
    if(!any)h+='<i style="height:3px;background:'+TV['--hb-empty']+'"></i>';
    else SK.forEach(k=>{const v=Math.max(0,dayVal(d,k));if(!v)return;
      h+='<i style="height:'+Math.max(2,Math.round(v/peak*36))+'px;background:'+ST[k].color+'"></i>'});
    h+='</div>'});
  h+='</div><div class="wk-days">';
  w.days.forEach(d=>{h+='<span>'+WD[new Date(d+'T12:00:00').getDay()]+'</span>'});
  h+='</div>';
  const ranked=SK.slice().sort((a,b)=>w.byStat[b]-w.byStat[a]);
  const top=ranked[0],low=ranked[ranked.length-1];
  if(w.total>0){
    h+='<div class="wk-l">Найбільше — <b>'+ST[top].emo+' '+ST[top].name+'</b> ('+w.byStat[top]+')'
      +', найменше — <b>'+ST[low].emo+' '+ST[low].name+'</b> ('+w.byStat[low]+').</div>';
    h+='<div class="wk-l">Днів із прогресом: <b>'+w.active+' з 7</b> · повних днів (10+ по всіх щоденних): <b>'+w.full+'</b>'
      +(w.pen?' · штрафи: <b style="color:'+TV['--bad']+'">−'+w.pen+'</b>':'')+'.</div>';
  } else h+='<div class="wk-l">За сім днів поки порожньо. Почни з одного завдання.</div>';
  c.innerHTML=h}

function bonusXp(b){return Math.max(0,Math.round(+b.xp||0))}
function bonusKeys(b){return SK.filter(k=>(b.stats||[]).includes(k))}
function bonusCount(b){return b.repeat?Math.max(0,b.count||0):(b.doneOn?1:0)}

      +'<div class="t2">'+esc(t2)+'</div></div>';
    x+='<div class="rw" style="color:'+(lit?col:TV['--dim'])+'">+'+bonusXp(b)+'</div>';
    if(b.repeat){
      if(n)x+='<button class="mk minus" data-act="minus">−</button>';
      x+='<button class="mk plus" data-act="tog" style="border-color:'+col+';color:'+col+'">+</button>'}
    else x+='<button class="mk'+(b.doneOn?' on':'')+'" data-act="tog"'
      +(b.doneOn?' style="background:'+col+';border-color:'+col+'"':'')+'>✓</button>';
    return x+'</div>'};
  const reps=list.filter(b=>b.repeat);
  const todo=list.filter(b=>!b.repeat&&!b.doneOn);
  const done=list.filter(b=>!b.repeat&&b.doneOn)
    .sort((a,b)=>a.doneOn<b.doneOn?1:a.doneOn>b.doneOn?-1:0);
  let h='';
  if(reps.length){h+='<div class="achsub">Повторювані</div>';reps.forEach(b=>h+=row(b))}
  if(todo.length){h+='<div class="achsub">Ще попереду</div>';todo.forEach(b=>h+=row(b))}
  if(done.length){h+='<div class="achsub">Здобуто</div>';done.forEach(b=>h+=row(b))}
  box.innerHTML=h;
  box.querySelectorAll('.ach.mine').forEach(el=>{
    const id=el.dataset.id;
    el.querySelector('[data-act=tog]').onclick=e=>{e.stopPropagation();
      const b=(S.bonuses||[]).find(x=>x.id===id),k0=b&&bonusKeys(b)[0];
      if(b&&(b.repeat||!b.doneOn))floatPts(e.currentTarget,'+'+bonusXp(b),k0?ST[k0].color:TV['--accent']);
      toggleBonus(id,1)};
    const mn=el.querySelector('[data-act=minus]');
    if(mn)mn.onclick=e=>{e.stopPropagation();toggleBonus(id,-1)};
    el.querySelector('[data-act=edit]').onclick=()=>openBonus((S.bonuses||[]).find(x=>x.id===id))})}

  h+='</div><input type="text" id="bEmoIn" maxlength="4" value="'+esc(b.emo||'🏅')

    +'" style="'+(b.stats.includes(x.k)?'color:'+x.color+';border-color:'+x.line+';background:'+x.soft:'')

  h+='<p class="note">Повторюване не зникає зі списку — рахує, скільки разів ти його зробила, і щоразу дає бали.</p></div>';
  h+='<div class="f"><label>Скільки це вартує</label><input type="number" id="bXp" min="0" max="5000" value="'
    +bonusXp(b)+'">';
  h+='<p class="note">Кожна вибрана стата отримує ці бали повністю. Для орієнтиру: рівень '
    +'коштує '+need(1)+'–'+need(9)+' балів, найскладніше завдання дає '+DIFF[DIFF.length-1].xp+'.</p></div>';
  h+='<div class="mrow">'+(isNew?'':'<button class="btn del" id="bDel">✕</button>')
    +'<button class="btn" id="bCancel">Назад</button><button class="btn pri" id="bSave">Зберегти</button></div>';
  open(h);

  const emoIn=modal.querySelector('#bEmoIn');
  modal.querySelectorAll('#bEmo .mchip').forEach(c=>c.onclick=()=>{
    dr.emo=c.dataset.e;emoIn.value=dr.emo;
    modal.querySelectorAll('#bEmo .mchip').forEach(x=>x.classList.toggle('on',x===c))});
  emoIn.oninput=()=>{dr.emo=emoIn.value.trim()||'🏅';
    modal.querySelectorAll('#bEmo .mchip').forEach(x=>x.classList.toggle('on',x.dataset.e===dr.emo))};
  modal.querySelectorAll('#bStats .mchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,x=ST[k],i=dr.stats.indexOf(k);
    if(i>-1){if(dr.stats.length===1)return;dr.stats.splice(i,1);c.classList.remove('on');c.style.cssText=''}
    else{dr.stats.push(k);c.classList.add('on');c.style.color=x.color;c.style.borderColor=x.line;c.style.background=x.soft}});
  modal.querySelectorAll('#bType .mchip').forEach(c=>c.onclick=()=>{dr.repeat=c.dataset.v==='1';
    modal.querySelectorAll('#bType .mchip').forEach(x=>x.classList.toggle('on',x===c))});
  modal.querySelector('#bCancel').onclick=close;
  const del=modal.querySelector('#bDel');
  if(del)del.onclick=()=>{if(!confirm('Видалити досягнення «'+b.name+'»?'))return;
    GONE.add(b.id);
    const n=bonusCount(b);
    if(n)awardBonus(bonusKeys(b),-bonusXp(b)*n);
    S.bonuses=(S.bonuses||[]).filter(x=>x.id!==b.id);save();render();close();toast('Видалено')};
  modal.querySelector('#bSave').onclick=()=>{
    const n=modal.querySelector('#bName').value.trim();if(!n){toast('Впиши назву');return}
    const nx=Math.max(0,Math.round(+modal.querySelector('#bXp').value||0));
    const nk=SK.filter(k=>dr.stats.includes(k));
    const had=bonusCount(b);
    if(had){/* уже відмічене — знімаємо старе нарахування й ставимо нове */
      awardBonus(bonusKeys(b),-bonusXp(b)*had);
      const keep=dr.repeat?had:1;
      awardBonus(nk,nx*keep)}
    b.name=n;b.emo=dr.emo;b.stats=nk;b.xp=nx;b.repeat=dr.repeat;
    if(dr.repeat)b.count=had||0;
    else{b.count=0;if(had&&!b.doneOn)b.doneOn=today()}
    if(isNew)S.bonuses.unshift(b);
    save();render();close()}}

function renderAch(){
  const sc=document.getElementById('strkCard');
  let h='<div class="strk">';
  STATS.forEach(s=>{const st=S.stats[s.k],r=rhy(s.k);
    if(r.mode==='week'){const wa=weekPts(weekStart(today()),s.k),ws=weekStreak(s.k),ok=wa>=r.norm;
      h+='<div class="sr"><span>'+s.emo+'</span><span class="nm">'+s.name+'</span>'
        +'<span class="p" style="color:'+(ok?s.color:TV['--dim'])+';background:'+(ok?s.soft:'transparent')+'">тиждень · '+wa+'/'+r.norm+'</span>'
        +'<span class="p" style="color:'+(ws?s.color:TV['--dim'])+';background:'+(ws?s.soft:'transparent')+'">поспіль · '+ws+'</span>'
        +'<span class="rec">рек. '+(st.wbest||0)+'</span></div>';return}
    const a=streakOf(s.k,10),b=streakOf(s.k,20);
    h+='<div class="sr"><span>'+s.emo+'</span><span class="nm">'+s.name+'</span>'
      +'<span class="p" style="color:'+(a?s.color:TV['--dim'])+';background:'+(a?s.soft:'transparent')+'">10+ · '+a+'</span>'
      +'<span class="p" style="color:'+(b?s.color:TV['--dim'])+';background:'+(b?s.soft:'transparent')+'">20+ · '+b+'</span>'
      +'<span class="rec">рек. '+(st.best||0)+'</span></div>'});
  const a10=streakOf('*',10),a20=streakOf('*',20);
  h+='<div class="sr" style="border-top:2px dashed var(--edge);padding-top:7px;margin-top:2px">'
    +'<span>🌟</span><span class="nm">Усі щоденні одразу</span>'
    +'<span class="p" style="color:'+(a10?TV['--accent']:TV['--dim'])+'">10+ · '+a10+'</span>'
    +'<span class="p" style="color:'+(a20?TV['--accent']:TV['--dim'])+'">20+ · '+a20+'</span>'
    +'<span class="rec"></span></div>';
  h+='</div>';
  sc.innerHTML=h;
  document.getElementById('strkNote').textContent='день — від '+STREAK_MIN+' балів, тиждень — за нормою';

  const box=document.getElementById('achList'),head=document.getElementById('autoHead');
  box.innerHTML='';
  const showAuto=S.autoAch!==0;
  head.style.display=showAuto?'':'none';box.style.display=showAuto?'':'none';
  if(!showAuto)return;
  document.getElementById('bonusCount').textContent=achDone()+' з '+achTotal();
  const open=[],done=[];
  TRACKS.forEach(tr=>{const cur=trackCur(tr);let shown=false;
    tr.tiers.forEach((t,i)=>{const key=tr.id+'@'+t;
      if(S.ach&&S.ach[key])done.push({tr,t,i,cur,date:S.ach[key]});
      else if(!shown){shown=true;open.push({tr,t,i,cur})}})});
  open.sort((a,b)=>(b.cur/b.t)-(a.cur/a.t));
  done.sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:0));
  const row=(o,lock)=>{
    const col=o.tr.ck?ST[o.tr.ck].color:TV['--accent'];
    const pct=Math.min(100,Math.round(o.cur/o.t*100));
    let s='<div class="ach'+(lock?' lock':'')+'"><div class="md"'
      +(lock?'':' style="background:'+(o.tr.ck?ST[o.tr.ck].soft:TV['--pri-bg'])+';border-color:'+col+'"')
      +'>'+(lock?o.tr.emo:'🏅')+'</div><div class="tx"><div class="t1">'+esc(tierName(o.tr,o.t))+'</div>';
    if(lock){s+='<div class="t2">'+o.cur+' / '+o.t+'</div>'
      +'<div class="pb"><i style="width:'+pct+'%;background:'+col+'"></i></div>'}
    else s+='<div class="t2">здобуто '+o.date.slice(8)+'.'+o.date.slice(5,7)+'</div>';
    s+='</div><div class="rw"'+(lock?'':' style="color:'+col+'"')+'>+'+o.tr.xp[o.i]+'</div></div>';
    return s};
  let hh='';
  if(open.length){hh+='<div class="achsub">У процесі</div>';open.forEach(o=>hh+=row(o,true))}
  if(done.length){hh+='<div class="achsub">Здобуто</div>';done.forEach(o=>hh+=row(o,false))}
  if(!hh)hh='<div class="empty">Тут зʼявляться нагороди за серії.</div>';
  box.innerHTML=hh}

function renderTop(){
  const lg=todayLog(),tot=SK.reduce((a,k)=>a+Math.max(0,lg[k]||0),0);
  document.getElementById('hsub').textContent='сумарний рівень '+SK.reduce((a,k)=>a+S.stats[k].lvl,0);

  if(mapOn()||PREV_TOT==null)countTo(st,tot,fmt);else st.textContent=fmt(tot);

const REDUCED=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
/* анімації на мапі програються, коли мапу видно: так зміни видно, коли повертаєшся до неї */
const mapOn=()=>{const p=document.querySelector('.page[data-p=map]');return !!(p&&p.classList.contains('on'))};
const tasksOn=()=>{const p=document.querySelector('.page[data-p=tasks]');return !!(p&&p.classList.contains('on'))};
let PREV_CARD=null,PREV_TOT=null,WK_GROWN=false,JUST_TOGGLED=null,QUEST_WAS_DONE=null;
function countTo(el,to,fmt){
  const from=PREV_TOT;PREV_TOT=to;
  if(from==null||from===to||REDUCED()||!window.requestAnimationFrame){el.textContent=fmt(to);return}
  const t0=performance.now(),D=550;
  const step=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step)}
let RAD_PREV=null,RAD_ANIM=0;
function ghostDays(){return S.ghost==='m'?30:7}
function ghostVals(){
  if(S.ghost==='off')return null;
  const iso=shiftDay(today(),-ghostDays());
  if(!S.startDay||S.startDay>iso)return null;
  return SK.map(k=>lvlFromXp(xpAt(k,iso)))}

function renderRadar(){
  const to=SK.map(k=>lvlNow(k)),gh=ghostVals();
  if(!mapOn()&&RAD_PREV&&RAD_PREV.length===to.length){cancelAnimationFrame(RAD_ANIM);renderRadarLegend(gh);drawRadar(to,gh);return}
  const from=(RAD_PREV&&RAD_PREV.length===to.length)?RAD_PREV:to;RAD_PREV=to;
  cancelAnimationFrame(RAD_ANIM);
  renderRadarLegend(gh);
  if(REDUCED()||from.every((v,i)=>Math.abs(v-to[i])<1e-4)){drawRadar(to,gh);return}
  const t0=performance.now(),D=700;
  const step=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);
    drawRadar(from.map((v,i)=>v+(to[i]-v)*e),gh);if(p<1)RAD_ANIM=requestAnimationFrame(step)};
  drawRadar(from,gh);RAD_ANIM=requestAnimationFrame(step)}

function drawRadar(vals,gh){
  const svg=document.getElementById('radar'),cx=192,cy=156,R=92,N=SK.length;
  const max=Math.max(4,Math.ceil(Math.max(...vals,...(gh||[0]))));
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const rad=v=>Math.max(9,R*(v/max));
  const poly=a=>a.map((v,i)=>pt(i,rad(v)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const F='font-family:Fredoka,sans-serif';
  let h='';
  [0.25,0.5,0.75,1].forEach(f=>{h+='<polygon points="'+SK.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')
    +'" fill="'+(f===1?TV['--rad-face']:'none')+'" stroke="'+TV['--rad-grid']+'" stroke-width="2"/>'});
  SK.forEach((_,i)=>{const[x,y]=pt(i,R);
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+TV['--rad-spoke']+'" stroke-width="2"/>'});
  if(gh)h+='<polygon class="ghost" points="'+poly(gh)+'" fill="none" stroke="'+TV['--ink-2']+'" stroke-opacity=".55" '
    +'stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>';
  h+='<polygon points="'+poly(vals)+'" fill="'+TV['--rad-fill']+'" fill-opacity=".38" stroke="'+TV['--rad-line']
    +'" stroke-width="3" stroke-linejoin="round"/>';
  SK.forEach((k,i)=>{const[x,y]=pt(i,rad(vals[i]));
    h+='<rect x="'+(x-4.5).toFixed(1)+'" y="'+(y-4.5).toFixed(1)+'" width="9" height="9" rx="1.5" fill="'+ST[k].color
      +'" stroke="'+TV['--card']+'" stroke-width="1.5"/>'});
  SK.forEach((k,i)=>{
    const[x,y]=pt(i,R+26),s=ST[k],lv=S.stats[k].lvl;
    const anchor=Math.abs(x-cx)<6?'middle':(x>cx?'start':'end');
    const ox=anchor==='middle'?0:(x>cx?-4:4);
    const up=gh?lv-Math.floor(gh[i]):0;
    h+='<text x="'+(x+ox).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="'+anchor+'" font-size="17">'+s.emo+'</text>';
    h+='<text x="'+(x+ox).toFixed(1)+'" y="'+(y+13).toFixed(1)+'" text-anchor="'+anchor+'" font-size="'+(N>7?11.5:12.5)+'" style="'+F
      +'" fill="'+TV['--rad-label']+'">'+s.name+'</text>';
    h+='<text x="'+(x+ox).toFixed(1)+'" y="'+(y+27).toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" style="'+F
      +'" font-weight="600" fill="'+s.color+'">'+lv
      +(up>0?'<tspan font-size="10.5" fill="'+TV['--good']+'" dx="3">+'+up+'</tspan>':'')+'</text>'});
  svg.innerHTML=h}

function renderRadarLegend(gh){
  const lg=document.getElementById('radarLg');if(!lg)return;
  const lb={w:'тиждень тому',m:'місяць тому'};
  let h='<span class="k"><span class="sw"></span>зараз</span>';
  if(gh)h+='<span class="k"><span class="sw g"></span>'+lb[S.ghost]+'</span>';
  h+='<span class="seg2">'+[['w','тиждень'],['m','місяць'],['off','без тіні']].map(o=>
    '<button data-g="'+o[0]+'" class="'+(S.ghost===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</span>';
  if(!gh&&S.ghost!=='off'&&S.startDay){
    const left=Math.max(1,Math.round((new Date(shiftDay(S.startDay,ghostDays()))-new Date(today()))/864e5));

function segBar(pct,color,line,from){
  let h='<div class="seg">';const lit=Math.ceil(pct/10);
  for(let i=0;i<10;i++){const anim=from!=null&&i>=from&&i<lit;
    h+='<i'+(anim?' class="fill"':'')+' style="background:'+(pct>=(i+1)*10?color:(pct>i*10?color+'66':TV['--field']))
      +';border-color:'+line+(anim?';animation-delay:'+((i-from)*55)+'ms':'')+'"></i>'}
  return h+'</div>'}

function renderGrid(){
  const g=document.getElementById('statGrid'),lg=todayLog();g.innerHTML='';
