<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCEBFB">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Waymark">
<title>Waymark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3F4E63; --ink-2:#6C7F97; --dim:#9DAFC4;
  --card:#FFFFFF; --edge:#D8E6F5; --edge-2:#C3D8ED; --soft:#EEF5FD;
  --sky:#8FC0EE; --good:#7ECDB0; --bad:#F09A9A;
  --disp:'Fredoka',system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#E4F0FC}
body{
  font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);
  background:linear-gradient(170deg,#DCEBFB 0%,#E9F1FE 45%,#F1ECFD 100%);
  background-attachment:fixed;min-height:100vh;padding:0 0 96px;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.bar{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.bar .t{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:.02em}
.bar .s{font-size:11.5px;color:var(--ink-2);font-weight:600}
.ib{width:36px;height:36px;border-radius:11px;background:var(--card);border:2px solid var(--edge);
  box-shadow:0 2px 0 var(--edge);display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.ib:active{transform:translateY(2px);box-shadow:none}
.ib+.ib{margin-left:4px}
.spacer{margin-left:auto}

.page{display:none}
.page.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:4px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:rgba(240,246,254,.94);backdrop-filter:blur(8px);border-top:2px solid var(--edge)}
.nv{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;
  border-radius:11px;font-family:var(--disp);font-size:12px;font-weight:500;color:var(--dim)}
.nv .e{font-size:17px;line-height:1.1;filter:grayscale(1);opacity:.5}
.nv.on{background:var(--card);color:#3F4E63;box-shadow:0 2px 0 var(--edge);border:2px solid var(--edge);padding:4px 2px}
.nv.on .e{filter:none;opacity:1}
.nv .dot{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;
  background:#EE9184;border:2px solid #FDEEEB;display:none}
.nv .dot.on{display:block}

.card{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);
  box-shadow:0 3px 0 var(--edge);padding:14px}
.radarcard{margin-bottom:9px;padding:8px 10px 4px}
.radarcard svg{width:100%;height:auto;display:block}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:9px}
.hero .txt{flex:1;min-width:0}
.hero h1{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.25}
.hero p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tchip{font-family:var(--disp);font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:8px;border:2px solid}

.fort{background:#FFF8E9;border:2px solid #F2DFB4;box-shadow:0 3px 0 #F2DFB4;border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.fort .ic{font-size:17px;line-height:1.3;flex:none}
.fort .lb{font-family:var(--disp);font-size:11.5px;font-weight:500;color:#B08A3A;letter-spacing:.05em;text-transform:uppercase}
.fort .tx{font-size:14px;font-weight:600;color:#7A5E22;line-height:1.5;margin-top:3px}

.sh{display:flex;align-items:center;gap:7px;padding:18px 4px 9px}
.sh h2{font-family:var(--disp);font-size:16px;font-weight:600}
.sh .n{font-size:11px;color:var(--dim);font-weight:700}
.sh button{margin-left:auto;font-family:var(--disp);font-size:13px;font-weight:500;color:#5D93C7;
  border:2px solid var(--edge);background:var(--card);border-radius:9px;padding:3px 10px;box-shadow:0 2px 0 var(--edge)}
.sh button:active{transform:translateY(2px);box-shadow:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc{border:2px solid;border-radius:13px;padding:10px 11px 11px;text-align:left;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.06)}
.sc:active{transform:translateY(2px);box-shadow:none}
.sc.sel{outline:2px dashed currentColor;outline-offset:2px}
.sc-top{display:flex;align-items:center;gap:6px}
.sc-emo{font-size:14px;line-height:1}
.sc-name{font-family:var(--disp);font-size:14.5px;font-weight:600;flex:1;color:var(--ink)}
.sc-lvl{font-family:var(--disp);font-size:15px;font-weight:600}
.sc-rank{font-size:12px;font-weight:700;line-height:1.3;margin-top:5px;min-height:16px}
.seg{display:flex;gap:2px;margin-top:8px}
.seg i{flex:1;height:7px;border-radius:1px;background:#fff;border:1px solid rgba(0,0,0,.07)}
.sc-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);margin-top:6px;font-weight:700}
.sc-gain{font-family:var(--disp);font-size:12.5px;font-weight:500}

.filters{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:9px}
.fchip{font-family:var(--disp);font-size:13px;font-weight:500;padding:4px 11px;border-radius:9px;
  background:var(--card);border:2px solid var(--edge);color:var(--ink-2);box-shadow:0 2px 0 var(--edge)}
.fchip.on{color:#fff}
.fchip:active{transform:translateY(2px);box-shadow:none}

.task{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:2px solid var(--edge);
  border-radius:12px;box-shadow:0 2px 0 var(--edge);padding:10px;margin-bottom:7px}
.task.done{background:var(--soft);box-shadow:none;border-color:#E6EEF8}
.check{width:24px;height:24px;flex:none;border:2px solid var(--edge-2);border-radius:7px;background:#fff;
  display:grid;place-items:center;font-size:13px;color:transparent;font-weight:700}
.done .check{color:#fff}
.check:active{transform:translateY(1px)}
.cnt{min-width:36px;height:26px;padding:0 7px;flex:none;border:2px solid var(--edge-2);border-radius:7px;background:#fff;
  font-family:var(--disp);font-size:13.5px;font-weight:500;color:var(--ink-2);display:grid;place-items:center}
.cnt.has{color:var(--ink)}
.tb{flex:1;min-width:0;cursor:pointer}
.tn{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
.done .tn{color:var(--dim);text-decoration:line-through}
.tm{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}
.pill{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;line-height:1.7}
.dlab{font-size:10.5px;color:var(--dim);font-weight:700}
.xpv{font-family:var(--disp);font-size:13.5px;font-weight:500;color:var(--dim);flex:none;margin-top:3px}
.ed{color:var(--dim);font-size:13px;padding:2px 4px;flex:none;line-height:1}
.ed:hover{color:var(--ink)}
.empty{background:var(--card);border:2px dashed var(--edge-2);border-radius:12px;padding:14px;
  font-size:12.5px;color:var(--ink-2);line-height:1.6;text-align:center}

.bn{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--edge);
  border-radius:12px;box-shadow:0 2px 0 var(--edge);padding:10px;margin-bottom:7px}
.claim{flex:none;font-family:var(--disp);font-size:13.5px;font-weight:500;padding:5px 12px;border-radius:9px;
  background:#FFF4D9;border:2px solid #F0D79B;color:#A9761B;box-shadow:0 2px 0 #F0D79B}
.claim:active{transform:translateY(2px);box-shadow:none}

.add{display:flex;gap:6px;background:var(--card);border:2px solid var(--edge);border-radius:12px;
  box-shadow:0 2px 0 var(--edge);padding:8px 10px;margin-top:8px}
.add input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13.5px;font-weight:600}
.add input::placeholder{color:var(--dim);font-weight:400}
.add button{font-family:var(--disp);color:#5D93C7;font-size:20px;padding:0 4px;line-height:1}

.veil{position:fixed;inset:0;background:rgba(63,78,99,.4);backdrop-filter:blur(2px);z-index:60;
  display:none;align-items:center;justify-content:center;padding:16px}
.veil.on{display:flex}
.modal{background:var(--card);border:2px solid var(--edge-2);border-radius:16px;box-shadow:0 4px 0 var(--edge-2);
  padding:17px;width:100%;max-width:400px;max-height:88vh;overflow:auto}
.modal h3{font-family:var(--disp);font-size:17px;font-weight:600;margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-family:var(--disp);font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.f input[type=text],.f input[type=number],.f textarea{width:100%;background:var(--soft);border:2px solid var(--edge);
  border-radius:10px;padding:9px 11px;outline:none;font-size:14px;font-weight:600}
.f textarea{font-weight:400;font-size:13px;min-height:150px;resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus{border-color:var(--sky);background:#fff}
.mchips{display:flex;gap:5px;flex-wrap:wrap}
.mchip{padding:6px 10px;border-radius:9px;background:var(--soft);border:2px solid var(--edge);
  font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mchip.on{background:#fff;border-color:var(--sky);color:#3F4E63}
.mrow{display:flex;gap:7px;margin-top:16px}
.btn{flex:1;font-family:var(--disp);font-size:15px;font-weight:500;padding:9px;border-radius:11px;
  background:var(--soft);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);text-align:center;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:#CFE6FB;border-color:#A6CDF2;box-shadow:0 3px 0 #A6CDF2;color:#2F5F8E}
.btn.del{flex:none;padding:9px 13px;background:#FDECEC;border-color:#F3C4C4;box-shadow:0 3px 0 #F3C4C4;color:#B25757}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-top:8px}
.hrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.hdate{width:46px;color:var(--dim);font-size:10.5px;font-weight:700;flex:none}
.hbars{display:flex;gap:2px;flex:1;height:16px;align-items:flex-end}
.hb{flex:1;border-radius:1px;min-height:3px}
.htot{width:40px;text-align:right;font-family:var(--disp);font-size:13px;font-weight:500;flex:none}

.lv{text-align:center;padding:2px 0 0}
.lv-emo{font-size:54px;line-height:1.15}
.lv-stat{font-family:var(--disp);font-size:13.5px;font-weight:500;margin-top:10px}
.lv-fl{font-size:14px;line-height:1.6;margin-top:11px;color:var(--ink-2);font-weight:600}
.lv-was{font-size:12px;color:var(--dim);margin-top:12px;font-weight:600}
.lv-now{font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.3;margin-top:4px}
.lv-n{font-family:var(--disp);font-size:13px;color:var(--dim);margin-top:8px}

.fmodal{text-align:center;padding:4px 0 0}
.fmodal .ic{font-size:44px;line-height:1.2}
.fmodal .lb{font-family:var(--disp);font-size:12.5px;font-weight:500;color:#B08A3A;letter-spacing:.06em;
  text-transform:uppercase;margin-top:10px}
.fmodal .tx{font-size:16px;font-weight:600;line-height:1.6;margin-top:11px;color:#6E5520}

#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);background:var(--card);
  border:2px solid var(--edge-2);box-shadow:0 3px 0 var(--edge-2);padding:9px 15px;border-radius:11px;
  font-size:13px;font-weight:700;opacity:0;transition:.22s;pointer-events:none;z-index:80;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:620px){.wrap{max-width:820px}.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div><div class="t">Waymark</div><div class="s" id="hsub">—</div></div>
    <div class="spacer"></div>
    <button class="ib" id="btnHist" title="Історія">◴</button>
    <button class="ib" id="btnSet" title="Налаштування">⚙</button>
  </div>

  <section class="page on" data-p="map">
    <div class="card radarcard">
      <svg id="radar" viewBox="0 0 384 322"></svg>
    </div>
    <div class="card hero">
      <div class="txt">
        <h1 id="sumTitle">—</h1>
        <p id="sumText">—</p>
        <div class="chips" id="todayChips"></div>
      </div>
    </div>
    <div class="fort" id="fortCard" style="display:none">
      <span class="ic">🔮</span>
      <div><div class="lb">Передбачення дня</div><div class="tx" id="fortText"></div></div>
    </div>
    <div class="grid" id="statGrid"></div>
  </section>

  <section class="page" data-p="tasks">
    <div class="sh"><h2>Завдання</h2><span class="n" id="taskCount"></span><button id="btnNewTask">+ нове</button></div>
    <div class="filters" id="filters"></div>
    <div id="taskList"></div>
    <div class="add"><input id="quickAdd" placeholder="Швидко додати завдання"><button id="quickBtn">+</button></div>
  </section>

  <section class="page" data-p="bonus">
    <div class="sh"><h2>Досягнення</h2><span class="n" id="bonusCount"></span><button id="btnNewBonus">+ нове</button></div>
    <div id="bonusList"></div>
  </section>
</div>

<nav class="nav">
  <button class="nv on" data-p="map"><span class="e">🔮</span>Мапа</button>
  <button class="nv" data-p="tasks"><span class="e">✓</span>Завдання<i class="dot" id="navDot"></i></button>
  <button class="nv" data-p="bonus"><span class="e">🏆</span>Досягнення</button>
</nav>

<div class="veil" id="veil"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const STATS=[
 {k:'str', emo:'💪', name:'Сила',        color:'#EE9184', soft:'#FDEEEB', line:'#F6C7BF'},
 {k:'mind',emo:'🧠', name:'Розум',       color:'#79AEEC', soft:'#EAF3FD', line:'#BCD9F6'},
 {k:'ord', emo:'✨', name:'Порядок',     color:'#68C6AB', soft:'#E7F7F2', line:'#B3E4D5'},
 {k:'care',emo:'❤️', name:'Турбота',     color:'#EE96BB', soft:'#FDEDF4', line:'#F7C9DD'},
 {k:'art', emo:'🎨', name:'Творчість',   color:'#EDB566', soft:'#FDF3E4', line:'#F7DBB2'},
 {k:'grit',emo:'🛡️', name:'Витривалість',color:'#A692E4', soft:'#F1EDFD', line:'#D2C7F1'}
];
const SK=STATS.map(s=>s.k), ST=Object.fromEntries(STATS.map(s=>[s.k,s]));
const DIFF=[{k:'vlow',xp:2,label:'дуже легко'},{k:'low',xp:5,label:'легко'},{k:'mid',xp:10,label:'середньо'},
 {k:'high',xp:20,label:'складно'},{k:'vhigh',xp:40,label:'дуже складно'},{k:'epic',xp:100,label:'епічно'}];
const DF=Object.fromEntries(DIFF.map(d=>[d.k,d]));
const KEY='staty.v1';

const RANKS={
 str:['🐌 Сонний равлик','🐦 Жвавий горобчик','🐐 Впертий козлик','🦊 Спритна лисиця','🐺 Гірський вовк',
      '🐻 Залізний ведмідь','🦬 Невтомний бізон','🐉 Дракон сили','⚡ Громовержець','👑 Легенда'],

      '🏛️ Архіваріус','🦉 Мудрець','✨ Провидець','🌌 Хранитель знань','🌠 Всезнавець'],
 ord:['🌪️ Хаотик','🧹 Прибирач','🧺 Приборкувач хаосу','🪴 Доглядач оселі','📦 Організатор',
      '🗝️ Майстер порядку','🏡 Берегиня дому','🌿 Хранитель затишку','✨ Володар гармонії','💎 Творець місця сили'],
 care:['🌱 Паросток','☀️ Бадьора','🫧 Енергійна','💆 Доглянута','🍯 Сповнена сил',
      '🕊️ Невтомна','💗 Впевнена','🌸 Квітуча','🌻 Життєдайна','👑 Неперевершена'],
 art:['✨ Іскорка','🌱 Мрійниця','🖋️ Оповідачка','🎭 Мисткиня','⚗️ Алхімік ідей',
      '🎨 Творчиня','🌌 Натхненниця','👑 Маестра','🌠 Легенда мистецтва','🌈 Муза'],
 grit:['🌧️ Мандрівник','🪨 Стійка','🌲 Загартована','🏕️ Досвідчена','🧭 Непохитна',
      '⛰️ Підкорювач вершин','🌊 Скеля серед хвиль','🔥 Незгасима','⭐ Провідник','🦅 Герой легенд']
};
const FLAVOR={
 str:['Тіло слухається краще, ніж учора.','Ще один поріг, який ти просто переступила.',
      'Сила набирається тихо, а помічається раптом.','Те, що колись збивало дихання, вже не збиває.'],
 mind:['Нові знання відкрили тобі наступний шлях.','Те, що вчора було складним, сьогодні очевидне.',
      'Ще один пласт світу став зрозумілим.','Ти читаєш між рядків там, де раніше не бачила рядків.'],
 ord:['Простір навколо став слухнянішим.','Хаос відступив ще на крок.',
      'Дім дихає легше, ніж раніше.','Речі нарешті знають своє місце.'],
 care:['Ти дбала про себе — і це видно.','Ресурс не взявся нізвідки, ти його наростила.',
      'Тіло вдячне за те, що ти для нього робиш.','Турбота про себе перестала бути винятком.'],
 art:['Ідеї почали слухатись рук.','Ти зробила більше, ніж уявляла на початку.',
      'Творчість стала звичкою, а не настроєм.','Твій голос звучить впевненіше.'],
 grit:['Ти пройшла крізь бурю і не зупинилася.','Витримка — теж навичка, і вона росте.',
      'Те, що колись вибивало з колії, більше не вибиває.','Ти стала опорою сама собі.']
};

/* ===== ПЕРЕДБАЧЕННЯ =====
   Свої 100 штук найзручніше вставити через ⚙ → Передбачення (по одному на рядок).
   Або просто заміни цей список тут. */
const FORTUNES=[
 "Сьогодні ти сильніша, ніж учора.",
 "Маленькі кроки теж ведуть уперед.",
 "Відповідь з'явиться вчасно.",
 "Довірся своєму темпу.",
 "Те, що зараз здається складним, одного дня стане звичним.",
 "Не всі двері мають відчинятися одразу.",

 "Найважливіше вже росте всередині тебе.",

  const i=s.indexOf(' ');return{emo:s.slice(0,i),name:s.slice(i+1),full:s}}

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r),m=structuredClone(blank);
    Object.assign(m,d);
    SK.forEach(k=>{if(!m.stats[k])m.stats[k]={xp:0,lvl:1,total:0,streak:0,best:0,miss:0};
      if(m.stats[k].miss==null)m.stats[k].miss=0});
    if(!d.v||d.v<2){m.v=2;if(!d.penalty||d.penalty<=1)m.penalty=5;m.pace=1}
    if(!m.fortunes||!m.fortunes.length)m.fortunes=FORTUNES.slice();
    if(!m.fortSeen)m.fortSeen=[];
    return m}}catch(e){}
  const d=structuredClone(blank);d.tasks=seed();d.bonuses=seedBonus();return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не вдалося зберегти')}}
function uid(){return Math.random().toString(36).slice(2,10)}
function today(){const d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}
function need(l){return Math.round((60+40*(l-1)+6*(l-1)*(l-1))*(S.pace||1))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2100)}

function award(keys,amount,date){
  const d=date||today();
  if(!S.log[d])S.log[d]=Object.fromEntries(SK.map(k=>[k,0]));
  keys.forEach(k=>{const st=S.stats[k];if(!st)return;
    st.xp+=amount;if(amount>0)st.total+=amount;
    S.log[d][k]=(S.log[d][k]||0)+amount;
    while(st.xp>=need(st.lvl)){const was=rankOf(k,st.lvl);st.xp-=need(st.lvl);st.lvl++;
      LVQ.push({k,lvl:st.lvl,was,now:rankOf(k,st.lvl)})}
    while(st.xp<0){if(st.lvl>1){st.lvl--;st.xp+=need(st.lvl)}else{st.xp=0;break}}})}

function rollover(){
  const t=today();
  if(!S.lastDay){S.lastDay=t;save();return}
  if(S.lastDay===t)return;
  let cur=S.lastDay,guard=0,lost=0;
  while(cur<t&&guard++<400){
    const day=S.log[cur]||Object.fromEntries(SK.map(k=>[k,0]));
    SK.forEach(k=>{const st=S.stats[k];
      if((day[k]||0)>0){st.streak++;st.miss=0;if(st.streak>st.best)st.best=st.streak}
      else{st.streak=0;st.miss=(st.miss||0)+1;
        if(S.penalty>0){
          const pen=S.penalty*Math.min(st.miss,4);
          st.xp-=pen;lost+=pen;
          if(!S.log[cur])S.log[cur]=Object.fromEntries(SK.map(x=>[x,0]));
          S.log[cur][k]=(S.log[cur][k]||0)-pen;
          while(st.xp<0){if(st.lvl>1){st.lvl--;st.xp+=need(st.lvl)}else{st.xp=0;break}}}}});
    const n=new Date(cur+'T12:00:00');n.setDate(n.getDate()+1);cur=n.toISOString().slice(0,10)}
  S.tasks=S.tasks.filter(x=>!(x.once&&x.doneOn));
  S.tasks.forEach(x=>{x.doneOn=null;x.count=0});
  const keys=Object.keys(S.log).sort();
  if(keys.length>200)keys.slice(0,keys.length-200).forEach(k=>delete S.log[k]);
  S.lastDay=t;save();
  if(lost)setTimeout(()=>toast('Втрачено '+lost+' балів за дні без прогресу'),800)}

function pickFortune(){
  const list=(S.fortunes&&S.fortunes.length)?S.fortunes:FORTUNES;
  if(S.fortDay===today()&&S.fortText)return false;
  const avoid=(S.fortSeen||[]).slice(-Math.min(30,Math.floor(list.length/2)));
  let pool=list.filter(x=>!avoid.includes(x));
  if(!pool.length)pool=list;
  S.fortText=pool[Math.floor(Math.random()*pool.length)];
  S.fortDay=today();
  S.fortSeen=[...(S.fortSeen||[]),S.fortText].slice(-60);
  save();return true}

function renderRadar(){
  const svg=document.getElementById('radar'),cx=192,cy=156,R=92;
  const max=Math.max(4,...SK.map(k=>S.stats[k].lvl));
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const F='font-family:Fredoka,sans-serif';
  let h='';
  [0.25,0.5,0.75,1].forEach(f=>{h+='<polygon points="'+SK.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')
    +'" fill="'+(f===1?'#F7FAFE':'none')+'" stroke="#D8E6F5" stroke-width="2"/>'});
  SK.forEach((_,i)=>{const[x,y]=pt(i,R);
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#E4EDF8" stroke-width="2"/>'});
  const pts=SK.map((k,i)=>pt(i,Math.max(9,R*(S.stats[k].lvl/max))).map(n=>n.toFixed(1)).join(',')).join(' ');
  h+='<polygon points="'+pts+'" fill="#A9CDF2" fill-opacity=".35" stroke="#79AEEC" stroke-width="3" stroke-linejoin="round"/>';
  SK.forEach((k,i)=>{const[x,y]=pt(i,Math.max(9,R*(S.stats[k].lvl/max)));
    h+='<rect x="'+(x-4).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" width="8" height="8" fill="'+ST[k].color
      +'" stroke="#fff" stroke-width="1.5"/>'});
  SK.forEach((k,i)=>{
    const[x,y]=pt(i,R+26),s=ST[k],lv=S.stats[k].lvl;
    const anchor=Math.abs(x-cx)<6?'middle':(x>cx?'start':'end');
    const ox=anchor==='middle'?0:(x>cx?-4:4);
    h+='<text x="'+(x+ox).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="'+anchor+'" font-size="17">'+s.emo+'</text>';
    h+='<text x="'+(x+ox).toFixed(1)+'" y="'+(y+13).toFixed(1)+'" text-anchor="'+anchor+'" font-size="12.5" style="'+F
      +'" fill="#5A6B80">'+s.name+'</text>';
    h+='<text x="'+(x+ox).toFixed(1)+'" y="'+(y+27).toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" style="'+F
      +'" font-weight="600" fill="'+s.color+'">'+lv+'</text>'});
  svg.innerHTML=h}

function taskRow(t){
  const el=document.createElement('div');el.className='task'+(t.doneOn?' done':'');
  const xp=DF[t.diff].xp,c0=ST[t.stats[0]];
  if(t.multi){const c=document.createElement('button');c.className='cnt'+(t.count?' has':'');
    c.textContent=t.count?'×'+t.count:'+';
    if(t.count){c.style.borderColor=c0.color;c.style.background=c0.soft;c.style.color=c0.color}
    c.onclick=()=>{t.count=(t.count||0)+1;t.doneOn=today();award(t.stats,xp);save();render()};
    el.appendChild(c)}
  else{const c=document.createElement('button');c.className='check';c.textContent='✓';
    if(t.doneOn){c.style.background=c0.color;c.style.borderColor=c0.color}
    c.onclick=()=>{if(t.doneOn){award(t.stats,-xp);t.doneOn=null;t.count=0}
      else{t.doneOn=today();t.count=1;award(t.stats,xp)}save();render()};
    el.appendChild(c)}
  const b=document.createElement('div');b.className='tb';
  b.innerHTML='<div class="tn">'+esc(t.name)+'</div>';
  const m=document.createElement('div');m.className='tm';
  t.stats.forEach(k=>{const s=ST[k],p=document.createElement('span');p.className='pill';
    p.style.color=s.color;p.style.background=s.soft;p.textContent=s.emo+' '+s.name;m.appendChild(p)});
  const d=document.createElement('span');d.className='dlab';d.textContent=DF[t.diff].label;m.appendChild(d);
  if(t.once){const o=document.createElement('span');o.className='dlab';o.textContent='· разове';m.appendChild(o)}
  b.appendChild(m);b.onclick=()=>openTask(t);el.appendChild(b);
  const v=document.createElement('div');v.className='xpv';v.textContent='+'+xp;el.appendChild(v);
  const ed=document.createElement('button');ed.className='ed';ed.textContent='✎';
  ed.onclick=e=>{e.stopPropagation();openTask(t)};el.appendChild(ed);
  return el}

function renderBonuses(){
  const box=document.getElementById('bonusList');box.innerHTML='';
  document.getElementById('bonusCount').textContent=S.bonuses.length+' шт.';
  if(!S.bonuses.length){box.innerHTML='<div class="empty">Разові перемоги, які не вкладаються в щоденні завдання.</div>';return}
  S.bonuses.forEach(bn=>{
    const el=document.createElement('div');el.className='bn';
    const b=document.createElement('div');b.className='tb';
    b.innerHTML='<div class="tn">'+esc(bn.name)+'</div>';
    const m=document.createElement('div');m.className='tm';
    bn.stats.forEach(k=>{const s=ST[k],p=document.createElement('span');p.className='pill';
      p.style.color=s.color;p.style.background=s.soft;p.textContent=s.emo;m.appendChild(p)});
    if(bn.count){const c=document.createElement('span');c.className='dlab';c.textContent='отримано '+bn.count+'×';m.appendChild(c)}
    b.appendChild(m);b.onclick=()=>openBonus(bn);el.appendChild(b);
    const cl=document.createElement('button');cl.className='claim';cl.textContent='+'+bn.xp;
    cl.onclick=()=>{bn.count=(bn.count||0)+1;award(bn.stats,bn.xp);save();render();toast('Зараховано: '+bn.name)};
    el.appendChild(cl);
    const ed=document.createElement('button');ed.className='ed';ed.textContent='✎';
    ed.onclick=e=>{e.stopPropagation();openBonus(bn)};el.appendChild(ed);
    box.appendChild(el)})}

/* ---------- modal ---------- */
const veil=document.getElementById('veil'),modal=document.getElementById('modal');
veil.onclick=e=>{if(e.target===veil)close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function close(){veil.classList.remove('on');modal.innerHTML=''}
function open(h){modal.innerHTML=h;veil.classList.add('on')}

function flushLevels(){
  if(!LVQ.length||veil.classList.contains('on'))return;
  const e=LVQ.shift(),s=ST[e.k],pool=FLAVOR[e.k];
  let h='<div class="lv">';
  h+='<div class="lv-emo">'+e.now.emo+'</div>';
  h+='<div class="lv-stat" style="color:'+s.color+'">'+s.emo+' '+s.name+'</div>';
  h+='<div class="lv-fl">'+pool[Math.floor(Math.random()*pool.length)]+'</div>';
  if(e.was.name!==e.now.name)h+='<div class="lv-was">Ти більше не '+esc(e.was.name)+'.</div>';
  h+='<div class="lv-now" style="color:'+s.color+'">Тепер ти '+esc(e.now.name)+'</div>';
  h+='<div class="lv-n">рівень '+e.lvl+'</div></div>';
  h+='<div class="mrow"><button class="btn pri" id="lvOk">Далі</button></div>';
  open(h);modal.querySelector('#lvOk').onclick=()=>{close();setTimeout(flushLevels,180)}}

function openTask(t){
  const isNew=!t;
  t=t||{id:uid(),name:'',diff:'low',stats:[filter==='all'?'str':filter],multi:false,once:false,doneOn:null,count:0};
  let h='<h3>'+(isNew?'Нове завдання':'Завдання')+'</h3>';
  h+='<div class="f"><label>Назва</label><input type="text" id="tName" value="'+esc(t.name)+'" placeholder="Наприклад: медитація 10 хвилин"></div>';
  h+='<div class="f"><label>Стати — можна кілька</label><div class="mchips" id="tStats">';
  STATS.forEach(s=>h+='<button class="mchip'+(t.stats.includes(s.k)?' on':'')+'" data-k="'+s.k
    +'" style="'+(t.stats.includes(s.k)?'color:'+s.color+';border-color:'+s.line+';background:'+s.soft:'')+'">'+s.emo+' '+s.name+'</button>');
  h+='</div><p class="note">Кожна вибрана стата отримує повний бал, а не частину.</p></div>';
  h+='<div class="f"><label>Складність</label><div class="mchips" id="tDiff">';
  DIFF.forEach(d=>h+='<button class="mchip'+(t.diff===d.k?' on':'')+'" data-k="'+d.k+'">'+d.label+' · '+d.xp+'</button>');
  h+='</div></div>';
  h+='<div class="f"><label>Тип</label><div class="mchips" id="tType">';
  h+='<button class="mchip'+(t.multi?' on':'')+'" data-k="multi">рахувати повтори</button>';
  h+='<button class="mchip'+(t.once?' on':'')+'" data-k="once">разове</button></div></div>';
  h+='<div class="mrow">'+(isNew?'':'<button class="btn del" id="tDel">✕</button>')
    +'<button class="btn" id="tCancel">Назад</button><button class="btn pri" id="tSave">Зберегти</button></div>';
  open(h);
  const dr={stats:[...t.stats],diff:t.diff,multi:t.multi,once:t.once};
  modal.querySelectorAll('#tStats .mchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,s=ST[k],i=dr.stats.indexOf(k);
    if(i>-1){if(dr.stats.length===1)return;dr.stats.splice(i,1);c.classList.remove('on');c.style.cssText=''}
    else{dr.stats.push(k);c.classList.add('on');c.style.color=s.color;c.style.borderColor=s.line;c.style.background=s.soft}});
  modal.querySelectorAll('#tDiff .mchip').forEach(c=>c.onclick=()=>{dr.diff=c.dataset.k;
    modal.querySelectorAll('#tDiff .mchip').forEach(x=>x.classList.remove('on'));c.classList.add('on')});
  modal.querySelectorAll('#tType .mchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;dr[k]=!dr[k];c.classList.toggle('on',dr[k]);
    if(dr.multi&&dr.once){const o=k==='multi'?'once':'multi';dr[o]=false;
      modal.querySelector('#tType .mchip[data-k='+o+']').classList.remove('on')}});
  modal.querySelector('#tCancel').onclick=close;
  const del=modal.querySelector('#tDel');
  if(del)del.onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);save();render();close();toast('Видалено')};
  modal.querySelector('#tSave').onclick=()=>{
    const n=modal.querySelector('#tName').value.trim();if(!n){toast('Впиши назву');return}
    t.name=n;t.stats=SK.filter(k=>dr.stats.includes(k));t.diff=dr.diff;t.multi=dr.multi;t.once=dr.once;
    if(isNew)S.tasks.unshift(t);save();render();close()}}

function openBonus(b){
  const isNew=!b;
  b=b||{id:uid(),name:'',xp:40,stats:[filter==='all'?'str':filter],count:0};
  let h='<h3>'+(isNew?'Нове досягнення':'Досягнення')+'</h3>';
  h+='<div class="f"><label>Назва</label><input type="text" id="bName" value="'+esc(b.name)+'" placeholder="Наприклад: пройти 50 км"></div>';
  h+='<div class="f"><label>Стати</label><div class="mchips" id="bStats">';
  STATS.forEach(s=>h+='<button class="mchip'+(b.stats.includes(s.k)?' on':'')+'" data-k="'+s.k
    +'" style="'+(b.stats.includes(s.k)?'color:'+s.color+';border-color:'+s.line+';background:'+s.soft:'')+'">'+s.emo+' '+s.name+'</button>');
  h+='</div></div>';
  h+='<div class="f"><label>Бали</label><input type="number" id="bXp" min="1" value="'+b.xp+'">'
    +'<p class="note">Досягнення можна зараховувати повторно — лічильник покаже, скільки разів.</p></div>';
  h+='<div class="mrow">'+(isNew?'':'<button class="btn del" id="bDel">✕</button>')
    +'<button class="btn" id="bCancel">Назад</button><button class="btn pri" id="bSave">Зберегти</button></div>';
  open(h);
  const dr={stats:[...b.stats]};
  modal.querySelectorAll('#bStats .mchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,s=ST[k],i=dr.stats.indexOf(k);
    if(i>-1){if(dr.stats.length===1)return;dr.stats.splice(i,1);c.classList.remove('on');c.style.cssText=''}
    else{dr.stats.push(k);c.classList.add('on');c.style.color=s.color;c.style.borderColor=s.line;c.style.background=s.soft}});
  modal.querySelector('#bCancel').onclick=close;
  const del=modal.querySelector('#bDel');
  if(del)del.onclick=()=>{S.bonuses=S.bonuses.filter(x=>x.id!==b.id);save();render();close();toast('Видалено')};
  modal.querySelector('#bSave').onclick=()=>{
    const n=modal.querySelector('#bName').value.trim();if(!n){toast('Впиши назву');return}
    b.name=n;b.stats=SK.filter(k=>dr.stats.includes(k));b.xp=Math.max(1,+modal.querySelector('#bXp').value||1);
    if(isNew)S.bonuses.unshift(b);save();render();close()}}

document.getElementById('btnNewTask').onclick=()=>openTask(null);
document.getElementById('btnNewBonus').onclick=()=>openBonus(null);
document.getElementById('quickBtn').onclick=quickAdd;
document.getElementById('quickAdd').addEventListener('keydown',e=>{if(e.key==='Enter')quickAdd()});
function quickAdd(){const i=document.getElementById('quickAdd'),v=i.value.trim();if(!v)return;
  const t={id:uid(),name:v,diff:'low',stats:[filter==='all'?'str':filter],multi:false,once:false,doneOn:null,count:0};
  S.tasks.unshift(t);i.value='';save();render();openTask(t)}

document.getElementById('btnHist').onclick=()=>{
  const days=[],t=new Date();t.setHours(12,0,0,0);
  for(let i=13;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
  let h='<h3>Останні 14 днів</h3><div class="f">';
  days.forEach(iso=>{const lg=S.log[iso]||{},tot=SK.reduce((a,k)=>a+(lg[k]||0),0);
    h+='<div class="hrow"><span class="hdate">'+iso.slice(5).replace('-','.')+'</span><span class="hbars">';
    SK.forEach(k=>{const v=Math.max(0,lg[k]||0),hh=Math.min(16,Math.round(v/40*16));
      h+='<span class="hb" style="height:'+Math.max(3,hh)+'px;background:'+(v?ST[k].color:'#E4EDF7')+'"></span>'});
    h+='</span><span class="htot" style="color:'+(tot>0?'#5A8F76':(tot<0?'#C98080':'#B4C4D6'))+'">'
      +(tot>0?'+':'')+tot+'</span></div>'});
  h+='</div><div class="f"><label>Твої звання</label><div style="font-size:13px;line-height:1.85">';
  STATS.forEach(s=>{const st=S.stats[s.k];
    h+='<b style="color:'+s.color+'">'+rankOf(s.k,st.lvl).full+'</b> — рівень '+st.lvl
      +'<br><span style="color:#9DAFC4;font-size:11.5px">'+st.streak+' дн. поспіль · рекорд '+st.best
      +' · усього '+st.total+' балів</span><br>'});
  h+='</div></div><div class="mrow"><button class="btn" id="hClose">Закрити</button></div>';
  open(h);modal.querySelector('#hClose').onclick=close};

document.getElementById('btnSet').onclick=()=>{
  const pace=S.pace||1;
  let h='<h3>Налаштування</h3>';
  h+='<div class="f"><label>Темп прокачки</label><div class="mchips" id="sPace">';
  [['0.7','швидше'],['1','звично'],['1.4','повільніше']].forEach(([v,l])=>
    h+='<button class="mchip'+(String(pace)===v?' on':'')+'" data-v="'+v+'">'+l+'</button>');
  h+='</div><p class="note">Впливає на те, скільки балів треба на рівень. Зараз до найвищого звання — '
    +Math.round(sumToTen()*pace)+' балів.</p></div>';
  h+='<div class="f"><label>Штраф за день без прогресу</label><input type="number" id="sPen" min="0" max="50" value="'+S.penalty+'">';
  h+='<p class="note">Списується з кожної стати, яка за день не отримала жодного бала. За кожен наступний день поспіль штраф росте: ×2, ×3, далі ×4. Постав 0, щоб вимкнути.</p></div>';
  h+='<div class="f"><label>Передбачення — по одному на рядок</label>';
  h+='<textarea id="sFort" placeholder="Одне передбачення на рядок">'+esc((S.fortunes||[]).join('\n'))+'</textarea>';
  h+='<p class="note">Зараз їх '+(S.fortunes||[]).length+'. Показується одне на день, випадково, без повторів найближчим часом.</p></div>';
  h+='<div class="f"><label>Перенести на інший пристрій</label><div class="mrow" style="margin-top:0">';
  h+='<button class="btn" id="sExp">Експорт</button><button class="btn" id="sImp">Імпорт</button></div>';
  h+='<p class="note">Дані живуть тільки в цьому браузері. Щоб відкрити прогрес на телефоні — експортуй файл і імпортуй його там.</p></div>';
  h+='<div class="f"><label>Скинути</label><button class="btn del" id="sReset" style="width:100%;flex:1">Стерти все</button></div>';
  h+='<div class="mrow"><button class="btn" id="sClose">Закрити</button><button class="btn pri" id="sSave">Зберегти</button></div>';
  open(h);
  let np=pace;
  modal.querySelectorAll('#sPace .mchip').forEach(c=>c.onclick=()=>{np=+c.dataset.v;
    modal.querySelectorAll('#sPace .mchip').forEach(x=>x.classList.remove('on'));c.classList.add('on')});
  modal.querySelector('#sClose').onclick=close;
  modal.querySelector('#sSave').onclick=()=>{
    S.penalty=Math.max(0,+modal.querySelector('#sPen').value||0);
    S.pace=np;
    const lines=modal.querySelector('#sFort').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(lines.length)S.fortunes=lines;
    save();render();close();toast('Збережено')};
  modal.querySelector('#sExp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='waymark-'+today()+'.json';
    a.click();URL.revokeObjectURL(a.href);toast('Файл збережено')};
  modal.querySelector('#sImp').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
    i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.stats||!d.tasks)throw 0;
        S=Object.assign(structuredClone(blank),d);
        SK.forEach(k=>{if(!S.stats[k])S.stats[k]={xp:0,lvl:1,total:0,streak:0,best:0,miss:0};
          if(S.stats[k].miss==null)S.stats[k].miss=0});
        if(!S.fortunes||!S.fortunes.length)S.fortunes=FORTUNES.slice();
        save();rollover();render();close();toast('Дані завантажено')}catch(e){toast('Файл не підходить')}};
      r.readAsText(f)};i.click()};
  modal.querySelector('#sReset').onclick=()=>{
    if(!confirm('Стерти всі завдання й прогрес? Це не можна скасувати.'))return;
    localStorage.removeItem(KEY);S=load();save();render();close();toast('Готово')}};

function sumToTen(){let s=0;for(let l=1;l<10;l++)s+=60+40*(l-1)+6*(l-1)*(l-1);return s}

document.querySelectorAll('.nv').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.nv').forEach(x=>x.classList.remove('on'));n.classList.add('on');
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.dataset.p===n.dataset.p));
  window.scrollTo({top:0,behavior:'instant'})});

function goTab(p){const n=document.querySelector('.nv[data-p='+p+']');if(n)n.click()}

rollover();
const fresh=pickFortune();
render();
if(fresh)showFortuneModal();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){
  rollover();const f=pickFortune();render();if(f)showFortuneModal()}});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
